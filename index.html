  React.useEffect(() => {
    window.__back = () => {
      // 웹에서 엣지 스와이프를 직접 처리했으면, 뒤따라 오는 네이티브의 .ended
      // 호출은 같은 제스처의 중복이다(옛 네이티브 바이너리 호환용 경로).
      if (Date.now() - edgeHandledAtRef.current < 700) return true;
      if (overScreen || screen !== 'main') { goBack(); return true; }
      if (tab === 'more' && moreSub) { setMoreSub(null); return true; }
      return false;
    };
    return () => { try { delete window.__back; } catch {} };
  }, [screen, overScreen, tab, moreSub]);

  // Native Liquid Glass notification bell (top-right): show only on home/main,
  // mirror the unread count, and expose the tap target.
  React.useEffect(() => {
    try { window.webkit?.messageHandlers?.bell?.postMessage({ show: tab === 'home' && screen === 'main', unread: unreadCount }); } catch {}
  }, [tab, screen, unreadCount, nativeTabBar]);
  React.useEffect(() => { window.__jumoNotif = goNotif; });

  // Native detail-screen toolbar (glass back + follow): drive visibility/state.
  React.useEffect(() => { window.__nativeChrome = nativeTabBar; }, [nativeTabBar]);
  React.useEffect(() => {
    try {
      // 뒤로가기는 화면이 0.34s 동안 슬라이드 아웃되는데, screen 은 그 뒤에야 'main'
      // 이 된다. closing 을 함께 보고 슬라이드 시작과 동시에 크롬을 접어야 상단
      // 버튼이 사라지는 화면과 겹쳐 보이지 않는다.
      const hiding = closing || dragging;
      // 2단(팀 상세)이 얹혀 있으면 1단 전용 크롬 — 팔로우·알림 벨·우상단 액션은
      // 접는다. 팀 화면 위에 남아 겹쳐 보이면 안 된다. 뒤로가기만 살려 둔다:
      // 그게 2단을 걷어내는 버튼이다(웹 BackBtn 은 네이티브 크롬에선 숨는다).
      const over = !!overScreen;
      window.webkit?.messageHandlers?.detailbar?.postMessage({
        back: !hiding && (over || ['match', 'player', 'team', 'notif', 'addplayer'].includes(screen)
          || (tab === 'more' && screen === 'main' && !!moreSub)),
        followShow: !hiding && !over && screen === 'player' && !!selectedPlayer,
        followOn: !!(selectedPlayer && followed.has(selectedPlayer.id)),
        // 선수별 알림 벨 — 팔로우 중인 선수 상세에서만
        muteShow: !hiding && !over && screen === 'player' && !!selectedPlayer && followed.has(selectedPlayer.id),
        muteOn: !!(selectedPlayer && mutedPlayers.has(selectedPlayer.id)),
        // accent: 저장·확정 성격의 액션만 브랜드 옐로. 나머지 상단 크롬은 흰색.
        action: over ? { show: false, label: '', icon: '', accent: false }
              : (tab === 'players' && screen === 'main') ? { show: true, label: '선수 편집', icon: 'pencil', accent: false }
              : (screen === 'addplayer') ? { show: true, label: '완료' + (followed.size > 0 ? ` (${followed.size})` : ''), icon: '', accent: true }
              : { show: false, label: '', icon: '', accent: false },
      });
    } catch {}
  }, [screen, overScreen, selectedPlayer, followed, nativeTabBar, tab, moreSub, mutedPlayers, closing, dragging]);
  React.useEffect(() => {
    window.__jumoFollow = () => {
      if (!selectedPlayer) return;
      const on = followed.has(selectedPlayer.id);
      if (on && !window.confirm(`${selectedPlayer.name} 선수를 팔로우 해제하시겠어요?`)) return;
      toggleFollow(selectedPlayer.id);
    };
    // 네이티브 알림 벨 탭 → 선수별 음소거 토글
    window.__jumoMuteToggle = () => {
      if (screen !== 'player' || !selectedPlayer) return;
      togglePlayerMute(selectedPlayer.id);
    };
    // Native top-right action pill (선수 편집 / 완료) tap → route by screen.
    window.__jumoTopAction = () => {
      if (tab === 'players' && screen === 'main') goAddPlayer();
      else if (screen === 'addplayer') goBack();
    };
  });

  const HomeComponent = [HomeV1, HomeV2, HomeV3][tweaks.homeVariant] || HomeV1;

  const homeVariantNames = ['카드 스택', '에디토리얼', '컴팩트'];

  // Names of currently-followed players — used to hide unfollowed players'
  // matches from Home/Schedule/Players (unfollowing in 선수 편집 must remove
  // their content everywhere, not just the 선수 탭).
  const followedNames = React.useMemo(
    () => new Set(ALL_PLAYERS.filter(p => followed.has(p.id)).map(p => p.name)),
    [followed]
  );

  // ── 라이브 액티비티 (잠금화면 · 다이나믹 아일랜드) ──────────────────
  // 표시는 네이티브 SwiftUI 가 하고, '어느 경기를 언제 띄울지'는 경기 데이터를
  // 아는 여기서 정한다. 팔로우한 선수가 뛰는 라이브 경기 하나만 띄운다
  // (여러 개를 띄우면 잠금화면이 지저분해지고 갱신 예산도 나눠 쓴다).
  const liveActivityRef = React.useRef({ matchId: null, sig: null });
  // 알림 설정의 '라이브 액티비티' 스위치. 설정 화면이 저장 후 이벤트를 쏘면 따라간다.
  const [liveActivityOn, setLiveActivityOn] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('jumo_notif_settings') || '{}').liveActivity !== false; }
    catch { return true; }
  });
  React.useEffect(() => {
    const sync = () => {
      try { setLiveActivityOn(JSON.parse(localStorage.getItem('jumo_notif_settings') || '{}').liveActivity !== false); }
      catch {}
    };
    window.addEventListener('jumo:notif-settings', sync);
    return () => window.removeEventListener('jumo:notif-settings', sync);
  }, []);

  React.useEffect(() => {
    const mh = window.webkit?.messageHandlers?.liveactivity;
    if (!mh) return;   // 웹·구버전에서는 조용히 없음

    if (!liveActivityOn) {
      // 껐으면 떠 있던 것도 내린다. ref 는 세션마다 초기화되므로 조건을 걸면
      // 앱 재시작 뒤엔 남아 있는 액티비티를 못 내린다 — 무조건 보낸다
      // (네이티브 endCurrent() 는 없으면 no-op).
      mh.postMessage({ action: 'end' });
      liveActivityRef.current = { matchId: null, sig: null };
      return;
    }

    // '미출전'·'벤치'로 확인된 선수는 띄우지 않는다. 아직 모르는 상태
    // (출전 예상)는 띄운다 — 라인업이 늦게 나오는 리그가 있어서다.
    const notBenched = (kp) => !/미출전|벤치/.test(kp?.event || '');
    const mine = (liveMatches || []).filter(m =>
      (m.live || m.time === 'LIVE') &&
      (m.koreanPlayers || [m.koreanPlayer]).filter(Boolean)
        .some(kp => followedNames.has(kp.name) && notBenched(kp)));
    // 여러 경기가 동시에 라이브면 우리 선수가 뛰는 쪽을 먼저, 그다음 킥오프 순.
    mine.sort((a, b) => new Date(a.fullDate || 0) - new Date(b.fullDate || 0));
    const m = mine[0];

    if (!m) {
      if (liveActivityRef.current.matchId) {
        mh.postMessage({ action: 'end' });
        liveActivityRef.current = { matchId: null, sig: null };
      }
      return;
    }

    // 더비처럼 팔로우 선수가 둘 이상이면 '기록 있는 선수 → 뛰는 선수 → 첫 선수'
    // 순으로 고른다. 그냥 첫 선수를 잡으면 벤치에 앉은 선수를 잠금화면에 띄운다.
    const mineInMatch = (m.koreanPlayers || [m.koreanPlayer]).filter(Boolean)
      .filter(k => followedNames.has(k.name) && notBenched(k));
    const kp = mineInMatch.find(k => (k.matchGoals || 0) > 0 || (k.matchAssists || 0) > 0)
            || mineInMatch.find(isPlayingKorean)
            || mineInMatch[0] || m.koreanPlayer;
    const goals = kp?.matchGoals || 0;
    const assists = kp?.matchAssists || 0;
    // 잠금화면은 좁다 — 상태를 한 줄로 압축한다.
    const line = goals || assists ? '' :
      (kp?.event === '선발 출전' || kp?.event === '출전 중') ? (kp?.minutesPlayed ? `${kp.minutesPlayed}분 출전` : '출전 중')
      : (kp?.event === '벤치' || kp?.event === '벤치 대기') ? '벤치'
      : (kp?.event || '');
    const payload = {
      matchId: String(m.id),
      homeName: m.home?.name || '', awayName: m.away?.name || '',
      homeAbbr: m.home?.code || '', awayAbbr: m.away?.code || '',
      // 엠블럼 URL — 네이티브가 받아서 App Group 에 캐시한다(위젯은 네트워크 불가).
      homeLogo: m.home?.logo || '', awayLogo: m.away?.logo || '',
      playerName: kp?.name || '', playerNumber: kp?.number || 0,
      competition: (m.competition || m.sport || '').replace(/^[⚽⚾🏀🎾]\s*/, ''),
      homeScore: Number(m.home?.score) || 0, awayScore: Number(m.away?.score) || 0,
      minute: m.liveMinute || m.time || '', status: 'live',
      playerLine: line, playerGoals: goals, playerAssists: assists,
    };
    // 내용이 그대로면 보내지 않는다 — iOS 는 액티비티 갱신 횟수에 예산이 있어
    // 의미 없는 갱신을 쌓으면 정작 골이 났을 때 반영이 밀린다.
    const sig = [payload.homeScore, payload.awayScore, payload.minute,
                 payload.playerLine, goals, assists].join('|');
    const prev = liveActivityRef.current;
    if (prev.matchId === payload.matchId && prev.sig === sig) return;
    mh.postMessage({ ...payload, action: prev.matchId === payload.matchId ? 'update' : 'start' });
    liveActivityRef.current = { matchId: payload.matchId, sig };
  }, [liveMatches, followedNames, liveActivityOn]);

  // 네이티브가 액티비티 푸시 토큰을 받으면 여기로 넘겨준다 → 서버에 저장해
  // 앱이 꺼져 있어도 크론이 점수를 갱신할 수 있게 한다.
  React.useEffect(() => {
    window.__jumoLiveToken = (matchId, token) => {
      try {
        SB.from('live_activity_tokens').upsert({
          device_id: deviceId, match_id: String(matchId), token,
          updated_at: new Date().toISOString(),
        }, { onConflict: 'device_id' }).then(() => {}, () => {});
      } catch {}
    };
    return () => { delete window.__jumoLiveToken; };
  }, [deviceId]);

  // ── 키보드가 떠도 상단이 밀리지 않게 ────────────────────────────────
  // iOS 는 키보드가 올라오면 입력창을 보이게 하려고 웹뷰 스크롤뷰를 통째로
  // 밀어 올린다. 앱 컨테이너가 position:fixed 라 그것까지 따라 올라가고,
  // 결과적으로 '보내기'·'저장' 같은 헤더 버튼이 화면 밖으로 사라졌다(제보).
  // 컨테이너 높이를 visualViewport 에 맞춰 줄이면 iOS 가 밀어 올릴 이유가
  // 없어진다. (셸(ios-frame)을 고치면 빌드가 필요해 앱 스크립트에서 처리한다.)
  React.useEffect(() => {
    const vv = window.visualViewport;
    const isNative = !!(window.Capacitor?.getPlatform?.() === 'ios');
    if (!vv || !isNative) return;
    const el = document.getElementById('root')?.firstElementChild;
    if (!el) return;
    const apply = () => {
      // position:fixed 는 '레이아웃 뷰포트' 기준이라, iOS 가 시각 뷰포트를 밀어
      // 올리면 그만큼 위로 딸려 올라간다. offsetTop 만큼 도로 내려주고 높이는
      // 시각 뷰포트에 맞춘다 — 그래야 헤더가 상태바 밑에 그대로 남는다.
      el.style.bottom = 'auto';                      // inset:0 의 bottom 을 풀어야 height 가 먹는다
      el.style.top = Math.round(vv.offsetTop) + 'px';
      el.style.height = Math.round(vv.height) + 'px';
      // 높이를 줄이고 나면 웹뷰가 스크롤을 유지할 이유가 없다. 0 으로 되돌려
      // offsetTop 이 0 으로 수렴하게 하면 네이티브 상단 크롬과도 어긋나지 않는다.
      if (window.scrollY) window.scrollTo(0, 0);
    };
    vv.addEventListener('resize', apply);
    vv.addEventListener('scroll', apply);
    apply();
    return () => {
      vv.removeEventListener('resize', apply);
      vv.removeEventListener('scroll', apply);
      el.style.height = ''; el.style.bottom = ''; el.style.top = '';
    };
  }, []);

  // ── 하단 탭바 자동 숨김 ────────────────────────────────────────────
  // 스크롤을 내리면 접고 올리면 편다. 네이티브 탭바(iOS 26)는 UITabBarController
  // 라 JS 에서 직접 못 건드리므로 tabbar 채널로 상태만 넘긴다.
  // 스크롤 방향을 보고 하단 탭바를 접었다 편다. 네이티브·웹 양쪽에 같은 판정을 쓴다.
  const [tabBarHidden, setTabBarHidden] = React.useState(false);
  const lastTabScrollY = React.useRef(0);
  const onTabBarScroll = React.useCallback((y) => {
    const dy = y - lastTabScrollY.current;
    if (Math.abs(dy) < 8) return;
    lastTabScrollY.current = y;
    const hide = y > 24 && dy > 0;
    setTabBarHidden(hide);
    try { window.webkit?.messageHandlers?.tabbar?.postMessage({ hide }); } catch {}
  }, []);
  // 탭을 옮기거나 상세로 들어가면 항상 펼친 상태로 되돌린다.
  React.useEffect(() => { setTabBarHidden(false); lastTabScrollY.current = 0; }, [tab, screen]);

  const filteredLiveMatches = React.useMemo(
    () => liveMatches
      .filter(m =>
        isMatchAllowed(m, sportFeeds) &&
        (m.koreanPlayers || [m.koreanPlayer]).some(kp => kp && followedNames.has(kp.name))
      )
      // 한 경기에 우리 선수가 둘 이상일 수 있다 — 같은 팀(미트윌란: 조규성+이한범)이거나
      // 코리안 더비(양 팀에 한 명씩). 팔로우한 선수를 앞으로 정렬해 두면 카드 주인공·
      // 히어로·주간 목록이 모두 koreanPlayers[0] 기준이라 화면 전체가 함께 맞고,
      // followedKoreans는 '오늘의 경기' 카드가 여러 명을 한 장에 싣는 데 쓴다.
      .map(m => {
        const list = (m.koreanPlayers || [m.koreanPlayer]).filter(Boolean);
        const mine = list.filter(kp => followedNames.has(kp.name));
        if (list.length < 2) return { ...m, followedKoreans: mine };
        const ordered = [...mine, ...list.filter(kp => !followedNames.has(kp.name))];
        return { ...m, koreanPlayers: ordered, koreanPlayer: ordered[0], followedKoreans: mine };
      }),
    [liveMatches, sportFeeds, followedNames]
  );

  // 드래그 중 다른 상태 변화로 리렌더가 끼어들어도 위치가 튀지 않도록, 렌더
  // 시점의 ref 값으로 인라인 스타일을 만든다(프레임 갱신은 applyDrag 가 DOM 에 직접).
  const dragW = dragging ? edgeWidth() : 0;
  const dragP = dragW ? Math.max(0, Math.min(1, dragXRef.current / dragW)) : 0;
  // 2단이 열려 있으면 미는 건 2단, 패럴랙스를 받는 건 1단이다(메인은 그대로).
  const dragTop = dragging && !!overScreen;
  const parallaxX = -dragW * 0.25 * (1 - dragP);

  return (
    <ToastCtx.Provider value={showToast}>
    <ExplainCtx.Provider value={setExplain}>
    <div style={{ '--acc': tweaks.accentColor, fontFamily:"-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif", WebkitFontSmoothing:'antialiased' }}>
      {/* 캐시로 낡은 내용을 먼저 보여주는 동안 '갱신 중'임을 분명히 알린다.
          스켈레톤이 떠 있는 진짜 첫 로드에는 띄우지 않는다. */}
      <RefreshBar show={refreshing && !isInitialLoad && liveMatches.length > 0}/>
      <IOSDevice dark={true} width={deviceDimensions.width} height={deviceDimensions.height}>
        <div style={{ display:'flex', flexDirection:'column', height:'100%', background:'var(--bg)', paddingBottom: nativeTabBar ? '0px' : (IS_IOS26_PLUS ? 'calc(74px + env(safe-area-inset-bottom))' : '70px'), position:'relative' }}>
          {toast && (
            <div key={toast.id} style={{ position:'fixed', left:'50%', bottom:'calc(78px + env(safe-area-inset-bottom))', transform:'translateX(-50%)', zIndex:200, background:'rgba(0,0,0,0.85)', color:'#fff', padding:'10px 18px', borderRadius:22, fontSize:13, fontWeight:600, letterSpacing:-0.2, whiteSpace:'nowrap', boxShadow:'0 6px 24px rgba(0,0,0,0.35)', backdropFilter:'blur(10px)', WebkitBackdropFilter:'blur(10px)', animation:'toastIn 0.22s ease-out', pointerEvents:'none' }}>
              {toast.message}
            </div>
          )}
          {/* 뒤 화면은 상세를 볼 때도 마운트해 둔다. 예전엔 드래그가 시작될 때
              비로소 마운트돼서, '오늘의 경기' 캐러셀의 자동 스크롤이 제스처
              도중에 다시 돌아 카드가 옆으로 미끄러졌다(제보). 살려두면 스크롤
              위치도 그대로 보존되고, 제스처 시작 시점의 마운트 부담도 사라진다. */}
          <div ref={behindRef} style={{ display:'flex', flexDirection:'column', flex:1, minHeight:0, transform: (dragging && !dragTop) ? `translateX(${parallaxX}px)` : undefined, willChange: dragging ? 'transform' : undefined, pointerEvents: screen === 'main' ? undefined : 'none' }}>
              <div style={{ display: tab === 'home' ? 'contents' : 'none' }}><HomeComponent onMatch={goMatch} onPlayer={goPlayer} onNotif={goNotif} onTabBarScroll={onTabBarScroll} tweaks={tweaks} liveApiMatches={filteredLiveMatches} isLoading={isInitialLoad && apiLoading} scrollTopKey={tabScrollKeys.home} onRefresh={fetchLiveMatches} unreadCount={unreadCount} nativeTabBar={nativeTabBar}/></div>
              <div style={{ display: tab === 'schedule' ? 'contents' : 'none' }}><ScheduleScreen onMatch={goMatch} onTabBarScroll={onTabBarScroll} liveApiMatches={filteredLiveMatches} isLoading={isInitialLoad && apiLoading} onRefresh={fetchLiveMatches} isActive={tab === 'schedule'} scrollTopKey={tabScrollKeys.schedule}/></div>
              <div style={{ display: tab === 'players' ? 'contents' : 'none' }}><PlayersScreen onPlayer={goPlayer} onAdd={goAddPlayer} onToggleFollow={toggleFollow} onTabBarScroll={onTabBarScroll} followed={followed} playerOrder={playerOrder} sportOrder={sportOrder} statsCache={playerStatsCache} isLoading={isInitialLoad && apiLoading} onRefresh={fetchLiveMatches} scrollTopKey={tabScrollKeys.players} liveApiMatches={filteredLiveMatches} sportFeeds={sportFeeds}/></div>
              <div style={{ display: tab === 'news' ? 'contents' : 'none' }}><NewsScreen sportFeeds={sportFeeds} scrollTopKey={tabScrollKeys.news} followedNames={followedNames} onTabBarScroll={onTabBarScroll}/></div>
              <div style={{ display: tab === 'more' ? 'contents' : 'none' }}><MoreScreen sportFeeds={sportFeeds} onToggleSportFeed={toggleSportFeed} profile={profile} onUpdateProfile={updateProfile} sub={moreSub} setSub={setMoreSub} onShowGuide={() => setShowOnboarding(true)} deviceId={deviceId}/></div>
              {dragging && !dragTop && <div ref={scrimRef} style={{ position:'absolute', inset:0, zIndex:40, pointerEvents:'none', background:`rgba(0,0,0,${0.18 * (1 - dragP)})` }}/>}
          </div>
          {screen !== 'main' && (
          <div ref={overlayRef} className={(closing && !dragging) ? 'screen-slide-out' : ''} style={{ position:'absolute', inset:0, zIndex:50, background:'var(--bg)', display:'flex', flexDirection:'column', transform: dragging ? (dragTop ? `translateX(${parallaxX}px)` : `translateX(${dragXRef.current}px)`) : undefined, transition:'none', willChange: dragging ? 'transform' : undefined, boxShadow: (dragging && !dragTop) ? '-8px 0 24px rgba(0,0,0,0.45)' : undefined }}>
          {screen === 'match' && selectedMatch && (
            <LiveDetailScreen match={selectedMatch} onBack={goBack} liveApiMatches={liveMatches} onPlayer={goPlayer} onTeam={goTeam}/>
          )}
          {screen === 'team' && selectedTeam && (
            <TeamScreen team={selectedTeam} onBack={goBack} onMatch={goMatch} liveApiMatches={liveMatches}/>
          )}
          {screen === 'player' && selectedPlayer && (
            <PlayerScreen player={selectedPlayer} onBack={goBack} onMatch={goMatch} liveApiMatches={liveMatches} statsCache={playerStatsCache} followedSet={followed} onToggleFollow={toggleFollow} muted={mutedPlayers.has(selectedPlayer.id)} onToggleMute={() => togglePlayerMute(selectedPlayer.id)}/>
          )}
          {screen === 'addplayer' && (
            <AddPlayerScreen followed={followed} onToggle={toggleFollow} onBack={goBack} playerOrder={playerOrder} setPlayerOrder={setPlayerOrder} sportOrder={sportOrder} setSportOrder={setSportOrder}/>
          )}
          {screen === 'notif' && (
            <div style={{ flex:1, overflow:'auto', background:'var(--bg)' }} className="scrollbar-hide screen-slide-in">
              <div style={{ padding:'12px 20px 8px', display:'flex', alignItems:'center', gap:10 }}>
                <button onClick={goBack} style={{ ...LG.base, ...LG.circle, color:'rgba(255,255,255,0.85)', visibility: nativeTabBar ? 'hidden' : 'visible' }}>
                  <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M8.5 1.5L1.5 8.5l7 7" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </button>
                <div style={{ fontSize:22, fontWeight:700, color:'var(--text)', letterSpacing:-0.5 }}>알림</div>
              </div>
              <NotifScreen notifications={allNotifs} onMatch={goMatch}/>
            </div>
          )}
          </div>
          )}
          {/* 2단 — 상세 위에 얹히는 팀 화면. 1단은 그대로 뒤에 남아 있어서,
              뒤로 가면 홈이 아니라 경기 상세로 돌아온다. */}
          {overScreen === 'team' && selectedTeam && (
          <div ref={overlayTopRef} style={{ position:'absolute', inset:0, zIndex:60, background:'var(--bg)', display:'flex', flexDirection:'column',
                transform: dragging ? `translateX(${dragXRef.current}px)` : undefined, transition:'none',
                willChange: dragging ? 'transform' : undefined, boxShadow: dragging ? '-8px 0 24px rgba(0,0,0,0.45)' : undefined }}>
            <TeamScreen team={selectedTeam} onBack={goBack} onMatch={goMatch} liveApiMatches={liveMatches}/>
          </div>
          )}
          {!nativeTabBar && <TabBar active={tab} onTab={handleTab} elevated={showOnboarding} hidden={tabBarHidden}/>}
          {showOnboarding && <OnboardingTour onDone={finishOnboarding} onTab={setTab} followed={followed} onToggleFollow={toggleFollow}/>}
        </div>
      </IOSDevice>

      {/* Tweaks panel */}
      {showTweaks && (
        <div style={{ position:'fixed', bottom:24, right:24, background:'var(--card)', border:'0.5px solid var(--btn-bg)', borderRadius:20, padding:'20px', width:260, boxShadow:'0 20px 60px rgba(0,0,0,0.6)', zIndex:9999, animation:'slideUp 0.2s ease' }}>
          <div style={{ fontSize:13, fontWeight:700, color:'var(--text2)', letterSpacing:1.5, textTransform:'uppercase', marginBottom:16 }}>Tweaks</div>

          <div style={{ marginBottom:16 }}>
            <div style={{ fontSize:12, color:'var(--text3)', marginBottom:8, fontWeight:600 }}>홈 스타일</div>
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {homeVariantNames.map((name, i) => (
                <button key={i} onClick={() => updateTweaks('homeVariant', i)} style={{ background: tweaks.homeVariant===i ? 'var(--acc)' : 'var(--border)', border:'none', borderRadius:10, height:CTRL_H, boxSizing:'border-box', padding:'0 14px', color: tweaks.homeVariant===i ? '#000' : 'var(--text-60)', fontSize:13, fontWeight:600, cursor:'pointer', textAlign:'left' }}>
                  {i===0 ? '1️⃣' : i===1 ? '2️⃣' : '3️⃣'} {name}
                </button>
              ))}
            </div>
          </div>

          <div style={{ marginBottom:16 }}>
            <div style={{ fontSize:12, color:'var(--text3)', marginBottom:8, fontWeight:600 }}>강조 색상</div>
            <div style={{ display:'flex', gap:8 }}>
              {['#e03030','#0071e3','#2cc96b','#f5a623','#9b59b6'].map(c => (
                <button key={c} onClick={() => updateTweaks('accentColor', c)} style={{ width:32, height:32, borderRadius:'50%', background:c, border: tweaks.accentColor===c ? '2.5px solid #fff' : '2.5px solid transparent', cursor:'pointer' }}/>
              ))}
            </div>
          </div>

          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
            <span style={{ fontSize:13, color:'var(--text-60)', fontWeight:600 }}>선수 사진 플레이스홀더</span>
            <button onClick={() => updateTweaks('showPlayerPhoto', !tweaks.showPlayerPhoto)} style={{ width:40, height:24, borderRadius:12, background: tweaks.showPlayerPhoto ? 'var(--acc)' : 'var(--text6)', border:'none', cursor:'pointer', position:'relative', transition:'background 0.2s' }}>
              <div style={{ position:'absolute', top:2, left: tweaks.showPlayerPhoto ? 18 : 2, width:20, height:20, borderRadius:'50%', background:'#fff', transition:'left 0.2s' }}/>
            </button>
          </div>
        </div>
      )}
    </div>
    <ExplainTip data={explain} onClose={() => setExplain(null)}/>
    </ExplainCtx.Provider>
    </ToastCtx.Provider>
  );
}

// 스플래시는 고정 시간이 아니라 '첫 프레임이 그려진 순간' 내린다.
// capacitor.config 의 launchShowDuration 은 이제 상한(안전장치)일 뿐이다.
function hideSplashWhenPainted() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try { window.Capacitor?.Plugins?.SplashScreen?.hide({ fadeOutDuration: 180 }); } catch (e) {}
  }));
}

// 렌더 중 예외가 나면 React 는 트리를 통째로 버린다 — 그러면 웹 영역이 검게
// 비고 아무 조작도 안 먹는다(실제로 라인업 탭에서 그랬다). 경계를 두어
// 최소한 '무슨 일이 났고 어떻게 빠져나가는지'는 보이게 한다.
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) {
    // OTA 번들이 깨졌을 가능성 → 부팅 표식을 남겨 다음 실행에서 번들 사본으로
    // 되돌아가게 한다(로더가 이 값을 보고 캐시를 버린다).
    try { localStorage.setItem('jumo.ota.boot', '1'); } catch (e) {}
    try { console.error('JUMO-ERR', err && (err.stack || err.message)); } catch (e) {}
  }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{ minHeight:'100vh', background:'#0b0b0d', color:'#fff',
                    display:'flex', flexDirection:'column', alignItems:'center',
                    justifyContent:'center', gap:14, padding:'40px 24px', textAlign:'center' }}>
        <div style={{ fontSize:40 }}>😵</div>
        <div style={{ fontSize:16, fontWeight:800 }}>화면을 그리다 문제가 생겼어요</div>
        <div style={{ fontSize:13, color:'rgba(255,255,255,0.5)', lineHeight:1.6 }}>
          앱을 다시 시작하면 대부분 해결됩니다.<br/>계속 반복되면 알려주세요.
        </div>
        <button onClick={() => location.reload()}
          // --acc 는 App 루트 div 에서 주입된다 — 경계는 그 바깥이라 값이 없다.
          // 여기서만 브랜드 옐로를 직접 쓴다(안 그러면 검은 글씨가 검은 배경에 묻힘).
          style={{ marginTop:6, height:38, boxSizing:'border-box', padding:'0 20px',
                   borderRadius:19, border:'none', background:'#f5c400',
                   color:'#000', fontSize:14, fontWeight:800, cursor:'pointer' }}>
          다시 시도
        </button>
        <div style={{ marginTop:10, fontSize:10, color:'rgba(255,255,255,0.35)', maxWidth:320,
                      wordBreak:'break-all', opacity:0.8 }}>
          {String(this.state.err && (this.state.err.message || this.state.err)).slice(0, 200)}
        </div>
      </div>
    );
  }
}

try {
  ReactDOM.createRoot(document.getElementById('root')).render(
    <ErrorBoundary><App/></ErrorBoundary>
  );
  hideSplashWhenPainted();
} catch(e) {
  document.getElementById('root').innerHTML = '<div style="color:red;padding:20px;font-family:monospace;font-size:12px;white-space:pre-wrap">렌더링 에러:\n' + e.message + '\n\n' + e.stack + '</div>';
}
</script>
<div id="root"></div>
</body>
</html>
