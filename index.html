// ─── TODAY MATCHES CAROUSEL ──────────────────────────────────
function TodayMatchesCarousel({ todayMatches, matches, now, onMatch, tweaks }) {
  const scrollRef = React.useRef(null);
  const fade = useEdgeFade(scrollRef);
  // 카드 수가 바뀌거나 마운트 직후 자동 스크롤이 끝난 뒤에도 다시 재본다.
  React.useEffect(() => {
    const t = setTimeout(fade.update, 250);
    return () => clearTimeout(t);
  }, [todayMatches.length, fade.update]);

  // Auto-scroll to first future match on mount
  React.useEffect(() => {
    if (!scrollRef.current || todayMatches.length === 0) return;

    const firstFutureIndex = todayMatches.findIndex(m => {
      if (m.live || m.time === 'LIVE') return true;
      const matchDate = new Date(m.fullDate);
      return matchDate >= now;
    });

    const cardWidth = 292; // 280px card + 12px gap

    if (firstFutureIndex > 0) {
      // Scroll to first future match, keeping 16px left padding
      const scrollPosition = (firstFutureIndex * cardWidth);
      setTimeout(() => {
        scrollRef.current?.scrollTo({ left: scrollPosition, behavior: 'smooth' });
      }, 100);
    } else if (firstFutureIndex === 0) {
      // First card is the future match, keep at 16px (default padding position)
      setTimeout(() => {
        scrollRef.current?.scrollTo({ left: 0, behavior: 'instant' });
      }, 100);
    }
  }, [todayMatches.length]);

  return (
    <div ref={scrollRef} onScroll={fade.onScroll} style={{ display:'flex', gap:12, paddingLeft:16, paddingRight:16, paddingTop:8, paddingBottom:10, overflowX:'auto', scrollSnapType:'x mandatory', scrollPaddingLeft:16, ...fade.style }} className="scrollbar-hide">
      {todayMatches.map(m => (
        <div key={m.id} style={{ scrollSnapAlign:'center', flexShrink:0 }}>
          <TodayMatchCard m={m} onMatch={onMatch} tweaks={tweaks} allMatches={matches}/>
        </div>
      ))}
    </div>
  );
}

// ─── SCREEN: HOME V2 — Editorial ─────────────────────────────
function HomeV2({ onMatch, onPlayer, onNotif, tweaks, liveApiMatches = [], isLoading = false, scrollTopKey = 0, onRefresh, unreadCount = 0, nativeTabBar = false, onTabBarScroll }) {
  const onTabScroll = useTabBarScrollSync(onTabBarScroll);
  const homeScrollRef = React.useRef(null);
  React.useEffect(() => { if (scrollTopKey > 0) { SCROLL_MEM.home = 0; homeScrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); } }, [scrollTopKey]);
  useScrollMemory('home', homeScrollRef);
  // Pull-to-refresh
  const [pullY, setPullY] = React.useState(0);
  const [refreshing, setRefreshing] = React.useState(false);
  const touchStartY = React.useRef(0);
  const PULL_THRESHOLD = 64;
  const handleHomeTouchStart = (e) => { touchStartY.current = e.touches[0].clientY; };
  const handleHomeTouchMove = (e) => {
    if (refreshing) return;
    const scrollTop = homeScrollRef.current?.scrollTop || 0;
    if (scrollTop > 0) return;
    const dy = e.touches[0].clientY - touchStartY.current;
    if (dy > 0) setPullY(Math.min(dy * 0.45, PULL_THRESHOLD + 16));
  };
  const handleHomeTouchEnd = async () => {
    if (pullY >= PULL_THRESHOLD && onRefresh && !refreshing) {
      haptic('medium');
      setRefreshing(true);
      setPullY(PULL_THRESHOLD);
      // Safety: cap PTR spinner duration so it never sticks.
      const ptrSafety = setTimeout(() => setRefreshing(false), 12000);
      try { await onRefresh(); } catch (e) { console.warn('PTR refresh error:', e); }
      clearTimeout(ptrSafety);
      setRefreshing(false);
    }
    setPullY(0);
  };
  // State for real-time countdown updates
  const [currentTime, setCurrentTime] = React.useState(new Date());
  const [hlBgImg, setHlBgImg] = React.useState(null);
  const [hlLiveMinute, setHlLiveMinute] = React.useState('');

  // Update current time every second for countdown
  React.useEffect(() => {
    const interval = setInterval(() => {
      setCurrentTime(new Date());
    }, 1000);
    return () => clearInterval(interval);
  }, []);

  // Combine static and API matches
  const allMatches = [...MATCHES, ...liveApiMatches];
  const liveMatches = allMatches.filter(m => m.live || m.time === 'LIVE');

  // Filter matches for today (including past results)
  const now = currentTime;
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
  const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
  const twelveHoursLater = new Date(now.getTime() + 12 * 60 * 60 * 1000);
  // 예정 경기를 12시간으로만 자르면, 오전에 켰을 때 그날 밤 경기가 통째로 사라진다
  // (제보: 오전 9시 — 20:30 경기 하나만 남고 22:30 이후가 전부 빠짐).
  // 오늘 남은 경기는 시각과 무관하게 전부 보여주고, 저녁이 지나 12시간 창이
  // 자정을 넘기면 그때부터 다음 날 새벽 경기(유럽 늦은 킥오프)까지 함께 잡는다.
  const upcomingHorizon = new Date(Math.max(endOfToday.getTime(), twelveHoursLater.getTime()));


  const upcoming = allMatches
    .filter(m => {
      if (m.live || m.time === 'LIVE') return false;
      if (!m.fullDate) return false; // Only show matches with valid dates
      const matchDate = new Date(m.fullDate);
      return matchDate >= now && matchDate <= twelveHoursLater;
    })
    .sort((a, b) => new Date(a.fullDate) - new Date(b.fullDate)); // Sort by soonest first

  const finishedWithKorean = allMatches
    .filter(m => isFinalStatus(m.status) && m.koreanPlayer && m.koreanPlayer.event !== '미출전')
    .sort((a, b) => new Date(b.fullDate || 0) - new Date(a.fullDate || 0));

  const finishedTodayWithKorean = allMatches
    .filter(m => {
      if (!isFinalStatus(m.status) || !m.koreanPlayer || !m.fullDate) return false;
      if (m.koreanPlayer.event === '미출전') return false;
      const matchDate = new Date(m.fullDate);
      return matchDate >= startOfToday && matchDate <= now;
    })
    .sort((a, b) => new Date(b.fullDate || 0) - new Date(a.fullDate || 0));

  const upcomingTodayWithKorean = allMatches
    .filter(m => {
      if (m.live || m.time === 'LIVE' || !m.koreanPlayer || !m.fullDate) return false;
      if (isFinalStatus(m.status)) return false;
      const matchDate = new Date(m.fullDate);
      return matchDate > now && matchDate <= endOfToday;
    })
    .sort((a, b) => new Date(a.fullDate || 0) - new Date(b.fullDate || 0));

  // Today's matches pool — shared with TodayMatchesCarousel so highlight & carousel
  // are guaranteed to draw from the exact same set of matches.
  const todayMatches = allMatches
    .filter(m => {
      if (!m.koreanPlayer) return false;
      if (!m.fullDate) return false;
      // 프리시즌 친선경기(국가대표/클럽)에서 실제 명단이 확인됐는데(lineupConfirmed)
      // 한국 선수가 아예 빠져 있으면(휴가/로테이션) — 볼 게 없는 경기이니 제외한다.
      // 정규 시즌 경기(리그·MLB)의 '미출전'은 계속 보여준다(왜 안 뛰었는지가 정보임).
      const isFriendly = (m.competition || '').includes('Friendlies');
      if (isFriendly && m.koreanPlayer.event === '미출전' && m.koreanPlayer.lineupConfirmed === true) return false;
      // 마이너 강등 선수의 MLB(부모 구단) 경기는 그의 경기가 아니므로 목록에서 제외.
      if (koreanIsMinorLeaguer(m)) return false;
      if (m.live || m.time === 'LIVE') return true;
      const matchDate = new Date(m.fullDate);
      const isFinished = isFinalStatus(m.status);
      const isToday = matchDate >= startOfToday && matchDate <= endOfToday;
      const isUpcoming = matchDate > now && matchDate <= upcomingHorizon;
      return (isFinished && isToday) || isUpcoming;
    })
    .sort((a, b) => new Date(a.fullDate) - new Date(b.fullDate));

  // Highlight: pick the match with the biggest Korean-player impact from today's pool.
  // Live » goals » assists » recency. Excludes matches where the Korean did not play.
  const getHighlightMatch = () => {
    // 미참여(미출전·벤치·부상·마이너·대기)는 상단 하이라이트 후보에서 아예 제외.
    // 실제 출전(스탯 라인·출전 중·선발 등)과 시작 전(출전 예상)만 후보로 둔다.
    const HERO_EXCLUDE = new Set(['미출전', '벤치', '부상', '마이너', '대기 명단', '확인 불가']);
    const heroEligible = (m) => {
      const ev = m.koreanPlayer?.event || '';
      if (HERO_EXCLUDE.has(ev)) return false;
      // 이미 시작된(라이브·종료) 경기인데 아직 '출전 예상'이면 출전 여부를 모르는
      // 상태다. 히어로가 '출전 여부 확인 중'이라고 단정하지 않도록 후보에서 뺀다.
      // (같은 경기 카드는 자기 상태를 그대로 보여주면 되고, 히어로만 침묵한다.)
      const started = m.live || m.time === 'LIVE' || isFinalStatus(m.status);
      if (started && ev === '출전 예상') return false;
      return true;
    };

    // 우리 선수 팀이 이겼는지 — 종료 히어로의 '긍정적 결과' 판정과 가산점에 쓴다.
    const koreanWon = (m) => {
      const kp = m.koreanPlayer;
      if (!kp) return false;
      const isHome = kp.team === m.home.code;
      const mine = isHome ? m.home.score : m.away.score;
      const theirs = isHome ? m.away.score : m.home.score;
      return (mine ?? 0) > (theirs ?? 0);
    };
    const isPositive = (m) => {
      const kp = m.koreanPlayer || {};
      return (kp.matchGoals || 0) > 0 || (kp.matchAssists || 0) > 0 ||
             (kp.hits || 0) > 0 || (kp.homeRuns || 0) > 0 || koreanWon(m);
    };

    // 라이브가 없는 날 히어로가 자주 비지 않도록, '오늘' 밖이어도 48시간 내
    // 종료 경기 중 긍정적 결과(골·도움·안타·홈런·팀 승리)는 후보에 추가한다.
    // 오늘 종료분은 결과와 무관하게 그대로 후보(그날의 소식이므로).
    const todayIds = new Set(todayMatches.map(m => m.id));
    const recentPositiveFinished = allMatches.filter(m => {
      if (todayIds.has(m.id)) return false;
      if (!isFinalStatus(m.status) || !m.koreanPlayer || !m.fullDate) return false;
      if (koreanIsMinorLeaguer(m)) return false;
      const hoursAgo = (now - new Date(m.fullDate)) / 3600000;
      // 24시간이 지난 결과는 아예 후보에서 뺀다 — 하루 지난 소식을 히어로로
      // 계속 물고 있으면 앱이 멈춘 것처럼 보인다. 오늘 경기가 없으면 히어로는
      // 그냥 접힌다(아래 showHero). '오늘' 경기는 같은 날짜 기준이라 애초에
      // 24시간을 넘지 않으므로 이 창만 조이면 된다.
      return hoursAgo > 0 && hoursAgo <= 24 && isPositive(m);
    });

    const eligible = [...todayMatches, ...recentPositiveFinished].filter(heroEligible);
    if (eligible.length === 0) return null;

    const isLive = m => m.live || m.time === 'LIVE';
    const isFinal = m => isFinalStatus(m.status);
    const goals = m => m.koreanPlayer?.matchGoals || 0;
    const assists = m => m.koreanPlayer?.matchAssists || 0;

    const score = m => {
      const kp = m.koreanPlayer || {};
      // 활약의 크기. 야구 기록도 함께 센다 — 예전엔 골·도움만 점수였고 야구는
      // 신선도·승리 가산점뿐이라, 축구 골 한 방이 야구 멀티히트를 항상 눌렀다.
      let s = goals(m) * 100 + assists(m) * 50
            + (kp.homeRuns || 0) * 80 + (kp.hits || 0) * 25 + (kp.rbi || 0) * 15;

      if (isLive(m)) return 1000 + s;       // 진행 중이면 무조건 최우선

      if (isFinal(m)) {
        if (koreanWon(m)) s += 20;          // 승리한 경기를 우선
        s += 10;                            // 종료 경기 기본 관심도
        // 지난 결과는 시간이 지나면 '통째로' 가치가 준다. 예전엔 신선도 점수만
        // 최대 30점 깎여서, 어제 새벽의 1골(+100)이 오늘 소식을 계속 이겼다.
        const hoursAgo = (now - new Date(m.fullDate)) / 3600000;
        s *= Math.max(0.1, 1 - hoursAgo / 24);   // 0h→1.0, 12h→0.5, 24h+→0.1
      } else {
        const hoursUntil = (new Date(m.fullDate) - now) / 3600000;
        s += Math.max(0, 25 - hoursUntil * 2);   // 임박할수록 가산: 0h→+25
      }
      return s;
    };

    const best = [...eligible].sort((a, b) => score(b) - score(a))[0];
    if (!best) return null;
    if (isLive(best)) return { match: best, priority: 1 };

    // 시간 비교: 다음 경기까지 남은 시간이 마지막 종료 경기의 경과 시간보다
    // 짧으면 지난 결과 대신 '출격 대기' 히어로를 우선한다. 종료 후보가 아예
    // 없으면(미출전·확인 불가 제외 등) 다음 경기가 있는 것만으로 히어로를 연다.
    const nextUp = eligible
      .filter(m => !isLive(m) && !isFinal(m) && m.fullDate && new Date(m.fullDate) > now)
      .sort((a, b) => new Date(a.fullDate) - new Date(b.fullDate))[0];
    const bestFinished = eligible.filter(isFinal).sort((a, b) => score(b) - score(a))[0];
    if (nextUp && (!bestFinished ||
        (new Date(nextUp.fullDate) - now) < (now - new Date(bestFinished.fullDate)))) {
      return { match: nextUp, priority: 5 };
    }
    if (bestFinished) return { match: bestFinished, priority: 4 };
    return { match: best, priority: 5 };
  };

  const highlightData = getHighlightMatch();
  const highlightMatch = highlightData?.match;
  const highlightPlayer = highlightMatch ? ALL_PLAYERS.find(p => p.name === highlightMatch.koreanPlayer?.name) : null;
  const heroPlayer = highlightPlayer;
  // Generate highlight text based on priority
  const getHighlightText = () => {
    if (!highlightMatch || !highlightData) return { status: '', main: '한국 선수 경기를 확인하세요', sub: '' };

    const m = highlightMatch;
    const isLive = m.live || m.time === 'LIVE';
    // 코리안 더비·같은 팀 복수 선수면 팔로우한 전원을 히어로 문구에 싣는다.
    const heroKoreans = (m.followedKoreans?.length ? m.followedKoreans : (m.koreanPlayers || [m.koreanPlayer])).filter(Boolean);
    const heroNames = heroKoreans.map(k => k.name).join(' · ');

    switch (highlightData.priority) {
      case 1: // Live match (HIGHEST PRIORITY)
        // Check if there's a goal/assist event
        // m.events 는 '골 전부 → 도움 전부' 순으로 덧붙인 합성 배열이라 마지막
        // 원소가 시간순 마지막이 아니다. 1골 1도움이면 늘 도움이 마지막이라
        // 골이 묻혔다(실측: 엄지성 1골 1도움 → '어시스트!'만 표시).
        // 이벤트 순서 대신 선수의 집계값으로 문구를 만든다.
        const heroImpact = (heroKoreans || [])
          .map(k => ({ k, g: k.matchGoals || 0, a: k.matchAssists || 0 }))
          .filter(x => x.g > 0 || x.a > 0)
          .sort((x, y) => (y.g * 2 + y.a) - (x.g * 2 + x.a))[0];
        const hasGoalEvent = !!heroImpact;

        const scoreNode = (
          <div style={{ display:'flex', alignItems:'center', gap:10, margin:'6px 0 2px' }}>
            <TeamBadge code={m.home.code} size={28} logo={m.home.logo}/>
            <span style={{ fontVariantNumeric:'tabular-nums', fontSize:32, fontWeight:900, color:'#fff', letterSpacing:-1 }}>{m.home.score ?? 0}</span>
            <span style={{ fontSize:20, color:'rgba(255,255,255,0.4)', fontWeight:300 }}>:</span>
            <span style={{ fontVariantNumeric:'tabular-nums', fontSize:32, fontWeight:900, color:'rgba(255,255,255,0.5)', letterSpacing:-1 }}>{m.away.score ?? 0}</span>
            <TeamBadge code={m.away.code} size={28} logo={m.away.logo}/>
          </div>
        );
        if (hasGoalEvent) {
          // 더비면 활약이 큰 쪽(골 2점, 도움 1점)이 주인공이다.
          const scorer = heroImpact.k;
          const g = heroImpact.g, a = heroImpact.a;
          // 축구공 이모지는 바로 위 팀 배지와 겹쳐 보여 뺐다.
          const headline =
            g > 0 && a > 0 ? `${scorer.name} ${g}골 ${a}도움`
            : g > 1        ? `${scorer.name} ${g}골!`
            : g === 1      ? `${scorer.name} 골!`
            : a > 1        ? `${scorer.name} ${a}도움`
            :                `${scorer.name} 어시스트!`;
          return {
            status: matchSportKey(m) === 'baseball' ? `LIVE NOW · ${m.inning || ''}` : `LIVE NOW · ${hlLiveMinute || m.minute || ''}\'`,
            main: headline,
            scoreNode,
            sub: `${m.home.name} vs ${m.away.name} · ${m.competition}`
          };
        } else {
          // 여러 선수가 걸린 경기라도 '출전 중'으로 묶을 수 있는 건 실제로 뛰는
          // 선수뿐이다. 한 명만 뛰면 그 선수 이름으로, 아무도 안 뛰면 대표 선수의
          // 상태를 그대로 보여준다.
          const onPitch = heroKoreans.filter(isPlayingKorean);
          const solo = onPitch.length === 1 ? onPitch[0]
                     : onPitch.length === 0 ? (heroKoreans[0] || m.koreanPlayer)
                     : null;
          const ev = (solo || m.koreanPlayer)?.event || '';
          const evLabel =
            ev === '교체 출전 중' ? '교체 출전 중' : ev === '교체 아웃' ? '교체 아웃' :
            ev === '선발 출전' ? '선발 출전' :
            ev === '출전 예상' ? '출전 여부 확인 중' :
            ev === '미출전' ? '미출전' :
            /벤치/.test(ev) ? '벤치' :
            /\d+타수/.test(ev) ? ev :               // 야구 실시간/최종 스탯 라인(n타수 n안타)은 그대로
            '출전 중';
          return {
            status: matchSportKey(m) === 'baseball' ? `LIVE NOW · ${m.inning || ''}` : `LIVE NOW · ${hlLiveMinute || m.minute || ''}\'`,
            main: solo ? `${solo.name} ${evLabel}`
                       : `${onPitch.map(k => k.name).join(' · ')} 출전 중`,
            scoreNode,
            sub: `${m.home.name} vs ${m.away.name} · ${m.competition}`
          };
        }
      case 4: { // Finished match — 오늘 밖(48h 내 긍정 결과)이면 언제 경기인지 밝힌다.
        const d = new Date(m.fullDate);
        const dayDiff = Math.floor((startOfToday - d) / 86400000) + 1;
        const when = d >= startOfToday ? '경기 종료' : dayDiff <= 1 ? '어제 경기' : `${d.getMonth() + 1}.${d.getDate()} 경기`;
        return { status: when, main: '', sub: '' };
      }
      case 5: // Upcoming
        // lineupConfirmed 는 '경기'가 아니라 '선수'에 붙는 값이라 m 에서 읽으면
        // 늘 undefined 였다 — 라인업이 나와도 히어로는 계속 '출격 대기'.
        const heroKps = (m.koreanPlayers || [m.koreanPlayer]).filter(Boolean);
        const ev5 = heroKps[0]?.event;
        // 여러 선수가 걸린 경기에서 첫 선수의 상태를 전원 상태처럼 붙이면 안 된다
        // (한 명은 선발인데 다른 한 명은 벤치인 경우). 상태가 갈리면 중립 라벨로.
        const sameEv5 = heroKps.every(k => k?.event === ev5);
        const statusText5 = !sameEv5 ? '출격 대기'
                          : ev5 === '선발 출전' ? '선발 출전'
                          : ev5 === '벤치 대기' ? '벤치 대기'
                          : '출격 대기';
        return {
          status: m.krTime || m.time,
          main: `${heroNames}\n${statusText5}`,
          sub: `${m.home.name} vs ${m.away.name} · ${m.competition}`
        };
    }
  };

  const highlightText = getHighlightText();

  // Build finished match headline helper
  const buildFinishedHeadline = (m) => {
    if (!m?.koreanPlayer) return { main: '', sub: '' };
    const kp = m.koreanPlayer;
    const name = kp.name;
    const matchGoals = m.events?.filter(e => e.type === 'goal' && e.player === name).length || 0;
    const matchAssists = m.events?.filter(e => e.type === 'assist' && e.player === name).length || 0;
    const mins = kp.minutesPlayed;
    const isMLB = (m.sport||'').includes('MLB') || (m.sport||'').includes('⚾');

    let main = name;
    if (isMLB) {
      const parts = [];
      if (kp.hits > 0) parts.push(`${kp.hits}안타`);
      if (kp.homeRuns > 0) parts.push(`${kp.homeRuns}홈런`);
      if (kp.rbi > 0) parts.push(`${kp.rbi}타점`);
      main = parts.length > 0 ? `${name} ${parts.join(' ')}` : `${name} 출전`;
    } else {
      const parts = [];
      if (matchGoals > 0) parts.push(`${matchGoals}골`);
      if (matchAssists > 0) parts.push(`${matchAssists}도움`);
      main = parts.length > 0 ? `${name} ${parts.join(' ')}` : `${name} ${mins >= 90 ? '풀타임 활약' : mins > 0 ? `${mins}분 출전` : '출전'}`;
    }

    const homeWin = m.home.score > m.away.score;
    const draw = m.home.score === m.away.score;
    const resultText = draw ? '무승부' : homeWin ? `${m.home.name} 승` : `${m.away.name} 승`;
    const scoreText = `${m.home.score}-${m.away.score}`;
    const minsText = !isMLB && mins >= 90 ? '선발 풀타임' : !isMLB && mins > 0 ? `${mins}분 출전` : '';
    const sub = [minsText, `${m.home.name} ${scoreText} ${m.away.name}`, resultText].filter(Boolean).join(' · ');

    return { main, sub };
  };

  // 이적 기념 히어로: 기간 내에는 히어로를 고정한다.
  // 처음엔 '라이브 경기가 있으면 양보'하게 했는데, 경기 데이터가 단계적으로
  // 들어오는 동안(마이너 판정·출전 정보가 뒤늦게 반영) 하이라이트 후보가 바뀌며
  // 히어로가 스포트라이트↔경기로 왕복해 깜빡였다. 라이브 경기는 바로 아래
  // '오늘의 경기'와 일정 탭에서 볼 수 있으니, 기간 중엔 고정하는 편이 낫다.
  const spotlight = React.useMemo(() => activeTransferSpotlight(now.getTime()), [now]);
  const spotlightPlayer = React.useMemo(
    () => (spotlight ? ALL_PLAYERS.find(p => p.name === spotlight.player) || null : null),
    [spotlight]
  );

  const isFinishedHighlight = highlightData?.priority === 4;
  // 히어로는 라이브(1)/종료(4) 하이라이트가 있을 때만. 예정(5)·없음이면 컴팩트 헤더만 노출.
  // 라이브(1)·종료(4)에 더해, 시간 비교에서 이긴 다음 경기(5, '출격 대기')도 히어로를 연다.
  const showHero = !!highlightData && [1, 4, 5].includes(highlightData.priority);
  const finishedHeadline = isFinishedHighlight ? buildFinishedHeadline(highlightMatch) : null;

  // landscape image map: Korean name → filename in image/landscape/
  const LANDSCAPE_MAP = { '손흥민': 'heungmin.jpg', '이강인': 'kangin.jpg', '김민재': 'minjae.jpg', '황희찬': 'heechan.jpg', '황인범': 'inbeom.jpg', '조규성': 'guesung.jpg', '이한범': 'hanbeom.jpg', '오현규': 'hyungyu.jpg', '양현준': 'hyunjun.jpg', '백승호': 'seungho.jpg', '배준호': 'junho.jpg', '엄지성': 'jisung.jpg', '설영우': 'youngwoo.jpg', '김하성': 'haseong.jpg', '이정후': 'junghoo.jpg', '김혜성': 'hyeseong.jpg', '이재성': 'jaesung.jpg', '홍현석': 'hyunseok.jpg', '정우영': 'wooyeong.jpg', '카스트로프': 'castrop.jpg', '박승수': 'seungsoo.jpg', '김지수': 'jisoo.jpg', '양민혁': 'minhyeok.jpg', '이태석': 'taeseok.jpg', '김민수': 'minsu.jpg', '김예건': 'yegeon.jpg', '송성문': 'songsm.jpg' };
  React.useEffect(() => {
    const playerName = highlightMatch?.koreanPlayer?.name;
    const landscapeFile = LANDSCAPE_MAP[playerName];
    setHlBgImg(landscapeFile ? `image/landscape/${landscapeFile}` : null);
  }, [highlightMatch?.koreanPlayer?.name]);

  // Real-time minute for highlight live match
  React.useEffect(() => {
    if (!highlightMatch?.live || !highlightMatch.periodStartTs) {
      setHlLiveMinute(highlightMatch?.minute || '');
      return;
    }
    const calc = () => {
      const mins = Math.floor((Date.now()/1000 - highlightMatch.periodStartTs) / 60);
      setHlLiveMinute(String(Math.max(0, mins + ((highlightMatch.sfPeriod || 1) >= 2 ? 45 : 0))));
    };
    calc();
    const iv = setInterval(calc, 30000);
    return () => clearInterval(iv);
  }, [highlightMatch?.id, highlightMatch?.live, highlightMatch?.periodStartTs, highlightMatch?.sfPeriod]);

  // 오늘 경기가 없을 때 대신 보여줄 다음 경기들(가까운 순 3경기, 예정만).
  const nextMatches = React.useMemo(() => allMatches
    .filter(m => {
      if (!m.koreanPlayer || !m.fullDate) return false;
      if (koreanIsMinorLeaguer(m)) return false;
      if (isFinalStatus(m.status)) return false;
      return new Date(m.fullDate) > now;
    })
    .sort((a, b) => new Date(a.fullDate) - new Date(b.fullDate))
    .slice(0, 3), [allMatches, now]);

  // 이적 스포트라이트 히어로 — 로딩 중에도(스켈레톤 화면에서도) 그대로 쓰기 위해
  // 별도로 만들어 둔다.
  const spotlightHero = spotlight ? (
    <div onClick={() => spotlightPlayer && onPlayer(spotlightPlayer)}
         style={{ position:'relative', height:260, overflow:'hidden', marginBottom:0, background:'#111', cursor: spotlightPlayer ? 'pointer' : 'default' }}>
      <img src={spotlight.image} alt="" style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', objectPosition:'50% 20%', animation:'fadeIn 0.7s ease' }}/>
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.18) 26%, rgba(0,0,0,0.72) 100%)' }}/>
      <div style={{ position:'absolute', top:12, left:20, right:20, display:'flex', justifyContent:'space-between', alignItems:'center', zIndex:2 }}>
        <span style={{ fontSize:15, fontWeight:900, color:'#fff', letterSpacing:2, textTransform:'uppercase' }}>JUMO</span>
        <button onClick={e => { e.stopPropagation(); onNotif(); }} style={{ ...LG.base, ...LG.circle, color:'rgba(255,255,255,0.85)', position:'relative', display: nativeTabBar ? 'none' : 'flex' }}>
          <svg width="18" height="18" viewBox="0 0 22 22" fill="none"><path d="M11 2a7 7 0 00-7 7v4l-1.5 2.5h17L18 13V9a7 7 0 00-7-7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" fill="none"/><path d="M9 18.5a2 2 0 004 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
          {unreadCount > 0 && <span style={{ position:'absolute', top:-2, right:-2, minWidth:16, height:16, padding:'0 4px', borderRadius:8, background:'#e63030', color:'#fff', fontSize:9, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 0 0 1.5px rgba(0,0,0,0.4)' }}>{unreadCount > 99 ? '99+' : unreadCount}</span>}
        </button>
      </div>
      <div style={{ position:'absolute', bottom:20, left:20, right:20, zIndex:2 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
          <span style={{ fontSize:10, fontWeight:800, color:'#000', background:'var(--acc)', borderRadius:6, padding:'3px 7px', letterSpacing:0.4, lineHeight:1 }}>{spotlight.badge}</span>
        </div>
        <div style={{ fontSize:26, fontWeight:900, color:'#fff', lineHeight:1.15, letterSpacing:-0.5 }}>{spotlight.headline}</div>
        <div style={{ fontSize:12, color:'rgba(255,255,255,0.72)', marginTop:9 }}>{spotlight.sub}</div>
      </div>
    </div>
  ) : null;

  // 히어로와 하단 콘텐츠의 준비 시점은 다르다.
  //  · 히어로: 이적 스포트라이트는 데이터가 필요 없어 즉시 보여줄 수 있다.
  //  · 하단(오늘의 경기 등): 경기 데이터가 있어야 한다. 그런데 로딩 플래그는
  //    8초 안전 타이머에 의해 데이터 도착 전에도 풀릴 수 있어서, 히어로만 뜨고
  //    아래가 텅 비어 보이는 구간이 생겼다. 데이터가 실제로 들어오기 전까지
  //    스켈레톤을 유지한다 — 단 경기가 정말 없는 날엔 영원히 스켈레톤일 수 없으니
  //    유예 시간을 둔다.
  const [loadGraceOver, setLoadGraceOver] = React.useState(false);
  React.useEffect(() => {
    const t = setTimeout(() => setLoadGraceOver(true), 15000);
    return () => clearTimeout(t);
  }, []);
  const contentLoading = isLoading || (liveApiMatches.length === 0 && !loadGraceOver);

  if (contentLoading) {
    return (
      <div style={{ flex:1, overflow:'auto', background:'var(--bg)' }} className="scrollbar-hide">
        {spotlightHero || <SkeletonHighlight/>}
        <div style={{ padding:'16px 16px 8px' }}>
          <div style={{ width:80, height:16, background:'var(--border)', borderRadius:6, opacity:0.5 }}/>
        </div>
        <div style={{ display:'flex', gap:10, padding:'8px 16px 20px', overflowX:'auto' }} className="scrollbar-hide">
          <SkeletonMatchCard/>
          <SkeletonMatchCard/>
          <SkeletonMatchCard/>
        </div>
        <SkeletonUpcomingMatch/>
        <SkeletonUpcomingMatch/>
        <SkeletonUpcomingMatch/>
      </div>
    );
  }

  return (
    <div ref={homeScrollRef} onScroll={onTabScroll} onTouchStart={handleHomeTouchStart} onTouchMove={handleHomeTouchMove} onTouchEnd={handleHomeTouchEnd} style={{ flex:1, overflow:'auto', background:'var(--bg)' }} className="scrollbar-hide">
      <div style={{ overflow:'hidden', height: pullY, transition: pullY === 0 ? 'height 0.25s ease' : 'none', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, opacity: Math.min(pullY / PULL_THRESHOLD, 1) }}>
          <div style={{ width:18, height:18, border:'2.5px solid var(--acc)', borderTopColor:'transparent', borderRadius:'50%', animation: refreshing || pullY >= PULL_THRESHOLD ? 'spin 0.7s linear infinite' : 'none', transform: !refreshing && pullY < PULL_THRESHOLD ? `rotate(${pullY * 4}deg)` : undefined }}/>
          <span style={{ fontSize:12, color:'var(--text3)', fontWeight:600 }}>{refreshing ? '새로고침 중...' : pullY >= PULL_THRESHOLD ? '놓아서 새로고침' : '당겨서 새로고침'}</span>
        </div>
      </div>

      {/* ── HIGHLIGHT CARD: 라이브/종료만 노출. 예정·없음이면 컴팩트 헤더(JUMO+벨)만.
             단, 이적 기념 기간이면(라이브 경기가 없을 때) 이적 히어로가 자리를 차지한다. ── */}
      {spotlightHero ? spotlightHero : !showHero ? (
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'calc(env(safe-area-inset-top) + 14px) 20px 4px' }}>
          <span style={{ fontSize:17, fontWeight:900, color:'var(--text)', letterSpacing:1.5 }}>JUMO</span>
          <button onClick={onNotif} style={{ ...LG.base, ...LG.circle, color:'var(--text)', position:'relative', display: nativeTabBar ? 'none' : 'flex' }}>
            <svg width="18" height="18" viewBox="0 0 22 22" fill="none"><path d="M11 2a7 7 0 00-7 7v4l-1.5 2.5h17L18 13V9a7 7 0 00-7-7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" fill="none"/><path d="M9 18.5a2 2 0 004 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
            {unreadCount > 0 && <span style={{ position:'absolute', top:-2, right:-2, minWidth:16, height:16, padding:'0 4px', borderRadius:8, background:'#e63030', color:'#fff', fontSize:9, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 0 0 1.5px rgba(0,0,0,0.4)' }}>{unreadCount > 99 ? '99+' : unreadCount}</span>}
          </button>
        </div>
      ) : isFinishedHighlight ? (() => {
        const kp = highlightMatch.koreanPlayer;
        const isMLB = (highlightMatch.sport||'').includes('MLB') || (highlightMatch.sport||'').includes('⚾');
        const homeIsKorean = kp.team === highlightMatch.home.code;
        const eventsGoals = (highlightMatch.events||[]).filter(e=>e.type==='goal'&&e.player===kp.name).length;
        const eventsAssists = (highlightMatch.events||[]).filter(e=>e.type==='assist'&&e.player===kp.name).length;
        const goals = (kp.matchGoals != null && kp.matchGoals > 0) ? kp.matchGoals : eventsGoals;
        const assists = (kp.matchAssists != null && kp.matchAssists > 0) ? kp.matchAssists : eventsAssists;
        const statParts = [];
        if (isMLB) {
          const h = kp.hits || 0, hr = kp.homeRuns || 0, rbi = kp.rbi || 0, r = kp.runs || 0, sb = kp.stolenBases || 0;
          if (h > 0) statParts.push(`${h}안타`);
          if (hr > 0) statParts.push(`${hr}홈런`);
          if (rbi > 0) statParts.push(`${rbi}타점`);
          if (sb > 0) statParts.push(`${sb}도루`);
          if (r > 0) statParts.push(`${r}득점`);
          if (statParts.length === 0) statParts.push(kp.event || '출전');
        } else {
          if (goals > 0) statParts.push(`${goals}골`);
          if (assists > 0) statParts.push(`${assists}도움`);
          const ev = kp.event || '';
          const mins = kp.minutesPlayed;
          const minText = (ev === '풀타임' || mins >= 90) ? '풀타임 출전'
            : ev.includes('분') ? ev : mins > 0 ? `${mins}분 출전` : ev === '출전 완료' ? '출전 완료' : '출전';
          statParts.push(minText);
        }
        // 코리안 더비·같은 팀 복수 선수: 팔로우한 전원을 '이름 핵심스탯'으로 압축 나열.
        const finKoreans = (highlightMatch.followedKoreans?.length
          ? highlightMatch.followedKoreans
          : (highlightMatch.koreanPlayers || [kp])).filter(Boolean);
        const shortFor = (k) => {
          const g = (k.matchGoals > 0) ? k.matchGoals : (highlightMatch.events||[]).filter(e=>e.type==='goal'&&e.player===k.name).length;
          const a = (k.matchAssists > 0) ? k.matchAssists : (highlightMatch.events||[]).filter(e=>e.type==='assist'&&e.player===k.name).length;
          const parts = [];
          if (g > 0) parts.push(`${g}골`);
          if (a > 0) parts.push(`${a}도움`);
          if (parts.length === 0) {
            const mm = k.minutesPlayed;
            parts.push(mm >= 90 ? '풀타임' : mm > 0 ? `${mm}분` : '출전');
          }
          return `${k.name} ${parts.join(' ')}`;
        };
        const finMain = finKoreans.length > 1
          ? finKoreans.map(shortFor).join(' · ')
          : `${kp.name} ${statParts.join(' · ')}`;
        // 더비면 양 팀 모두 우리 선수 소속이므로 양쪽 다 강조된다.
        const homeColor = finKoreans.some(k => k.team === highlightMatch.home.code) ? 'var(--acc)' : (homeIsKorean ? 'var(--acc)' : '#fff');
        const awayColor = finKoreans.some(k => k.team === highlightMatch.away.code) ? 'var(--acc)' : (!homeIsKorean ? 'var(--acc)' : '#fff');
        const scoreNode = (
          <div style={{ display:'flex', alignItems:'center', gap:10, margin:'6px 0 2px' }}>
            <TeamBadge code={highlightMatch.home.code} size={28} logo={highlightMatch.home.logo}/>
            <span style={{ fontVariantNumeric:'tabular-nums', fontSize:32, fontWeight:900, color:homeColor, letterSpacing:-1 }}>{highlightMatch.home.score}</span>
            <span style={{ fontSize:20, color:'rgba(255,255,255,0.4)', fontWeight:300 }}>:</span>
            <span style={{ fontVariantNumeric:'tabular-nums', fontSize:32, fontWeight:900, color:awayColor, letterSpacing:-1 }}>{highlightMatch.away.score}</span>
            <TeamBadge code={highlightMatch.away.code} size={28} logo={highlightMatch.away.logo}/>
          </div>
        );
        return (
          <div onClick={() => onMatch(highlightMatch)} style={{ position:'relative', height:260, overflow:'hidden', cursor:'pointer', background:'#111' }}>
            {hlBgImg
              ? <img key={hlBgImg} src={hlBgImg} alt="" style={{ position:'absolute', top:0, left:0, bottom:0, width:'113%', height:'100%', objectFit:'cover', objectPosition:'left 20%', animation:'fadeIn 0.7s ease' }}/>
              : <div style={{ position:'absolute', inset:0, background:'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)' }}>
                  {highlightMatch?.home?.logo && <img src={highlightMatch.home.logo} alt="" style={{ position:'absolute', right:-30, top:'50%', transform:'translateY(-50%)', width:200, height:200, objectFit:'contain', opacity:0.08, filter:'blur(2px)' }}/>}
                </div>
            }
            {/* 상단에도 스크림: 밝은 배경 이미지(예: 구단 공식 발표 그래픽)에서
                'LIVE NOW'·'경기 종료' 라벨이 묻히지 않게 한다. 중간은 밝게 유지. */}
            <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.18) 26%, rgba(0,0,0,0.72) 100%)' }}/>
            <div style={{ position:'absolute', top:12, left:20, right:20, display:'flex', justifyContent:'space-between', alignItems:'center', zIndex:2 }}>
              <span style={{ fontSize:15, fontWeight:900, color:'#fff', letterSpacing:2, textTransform:'uppercase' }}>JUMO</span>
              <button onClick={e => { e.stopPropagation(); onNotif(); }} style={{ ...LG.base, ...LG.circle, color:'rgba(255,255,255,0.85)', position:'relative', display: nativeTabBar ? 'none' : 'flex' }}>
                <svg width="18" height="18" viewBox="0 0 22 22" fill="none"><path d="M11 2a7 7 0 00-7 7v4l-1.5 2.5h17L18 13V9a7 7 0 00-7-7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" fill="none"/><path d="M9 18.5a2 2 0 004 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
                {unreadCount > 0 && <span style={{ position:'absolute', top:-2, right:-2, minWidth:16, height:16, padding:'0 4px', borderRadius:8, background:'#e63030', color:'#fff', fontSize:9, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 0 0 1.5px rgba(0,0,0,0.4)' }}>{unreadCount > 99 ? '99+' : unreadCount}</span>}
              </button>
            </div>
            <div style={{ position:'absolute', bottom:20, left:20, right:20, zIndex:2 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
                <span style={{ fontSize:11, fontWeight:700, color:'rgba(255,255,255,0.7)', letterSpacing:1.5 }}>{(() => {
                  // 오늘 밖(48h 내 긍정 결과)의 경기는 언제 것인지 밝힌다.
                  const d = new Date(highlightMatch.fullDate);
                  if (!highlightMatch.fullDate || d >= startOfToday) return '경기 종료';
                  const dayDiff = Math.floor((startOfToday - d) / 86400000) + 1;
                  return dayDiff <= 1 ? '어제 경기 종료' : `${d.getMonth() + 1}.${d.getDate()} 경기 종료`;
                })()}</span>
              </div>
              {scoreNode}
              <div style={{ fontSize:12, color:'rgba(255,255,255,0.7)', marginTop:8 }}>{highlightMatch.home.name} vs {highlightMatch.away.name} · {highlightMatch.competition}</div>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:8 }}>
                <div style={{ fontSize: finKoreans.length > 1 ? 20 : 24, fontWeight:900, color:'#fff', lineHeight:1.2, letterSpacing:-0.5 }}>{finMain}</div>
                {kp.sfRating && <span style={{ fontSize:12, fontWeight:700, color:'var(--acc)', background:'rgba(245,196,0,0.15)', border:'0.5px solid rgba(245,196,0,0.3)', borderRadius:8, padding:'4px 8px', flexShrink:0 }}>★ {kp.sfRating}</span>}
              </div>
            </div>
          </div>
        );
      })() : (
      <div onClick={() => highlightMatch && onMatch(highlightMatch)} style={{ position:'relative', height:260, overflow:'hidden', marginBottom:0, background:'#111', cursor: highlightMatch ? 'pointer' : 'default' }}>
        {/* Background */}
        {hlBgImg
          ? <img key={hlBgImg} src={hlBgImg} alt="" style={{ position:'absolute', top:0, left:0, bottom:0, width:'113%', height:'100%', objectFit:'cover', objectPosition:'left 20%', animation:'fadeIn 0.7s ease' }}/>
          : <div style={{ position:'absolute', inset:0, background:'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)' }}>
              {highlightMatch?.home?.logo && <img src={highlightMatch.home.logo} alt="" style={{ position:'absolute', right:-30, top:'50%', transform:'translateY(-50%)', width:200, height:200, objectFit:'contain', opacity:0.08, filter:'blur(2px)' }}/>}
            </div>
        }
        {/* 상단 스크림 — 밝은 배경 이미지에서도 상단 라벨이 읽히도록(위와 동일 규칙) */}
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.18) 26%, rgba(0,0,0,0.72) 100%)' }}/>
        <div style={{ position:'absolute', top:12, left:20, right:20, display:'flex', justifyContent:'space-between', alignItems:'center', zIndex:2 }}>
          <span style={{ fontSize:15, fontWeight:900, color:'#fff', letterSpacing:2, textTransform:'uppercase' }}>JUMO</span>
          <div style={{ display:'flex', gap:8 }}>
            <button onClick={e => { e.stopPropagation(); onNotif(); }} style={{ ...LG.base, ...LG.circle, color:'rgba(255,255,255,0.85)', position:'relative', display: nativeTabBar ? 'none' : 'flex' }}>
              <svg width="18" height="18" viewBox="0 0 22 22" fill="none"><path d="M11 2a7 7 0 00-7 7v4l-1.5 2.5h17L18 13V9a7 7 0 00-7-7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" fill="none"/><path d="M9 18.5a2 2 0 004 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
              {unreadCount > 0 && <span style={{ position:'absolute', top:-2, right:-2, minWidth:16, height:16, padding:'0 4px', borderRadius:8, background:'#e63030', color:'#fff', fontSize:9, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 0 0 1.5px rgba(0,0,0,0.4)' }}>{unreadCount > 99 ? '99+' : unreadCount}</span>}
            </button>
          </div>
        </div>
        <div style={{ position:'absolute', bottom:20, left:20, right:20, zIndex:2 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
            {highlightData?.priority === 1 && <LiveDot/>}
            <span style={{ fontSize:11, fontWeight:700, color: highlightData?.priority === 1 ? 'var(--acc)' : 'rgba(255,255,255,0.7)', letterSpacing:1.5 }}>{highlightText.status}</span>
          </div>
          {highlightText.scoreNode || null}
          <div style={{ display:'flex', alignItems:'center', gap:10, marginTop: highlightText.scoreNode ? 10 : 0 }}>
            <div style={{ fontSize:28, fontWeight:900, color:'#fff', lineHeight:1.1, letterSpacing:-0.5, whiteSpace:'pre-line' }}>{highlightText.main}</div>
            {highlightMatch?.koreanPlayer?.sfRating && <span style={{ fontSize:12, fontWeight:700, color:'var(--acc)', background:'rgba(245,196,0,0.15)', border:'0.5px solid rgba(245,196,0,0.3)', borderRadius:8, padding:'4px 8px', flexShrink:0 }}>★ {highlightMatch.koreanPlayer.sfRating}</span>}
          </div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,0.7)', marginTop:10 }}>{highlightText.sub}</div>
        </div>
      </div>
      )}

      {/* Today's Matches Section — 오늘 경기가 없으면 다음 경기를 안내한다.
           (예전엔 제목만 남고 아래가 텅 비어 로딩이 멈춘 것처럼 보였다) */}
      <div style={{ padding:'16px 16px 8px' }}>
        <div style={{ fontSize:13, fontWeight:700, color:'var(--text)', letterSpacing:-0.2 }}>
          {todayMatches.length > 0 ? '오늘의 경기' : '다음 경기'}
        </div>
      </div>

      {todayMatches.length > 0 ? (
        <TodayMatchesCarousel
          todayMatches={todayMatches}
          matches={allMatches}
          now={now}
          onMatch={onMatch}
          tweaks={tweaks}
        />
      ) : nextMatches.length > 0 ? (
        <TodayMatchesCarousel
          todayMatches={nextMatches}
          matches={allMatches}
          now={now}
          onMatch={onMatch}
          tweaks={tweaks}
        />
      ) : (
        <div style={{ margin:'0 16px 20px', padding:'26px 18px', background:'var(--surface)', border:'0.5px solid var(--border2)', borderRadius:14, textAlign:'center' }}>
          <div style={{ fontSize:24, marginBottom:8 }}>😴</div>
          <div style={{ fontSize:14, fontWeight:700, color:'var(--text)', marginBottom:4 }}>예정된 경기가 없어요</div>
          <div style={{ fontSize:12, color:'var(--text3)' }}>일정 탭에서 지난 경기 결과를 확인할 수 있어요</div>
        </div>
      )}

      {/* 오늘 — 진행 중·예정 경기. 남은 게 없으면 오늘 끝난 경기 결과로 대체 */}
      {(() => {
        // 끝난 경기는 기본적으로 넣지 않는다. 예전엔 오늘 00시부터 담아서, 이른
        // 새벽에 끝난 경기가 하루 종일 목록 위쪽을 차지했다.
        //
        // 마이너 강등 선수의 MLB(부모 구단) 경기는 그의 경기가 아니다.
        // 위 '오늘의 경기'와 일정 탭엔 이미 적용돼 있는데 이 목록만 빠져 있어,
        // 같은 화면에서 카드엔 없고 아래 목록엔 뜨는 불일치가 있었다.
        const pickMatches = (accept) => {
          const seen = new Set();
          return allMatches
            .filter(m => {
              if (!m.koreanPlayer || !m.fullDate) return false;
              if (koreanIsMinorLeaguer(m)) return false;
              if (seen.has(m.id)) return false;
              seen.add(m.id);
              return accept(m);
            })
            .sort((a, b) => new Date(a.fullDate) - new Date(b.fullDate));
        };

        const remaining = pickMatches(m => {
          if (m.live || m.time === 'LIVE') return true; // 진행 중이면 무조건
          if (isFinalStatus(m.status)) return false;    // 끝난 경기는 제외
          // 남은 건 아직 안 끝난 경기다. 킥오프가 지났는데 라이브 표시가 아직
          // 안 붙은 경우(데이터 지연)도 여기서 살아남아야 하므로 오늘 0시부터 본다.
          const d = new Date(m.fullDate);
          return d >= startOfToday && d <= upcomingHorizon;
        });

        // 오늘 남은 경기가 하나도 없으면 이 자리가 통째로 사라진다 — 그럴 땐
        // 결과라도 보여준다(제보: '아무것도 안 보이는 불상사').
        //  1순위: 오늘 끝난 경기 결과

        const oneDay = (list, pickLast) => {
          if (!list.length) return [];

        const fallback = remaining.length ? [] : (() => {

                  {thisDateLabel}

// ─── TEAM CHEER METER (tap-to-cheer, proportional bar) ────────
// Real team colors. Priority: color captured from the data source (ESPN
// color/alt) → curated brand map → stable hash. Everything

const CHEER_BRAND = {
  TOT:'#132257', PSG:'#004170', Atletico:'#CB3524', ATM:'#CB3524', FCB:'#DC052D', WOL:'#FDB913', FEY:'#E2001A', NEW:'#241F20',
  BHA:'#0057B8', MCI:'#6CABDD', MUN:'#DA291C', ARS:'#EF0107', LIV:'#C8102E', CHE:'#034694',
  RMA:'#FEBE10', BAR:'#A50044', JUV:'#222222', INT:'#0068A8', MIL:'#FB090B', BVB:'#FDE100',
  RBL:'#DD0741', AJX:'#D2122E', POR:'#00428C', GEN:'#1E78C8', CRV:'#ED1C24',
  SF:'#FD5A1E', SD:'#FFC425', PIT:'#FDB827', LAD:'#005A9C', NYY:'#0C2340', BOS:'#BD3039',
  CHC:'#0E3386', STL:'#C41E3A', ATL:'#CE1141', HOU:'#EB6E1F', SEA:'#0C2C56', BAL:'#DF4601',
  KOR:'#CE2028', JPN:'#BC002D', CZE:'#D7141A', BRA:'#FFDF00', ARG:'#75AADB', FRA:'#21304F',

function hexRGB(x) { if (!x) return null; let h = String(x).replace('#', '').trim(); if (h.length === 3) h = h.split('').map(c => c + c).join(''); if (h.length !== 6 || /[^0-9a-f]/i.test(h)) return null; return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }

  if (hHex && aHex) { // same real hue on both → keep the away card's real hue but deepen it so the two read as distinct
    const h1 = rgbToHsl(hexRGB(hHex)).h, h2 = rgbToHsl(hexRGB(aHex)).h, s2 = rgbToHsl(hexRGB(aHex)).s;
    if (hueDist(h1, h2) < 16) awayColor = `hsl(${Math.round(h2)}, ${Math.round(Math.max(s2, 0.4) * 100)}%, 20%)`;
  }
  return { homeColor, awayColor };
}

// Dominant brand hue straight from the team's logo image (most accurate source —
// the hardcoded CHEER_BRAND map only covers a handful of clubs, and Korean-player
// teams carry a full-name code that never matches it). Reads the logo pixels on a
// canvas, ignores transparent/washed/near-black-or-white pixels, and returns the
// most vivid hue bucket's {h,s}. Cached per URL; resolves null on CORS/monochrome

    return v && typeof v.then === 'function' ? v : Promise.resolve(v);
  }
  const p = new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const S = 48;
        const c = document.createElement('canvas'); c.width = S; c.height = S;
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, S, S);

}
const cardFromHSL = (hsl, l = 30) => hsl ? `hsl(${Math.round(hsl.h)}, ${Math.round(Math.max(hsl.s, 0.4) * 100)}%, ${l}%)` : null;
function TeamCheerMeter({ match, isLive, isFinished }) {
  const mid = String(match.id);
  const LSK = `jumo_cheer_${mid}`;
  const readLS = () => { try { return JSON.parse(localStorage.getItem(LSK) || '{}'); } catch { return {}; } };
  const [counts, setCounts] = React.useState(() => { const s = readLS(); return { home: s.home || 0, away: s.away || 0 }; });
  const [floats, setFloats] = React.useState([]);
  const pending = React.useRef({ home: 0, away: 0 });
  const inFlight = React.useRef(false);
  const timer = React.useRef(null);
  const fid = React.useRef(0);
  const persist = (c) => { try { localStorage.setItem(LSK, JSON.stringify(c)); } catch {} };

  // Cheers are stored on the SERVER (shared across all users) using the existing
  // match_reactions table + increment_reaction RPC, keyed by '__home'/'__away'
  // (distinct from emoji reactions). Each tap = one atomic +1 on the server;
  // local counts are optimistic and always reconcile to the server value.
  const CHEER_KEY = { home: '__home', away: '__away' };
  const fetchCounts = React.useCallback(async () => {
    try {
      const { data, error } = await SB.from('match_reactions').select('emoji,count').eq('match_id', mid).in('emoji', ['__home', '__away']);
      if (error) throw error;
      const srv = { home: 0, away: 0 };
      (data || []).forEach(r => { if (r.emoji === '__home') srv.home = Number(r.count) || 0; else if (r.emoji === '__away') srv.away = Number(r.count) || 0; });
      setCounts(() => { const nc = { home: srv.home + pending.current.home, away: srv.away + pending.current.away }; persist(nc); return nc; });
    } catch { /* offline → keep optimistic local counts until next fetch */ }
  }, [mid]);

  const flush = React.useCallback(async () => {
    if (inFlight.current) return;
    const n = { home: Math.min(pending.current.home, 30), away: Math.min(pending.current.away, 30) };
    if (!n.home && !n.away) return;
    pending.current = { home: pending.current.home - n.home, away: pending.current.away - n.away };
    inFlight.current = true;
    try {
      const calls = [];
      ['home', 'away'].forEach(team => { for (let i = 0; i < n[team]; i++) calls.push(SB.rpc('increment_reaction', { p_match_id: mid, p_emoji: CHEER_KEY[team] })); });
      if (calls.length) { await Promise.all(calls); await fetchCounts(); }
    } catch { /* network issue → counts already optimistic; reconcile on next fetch */ }

  }, [mid, fetchCounts]);

  const tap = (team) => {
    if (pending.current[team] >= 30) return; // anti-spam cap (a human never taps this fast in one burst)
    setCounts(c => { const nc = { ...c, [team]: c[team] + 1 }; persist(nc); return nc; });
