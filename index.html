);

const ToastCtx = React.createContext(() => {});
// '선발 예상 N%' 처럼 계산식이 있는 값은 사용자가 근거를 궁금해한다.
// 탭하면 어떻게 나온 숫자인지 짧게 설명하는 시트를 띄운다.
const ExplainCtx = React.createContext(() => {});

// 배지 문구가 '선발 예상 …' 이면 그에 맞는 설명을 돌려준다(아니면 null).
function explainForEvent(text) {
  if (!/^선발 예상/.test(text || '')) return null;
  return {
    title: '선발 예상은 이렇게 계산해요',
    lines: [
      '최근 10경기에서 선발로 나선 비율이에요.',
      '최근 경기일수록 더 크게 반영합니다 — 직전 서너 경기가 다음 선발을 가장 잘 설명하거든요.',
      '교체로 들어와 60분 이상 뛴 경기도 선발로 봅니다.',
      '기록이 아직 적으면 그 선수의 평소 출전 비중과 섞어서 계산해요.',
      '부상·감독 성향·상대 팀은 반영하지 않으니 참고용으로 봐주세요.',
    ],
  };
}

// 설명 툴팁 — 누른 배지 옆에 떠서 무엇에 대한 설명인지 분명하다.
// 하단 시트로 만들었다가 바꿨다: 시트는 화면을 덮어 정작 설명 대상인 배지가
// 가려지고, 이 정도 분량에는 과하다.
function ExplainTip({ data, onClose }) {
  const [pos, setPos] = React.useState(null);
  const ref = React.useRef(null);

  React.useLayoutEffect(() => {
    if (!data || !ref.current) { setPos(null); return; }
    const box = ref.current.getBoundingClientRect();
    const a = data.rect;
    const M = 12;                              // 화면 가장자리 여백
    const vw = window.innerWidth, vh = window.innerHeight;
    // 기본은 배지 아래. 아래 공간이 모자라면 위로 띄운다.
    const below = a.bottom + 10;
    const above = a.top - box.height - 10;
    const top = (below + box.height + M <= vh) ? below : Math.max(M, above);
    // 가로는 배지 중앙 정렬하되 화면 밖으로 나가지 않게 잡아둔다.
    let left = a.left + a.width / 2 - box.width / 2;
    left = Math.max(M, Math.min(left, vw - box.width - M));
    setPos({ top, left, caretX: Math.max(14, Math.min(a.left + a.width / 2 - left, box.width - 14)),
             caretUp: top === below });
  }, [data]);

  if (!data) return null;
  return (
    <div onClick={onClose}
      style={{ position:'fixed', inset:0, zIndex:400, background:'rgba(0,0,0,0.35)',
               animation:'fadeIn 0.14s ease' }}>
      <div ref={ref} onClick={e => e.stopPropagation()}
        style={{ position:'fixed', width:'min(310px, calc(100vw - 24px))',
                 top: pos ? pos.top : -9999, left: pos ? pos.left : 0,
                 background:'var(--surface)', border:'0.5px solid var(--border2)',
                 borderRadius:14, padding:'13px 15px',
                 boxShadow:'0 12px 32px rgba(0,0,0,0.5)',
                 opacity: pos ? 1 : 0, transition:'opacity 0.12s ease' }}>
        {pos && (
          // 어느 배지에서 나온 설명인지 가리키는 꼬리
          <div style={{ position:'absolute', left: pos.caretX - 6,
                        [pos.caretUp ? 'top' : 'bottom']: -6,
                        width:12, height:12, background:'var(--surface)',
                        borderLeft:'0.5px solid var(--border2)', borderTop:'0.5px solid var(--border2)',
                        transform: pos.caretUp ? 'rotate(45deg)' : 'rotate(225deg)' }}/>
        )}
        <div style={{ fontSize:13, fontWeight:800, color:'var(--text)', marginBottom:8 }}>{data.title}</div>
        {data.lines.map((l, i) => (
          <div key={i} style={{ display:'flex', gap:6, marginBottom:5 }}>
            <span style={{ color:'var(--acc)', fontSize:11, lineHeight:1.55 }}>·</span>
            <span style={{ fontSize:11.5, color:'var(--text2)', lineHeight:1.55 }}>{l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const matchSportKey = (m) => ((m?.sport||'').includes('MLB') || (m?.sport||'').includes('⚾')) ? 'baseball'
  : ((m?.sport||'').includes('배드민턴') || (m?.sport||'').includes('🏸')) ? 'badminton'
  : 'soccer';
const isMatchAllowed = (m, feeds) => feeds?.[matchSportKey(m)] !== false;
const playerSportKey = (p) => p?.sport === '야구' ? 'baseball' : p?.sport === '배드민턴' ? 'badminton' : 'soccer';
const liveTimeLabel = (m, liveMinute) => {
  if (matchSportKey(m) === 'baseball') return m?.inning || '';
  const v = liveMinute || m?.minute;
  return v ? `${v}'` : '';
};

// ─── 햅틱 피드백 ──────────────────────────────────────────────
// 네이티브(iOS): @capacitor/haptics 의 UIImpactFeedbackGenerator. 웹/안드로이드:
// navigator.vibrate 폴백 (iOS Safari/WKWebView는 vibrate 미지원 → 네이티브가 담당).
function haptic(style) {
  try {
    const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
    if (H) {
      if (style === 'success' || style === 'warning' || style === 'error') {
        H.notification && H.notification({ type: style.toUpperCase() });
      } else {
        H.impact && H.impact({ style: style === 'medium' ? 'MEDIUM' : style === 'heavy' ? 'HEAVY' : 'LIGHT' });
      }
    } else if (typeof navigator !== 'undefined' && navigator.vibrate) {
      navigator.vibrate(style === 'heavy' ? 16 : style === 'medium' ? 10 : 6);
    }
  } catch (e) {}
}
// 전역: 탭 가능한 요소(버튼/링크/role=button/포인터 커서) 클릭 시 가벼운 햅틱.
// click 이벤트는 실제 탭에서만 발생(스크롤 시엔 미발생)하므로 스크롤 오작동이 없다.
if (typeof document !== 'undefined') {
  document.addEventListener('click', (e) => {
    try {
      let n = e.target;
      for (let i = 0; i < 6 && n && n.nodeType === 1 && n !== document.body; i++) {
        const tag = n.tagName;
        if (tag === 'BUTTON' || tag === 'A' || n.getAttribute('role') === 'button' ||
            window.getComputedStyle(n).cursor === 'pointer') { haptic('light'); return; }
        n = n.parentElement;
      }
    } catch (err) {}
  }, true);
}
const isPlayerAllowed = (p, feeds) => feeds?.[playerSportKey(p)] !== false;

// API-Football 호출 게이트.
// 한도를 넘으면 HTTP 200 에 errors.rateLimit 을 담아 빈 응답을 준다 — r.ok 가
// true 라 코드가 정상으로 착각하고 조용히 실패한다(실측: 전 선수 스탯이 통째로
// 비었다). 시즌 스탯 22건과 부상 22건이 각자 스태거로 흐르다 합산이 초당 5회를
// 넘긴 게 원인이라, 개별 스태거 대신 모든 호출을 한 줄로 세워 간격을 보장한다.
const AF_MIN_GAP_MS = 320;                 // ≈3회/초 — 초당 5회 한도 아래
let afGate = Promise.resolve();
let afLastAt = 0;
function afFetch(query, { retries = 1 } = {}) {
  const slot = afGate.then(async () => {
    const wait = AF_MIN_GAP_MS - (Date.now() - afLastAt);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    afLastAt = Date.now();
  });
  afGate = slot;
  return slot.then(async () => {
    const r = await fetch(`${API_BASE}/api/apifootball?${query}`);
    if (!r.ok) return null;
    const j = await r.json().catch(() => null);
    // 한도 초과는 '실패'로 다루고 한 번 쉬었다 다시 시도한다.
    // 분당 한도는 잠깐 쉬면 풀리지만, 일일 한도(errors.requests)는 그날 끝이다.
    if (j?.errors?.rateLimit && retries > 0) {
      await new Promise(r2 => setTimeout(r2, 2500));
      return afFetch(query, { retries: retries - 1 });
    }
    const failed = j?.errors && (j.errors.rateLimit || j.errors.requests || j.errors.token);
    return failed ? null : j;
  });
}


const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "homeVariant": 1,
  "accentColor": "#f5c400",
  "showPlayerPhoto": true,
  "liveAnimation": true
}/*EDITMODE-END*/;

// ─── LIQUID GLASS ────────────────────────────────────────────
// 앱 전역 컨트롤 높이. 네이티브 상단 크롬(MainViewController.chromeH = 38pt)과
// 같은 값을 쓴다 — 칩·세그먼트·알약·박스 버튼이 전부 이 높이로 선다.
const CTRL_H = 38;

// ─── 사용자 정렬(선수 편집에서 드래그로 바꾸는 순서) ────────────────
// 선수 순서는 팔로우한 선수 id 배열, 종목 순서는 종목명 배열로 저장한다.
// 목록에 없는 항목은 기존 순서를 그대로 따르도록 뒤로 보낸다.
const ORDER_KEY = { players: 'jumo_player_order', sports: 'jumo_sport_order' };
const loadOrder = (key, fallback) => {
  try {
    const v = JSON.parse(localStorage.getItem(ORDER_KEY[key]) || 'null');
    return Array.isArray(v) ? v : fallback;
  } catch { return fallback; }
};
const saveOrder = (key, arr) => {
  try { localStorage.setItem(ORDER_KEY[key], JSON.stringify(arr)); } catch {}
};
const byOrder = (list, order, keyOf) => {
  const rank = new Map(order.map((k, i) => [k, i]));
  return [...list].sort((a, b) => {
    const ra = rank.has(keyOf(a)) ? rank.get(keyOf(a)) : Infinity;
    const rb = rank.has(keyOf(b)) ? rank.get(keyOf(b)) : Infinity;
    return ra === rb ? 0 : ra - rb;
  });
};
const moveItem = (arr, from, to) => {
  const next = [...arr];
  const [x] = next.splice(from, 1);
  next.splice(to, 0, x);
  return next;
};

// 터치 드래그 정렬. HTML5 drag-and-drop 은 iOS WebView 에서 동작하지 않아
// 직접 만든다. 목록 스크롤과 충돌하지 않도록 손잡이(≡)를 잡았을 때만 시작하고,
// 드래그 중에는 document 레벨에서 touchmove 를 preventDefault 한다
// (React 의 onTouchMove 는 passive 라 여기서 스크롤을 막을 수 없다).
function useTouchReorder(onCommit) {
  const [drag, setDrag] = React.useState(null);
  const dragRef = React.useRef(null);
  const rowsRef = React.useRef([]);
  const commitRef = React.useRef(onCommit);
  commitRef.current = onCommit;

  const registerRow = React.useCallback((i) => (el) => { rowsRef.current[i] = el; }, []);

  const active = !!drag;
  React.useEffect(() => {
    if (!active) return;
    const onMove = (ev) => {
      ev.preventDefault();
      const d = dragRef.current;
      if (!d || !ev.touches || !ev.touches.length) return;
      const dy = ev.touches[0].clientY - d.startY;
      const rects = d.rects;
      const src = rects[d.from];
      if (!src) return;
      const center = src.top + src.height / 2 + dy;
      let to = d.from;
      for (let i = 0; i < rects.length; i++) {
        const r = rects[i];
        if (r && center >= r.top && center <= r.bottom) { to = i; break; }
      }
      if (rects[0] && center < rects[0].top) to = 0;
      const last = rects[rects.length - 1];
      if (last && center > last.bottom) to = rects.length - 1;
      const next = { ...d, dy, to };
      dragRef.current = next;
      setDrag(next);
    };
    const onEnd = () => {
      const d = dragRef.current;
      dragRef.current = null;
      setDrag(null);
      if (d) {
        // 드래그 직후 따라오는 click 이 '팔로우 해제'로 오작동하지 않게 잠깐 막는다.
        justDraggedRef.current = true;
        setTimeout(() => { justDraggedRef.current = false; }, 350);
        if (d.to !== d.from) { haptic('medium'); commitRef.current(d.from, d.to); }
      }
    };
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
    return () => {
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      document.removeEventListener('touchcancel', onEnd);
    };
  }, [active]);

  // 손잡이를 정확히 짚기 어려운 경우를 위해 '길게 누르기'로도 잡을 수 있게 한다.
  const holdRef = React.useRef(null);
  const cancelHold = React.useCallback(() => {
    if (holdRef.current) { clearTimeout(holdRef.current.timer); holdRef.current = null; }
  }, []);
  const justDraggedRef = React.useRef(false);

  const startDrag = React.useCallback((i, count) => (e) => {
    const t = e.touches ? e.touches[0] : e;
    const rects = [];
    for (let k = 0; k < count; k++) {
      const el = rowsRef.current[k];
      rects[k] = el ? el.getBoundingClientRect() : null;
    }
    if (!rects[i]) return;
    const d = { from: i, to: i, dy: 0, startY: t.clientY, rects };
    dragRef.current = d;
    setDrag(d);
    haptic('light');
  }, []);

  // 드래그 중 각 행에 줄 transform. 잡은 행은 손가락을 따라가고, 사이에 낀
  // 행들은 한 칸씩 비켜선다.
  const rowStyle = React.useCallback((i) => {
    if (!drag) return undefined;
    const rects = drag.rects;
    const src = rects[drag.from];
    if (!src) return undefined;
    if (i === drag.from) {
      return { transform: `translateY(${drag.dy}px) scale(1.02)`, position:'relative', zIndex:5,
               opacity:0.97, boxShadow:'0 8px 24px rgba(0,0,0,0.45)', transition:'none' };
    }
    const step = rects.length > 1 && rects[0] && rects[1]
      ? Math.abs(rects[1].top - rects[0].top) : src.height;
    let shift = 0;
    if (drag.from < i && i <= drag.to) shift = -step;
    else if (drag.to <= i && i < drag.from) shift = step;
    return { transform: `translateY(${shift}px)`, transition:'transform 0.16s ease' };
  }, [drag]);

  // 행 아무 데나 길게 눌러도 잡히게 하는 핸들러 묶음.
  const holdProps = React.useCallback((i, count) => ({
    onTouchStart: (e) => {
      const t = e.touches && e.touches[0];
      if (!t) return;
      const y0 = t.clientY, x0 = t.clientX;
      const timer = setTimeout(() => {
        holdRef.current = null;
        startDrag(i, count)({ touches: [{ clientY: y0, clientX: x0 }] });
      }, 320);
      holdRef.current = { timer, x0, y0 };
    },
    onTouchMove: (e) => {
      const h = holdRef.current;
      const t = e.touches && e.touches[0];
      if (!h || !t) return;
      // 손가락이 움직였으면 스크롤 의도로 보고 길게 누르기를 취소한다.
      if (Math.abs(t.clientY - h.y0) > 8 || Math.abs(t.clientX - h.x0) > 8) cancelHold();
    },
    onTouchEnd: cancelHold,
    onTouchCancel: cancelHold,
  }), [startDrag, cancelHold]);

  const suppressClick = React.useCallback(() => justDraggedRef.current, []);

  return { dragging: active, registerRow, startDrag, rowStyle, holdProps, suppressClick };
}

// 가로 스크롤 목록의 가장자리 페이드. 잘린 쪽에만 걸어, 스크롤이 끝에 닿으면
// 그쪽 페이드는 사라진다(첫/마지막 항목이 흐려 보이지 않게).
// 배경색을 덮는 오버레이 대신 mask 로 내용 자체를 흐린다 — 라이트 모드에서도
// 배경색을 가정하지 않고 그대로 동작한다.
// 하단 탭바 최소화를 위해 웹의 스크롤 위치를 네이티브로 흘려보낸다.
// iOS 26 탭바는 명령형 API 가 없고 UITabBarController 가 스크롤뷰를 관찰해
// 스스로 접고 편다 — 그래서 '접어라'가 아니라 '지금 여기까지 스크롤됐다'를 보낸다.
// 웹(비네이티브)에서는 onChange 로 방향만 넘겨 CSS 탭바를 접는다.
function useTabBarScrollSync(onScrollY) {
  return React.useCallback((e) => {
    const y = e.currentTarget.scrollTop;
    onScrollY && onScrollY(y);
  }, [onScrollY]);
}

function useEdgeFade(ref, fade = 28) {
  const [edge, setEdge] = React.useState({ left: false, right: false });
  const update = React.useCallback(() => {
    const el = ref.current;
    if (!el) return;
    const left = el.scrollLeft > 4;
    const right = el.scrollLeft + el.clientWidth < el.scrollWidth - 4;
    setEdge(p => (p.left === left && p.right === right) ? p : { left, right });
  }, [ref]);
  React.useEffect(() => {
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, [update]);
  const mask = `linear-gradient(to right, ${
    edge.left ? `transparent 0, #000 ${fade}px` : '#000 0'
  }, ${
    edge.right ? `#000 calc(100% - ${fade}px), transparent 100%` : '#000 100%'
  })`;
  return {
    update,
    onScroll: update,
    style: { maskImage: mask, WebkitMaskImage: mask,
             transition: 'mask-image 0.2s ease, -webkit-mask-image 0.2s ease' },
  };
}

// 한 종목 안에서만 순서를 바꾸는 그룹. 종목 경계를 넘는 드래그는 애초에
// 불가능하게 만든다 — 선수 목록이 종목별로 묶여 나오므로, 편집 화면에서만
// 섞을 수 있게 두면 옮겨도 반영되지 않아 사용자를 속이게 된다.
// (훅은 조건부·반복 호출이 안 되므로 그룹마다 별도 컴포넌트로 분리한다.)
function ReorderPlayerGroup({ sport, icon, players, onReorder, renderRow }) {
  const drag = useTouchReorder(onReorder);
  return (
    <>
      <div style={{ display:'flex', alignItems:'center', gap:6, margin:'10px 2px 8px' }}>
        <span style={{ fontSize:13 }}>{icon}</span>
        <span style={{ fontSize:11, fontWeight:700, color:'var(--text3)', letterSpacing:0.6 }}>{sport}</span>
        <span style={{ fontSize:10, color:'var(--text5)', fontWeight:600 }}>{players.length}명</span>
      </div>
      {players.map((p, i) => renderRow(p, {
        rowRef: drag.registerRow(i),
        style: drag.rowStyle(i),
        hold: drag.holdProps(i, players.length),
        onGuardedClick: drag.suppressClick,
        handle: <DragHandle onStart={drag.startDrag(i, players.length)} active={drag.dragging}/>,
      }))}
    </>
  );
}

// 탭 상단 타이틀 행. 일정·선수·뉴스가 각자 마크업을 갖고 있어 여백이 조금씩
// 달랐다(선수 탭만 우측 버튼 때문에 행이 높아 타이틀이 아래로 밀림).
// 한 컴포넌트로 묶어 버튼 유무와 무관하게 같은 높이·같은 위치를 보장한다.
function TabHeader({ title, right = null }) {
  return (
    <div style={{ padding:'16px 20px 8px', display:'flex', alignItems:'center',
                  justifyContent:'space-between', minHeight: CTRL_H + 24, boxSizing:'border-box' }}>
      <span style={{ fontSize:22, fontWeight:700, color:'var(--text)', letterSpacing:-0.5 }}>{title}</span>
      {right}
    </div>
  );
}

function DragHandle({ onStart, active }) {

    <div onTouchStart={onStart}
         style={{ padding:'12px 8px', margin:'-6px -2px -6px -4px', cursor:'grab',

}

// 쓰이므로 함께 붙인다.
function koreansForTeam(teamName, teamCode, sport) {
  const primary = KOREAN_PLAYERS[teamName];
  const extras = KOREAN_PLAYERS_EXTRA[teamName] || [];
  const all = [...(primary ? [primary] : []), ...extras];
  // 팀 이름은 종목을 넘어 겹친다 — 'Rangers' 는 스코틀랜드 축구팀이자 MLB
  // 텍사스 레인저스다. 종목이 주어지면 그 종목 선수만 남긴다(안 주면 종전대로).
  const matched = sport
    ? all.filter(p => ALL_PLAYERS.find(x => x.name === p.name)?.sport === sport)
    : all;
  return matched.map(p => ({ ...p, team: teamCode }));
}

  // '⚾'만 보고 뭉뚱그리면 안 된다(기존엔 AAA 경기에도 배지가 붙었다).
  if (sport.includes('MLB')) return MLB_BROADCASTERS;

  for (const key of Object.keys(BROADCASTERS)) {
    if (lower.includes(key.toLowerCase())) return BROADCASTERS[key];

  return [];
}

// ─── HELPER: 선발 확률 — 최근 경기의 선발 여부를 최신 가중으로 집계 ─
//
// 표본을 5 → 10경기로 늘리고 최근 경기에 더 큰 가중치를 준다(반감기 ≈ 4경기).
// 5경기 표본은 값이 20% 단위로만 나와 해상도가 너무 거칠었다.
// 표본이 적을 때는 ALL_PLAYERS.startRate 기준선 쪽으로 끌어당겨(축소 추정)
// 두세 경기 결과로 0%·100% 같은 극단값이 튀지 않게 한다. 표본이 쌓이면
// 기준선의 영향은 자연히 20% 아래로 떨어진다.
function computeStartProbability(playerName, allMatches) {
  const FINAL = ['STATUS_FINAL','STATUS_FULL_TIME','final','STATUS_END_PERIOD','STATUS_FINAL_PEN'];
  const kpOf = (m) => (m.koreanPlayers || [m.koreanPlayer]).find(p => p?.name === playerName);
  const past = (allMatches || [])
    .filter(m => {
      if (!FINAL.includes(m.status)) return false;
      const kp = kpOf(m);
      if (!kp) return false;
      // 라인업이 실제로 파싱된 경기만 표본에 넣는다. 맨 '미출전'은 AF 상세를
      // 못 받아온 경우에도 붙기 때문에, 그걸 세면 데이터 누락이 선발률 하락으로
      // 둔갑한다. 다만 lineupConfirmed=true 인 미출전은 명단이 실제로 발표됐는데
      // 빠진 것이므로 진짜 0점 표본으로 포함한다.
      return kp.event === '풀타임' || kp.event === '교체 아웃' || kp.event === '벤치'
        || (typeof kp.event === 'string' && kp.event.includes('분 출전'))
        || (kp.minutesPlayed||0) > 0 || (kp.matchGoals||0) > 0 || (kp.matchAssists||0) > 0
        || (kp.event === '미출전' && kp.lineupConfirmed === true);
    })
    .sort((a, b) => new Date(b.fullDate||0) - new Date(a.fullDate||0))
    .slice(0, 10);

  const base = ALL_PLAYERS.find(x => x.name === playerName)?.startRate;
  if (past.length < 3) return base ?? null;   // 표본이 너무 적으면 기준선 그대로

  // 반감기 ≈ 2.4경기. 축구는 로테이션이 잦아 '직전 서너 경기'가 다음 선발을 가장
  // 잘 설명한다. 0.82(반감기 4경기)로는 최근 3연속 선발과 3연속 벤치의 결과가
  // 10%p 밖에 안 벌어져 신호가 묻혔다.
  const DECAY = 0.75;
  let num = 0, den = 0;
  past.forEach((m, i) => {
    const kp = kpOf(m);
    if (!kp) return;
    const w = Math.pow(DECAY, i);
    // 교체로 들어와 60분 이상 뛴 경우도 사실상 주전 취급.
    const started = (kp.event === '풀타임' || kp.event === '교체 아웃' || (kp.minutesPlayed||0) >= 60) ? 1 : 0;
    num += w * started;
    den += w;
  });
  if (!den) return base ?? null;

  // 축소 추정: 기준선을 '가상의 표본 K경기'로 취급해 섞는다. 표본이 쌓이면
  // (den 이 커지면) 기준선의 영향은 자연히 사라진다.
  const K = base != null ? 1 : 0;
  const p = (num + (base ?? 0) / 100 * K) / (den + K);
  return Math.max(0, Math.min(100, Math.round(p * 100 / 5) * 5));   // 5% 단위
}

// A player optioned to the minors isn't on his MLB club's active roster, so that
// club's *MLB* game isn't really "his" — hide it. His actual minor-league games
// (sport '⚾ AAA' etc.) are surfaced separately and must stay visible, so only
// MLB-level games are filtered here. IL/injured players stay on the 40-man roster,
// so their team's games are still shown. 'minors' kind is set only for baseball
// players by the daily roster sync.
function koreanIsMinorLeaguer(m) {
  const kp = m && m.koreanPlayer;
  if (!kp) return false;
  if (!(m.sport || '').includes('MLB')) return false; // his minor-league games should show
  return ALL_PLAYERS.find(p => p.name === kp.name)?.injury?.kind === 'minors';
}
// 카드 우측 상단 배지는 폭이 좁다. 야구 스탯 라인이 길면(예: '3타수 2안타 1홈런
// 3타점') 선수 이름이 줄바꿈되고, 홈런·타점은 카드 안쪽 알약으로 이미 보여주고
// 있어 중복이다 → 배지에는 '몇타수 몇안타'까지만 남긴다.
// '미출전'·'확인 불가'는 정보가 없거나 부정적인 상태 — 배지를 덜 강조한다.
const isMutedEvent = (ev) => ev === '미출전' || ev === '확인 불가';

// 종료 상태 판정. HomeV2 안에만 있어서 LiveDetailScreen 에서 부르면
// ReferenceError 로 화면이 통째로 죽었다(라인업 탭 검은 화면) → 모듈 스코프로.
// 설정에 보여줄 앱 버전. 네이티브가 주입한 실제 번들 값(window.__jumoAppInfo)을
// 그대로 쓴다 — 하드코딩하면 릴리스마다 갱신을 잊어 실제와 어긋난다(v1.0.0 으로
// 몇 달째 박혀 있었다). OTA 로 JS 만 바뀌어도 이 값은 설치된 바이너리 기준이다.
function appVersionLabel() {
  const info = (typeof window !== 'undefined' && window.__jumoAppInfo) || null;
  if (info && info.version) {
    return `Jumo v${info.version}${info.build ? ` (${info.build})` : ''}`;
  }
  return 'Jumo — 웹';   // 브라우저에서 열었을 때
}

// API-Football 의 "season" 은 시즌 시작 연도다.
//  - 유럽 리그(8월~5월): 8월부터 새 시즌 → 7월까지는 전년도가 현재 시즌
//  - MLS 등 한 해 안에 끝나는 리그: 연도가 곧 시즌
// 예전엔 통계는 2026, 부상은 2025 로 각각 하드코딩돼 있었다 — 시즌이 넘어가면
// 조용히 지난 시즌 값을 보여주게 되므로 날짜에서 유도한다.
const CALENDAR_SEASON_LEAGUES = new Set(['MLS', 'K리그1', 'K리그2']);
const afSeasonFor = (p) => {
  const now = new Date();
  const y = now.getFullYear();
  if (CALENDAR_SEASON_LEAGUES.has(p?.league)) return y;
  return now.getMonth() >= 7 ? y : y - 1;   // 8월(=7)부터 새 시즌
};
// 화면에 쓸 시즌 라벨. MLS 는 '2026', 유럽은 '2026-27'.
const seasonLabel = (p) => {
  const y = afSeasonFor(p);
  return CALENDAR_SEASON_LEAGUES.has(p?.league) ? `${y}` : `${y}-${String(y + 1).slice(2)}`;
};

const isFinalStatus = (status) =>
  ['STATUS_FINAL','STATUS_FULL_TIME','final','STATUS_END_PERIOD','STATUS_FINAL_PEN'].includes(status);

// 이 선수가 실제로 그라운드를 밟았는가.
// 코리안 더비처럼 한 경기에 여러 선수가 걸릴 때, 뛰지 않은 선수까지 '출전 중'으로
// 묶어 부르는 일을 막는다(마인츠전에서 홍현석이 미출전인데 출전 중으로 나왔다).
const isPlayingKorean = (kp) => {
  const ev = (kp?.event || '').trim();
  if (!ev) return false;
  if (/미출전|벤치/.test(ev)) return false;          // 벤치 · 벤치 대기 · 미출전
  if (ev === '출전 예상' || ev === '출전 여부 확인 중') return false;  // 아직 미확정
  return true;   // 선발 출전 · 출전 중 · 교체 출전 중 · 교체 아웃 · 야구 스탯 라인
};

// ESPN 라인업 조회 — AF 가 아직 안 냈을 때 쓰는 폴백.
// 폴링 사이클과 경기 상세가 같은 함수를 쓰게 모듈 스코프에 둔다(구현이 갈라지면
// 카드에는 '선발 출전'인데 라인업 탭은 비는 식으로 어긋난다 — 실제로 그랬다).
// ESPN 은 iPhone UA 를 403 으로 막아 /api/espn 프록시를 거친다.
const ESPN_EVENT_CACHE = {};
async function espnLineupsForMatch(m) {
  if (!m || !m.fullDate) return null;
  const kps = (m.koreanPlayers || [m.koreanPlayer]).filter(Boolean);
  const prof = kps.map(kp => ALL_PLAYERS.find(p => p.name === kp.name))
                  .find(p => p && p.espnTeamId && p.espnLeague);
  if (!prof) return null;
  const base = `${API_BASE}/api/espn?path=soccer/${prof.espnLeague}`;
  let evId = ESPN_EVENT_CACHE[m.id];
  if (evId === undefined) {
    // 팀 일정(/teams/{id}/schedule)은 '지난 경기'만 준다 — 예정 경기는 날짜별
    // scoreboard 에서 찾는다. UTC 자정 근처 경기를 놓치지 않게 앞뒤 하루까지.
    const ko = new Date(m.fullDate);
    const ymd = (d) => d.toISOString().slice(0, 10).replace(/-/g, '');
    evId = null;
    for (const off of [0, -1, 1]) {
      const day = ymd(new Date(ko.getTime() + off * 86400000));
      const sb = await fetch(`${base}/scoreboard&dates=${day}`)
        .then(r => r.ok ? r.json() : null).catch(() => null);
      const hit = (sb?.events || []).find(e =>
        Math.abs(new Date(e.date).getTime() - ko.getTime()) < 6 * 3600 * 1000 &&
        (e.competitions?.[0]?.competitors || []).some(c => String(c.team?.id) === String(prof.espnTeamId)));
      if (hit) { evId = hit.id; break; }
    }
    ESPN_EVENT_CACHE[m.id] = evId;
  }
  if (!evId) return null;
  const sum = await fetch(`${base}/summary&event=${evId}`)
    .then(r => r.ok ? r.json() : null).catch(() => null);
  const rosters = sum?.rosters || [];
  if (!rosters.some(t => (t.roster || []).some(a => a.starter))) return null;
  // AF 형태로 변환 — 기존 매칭·렌더 코드를 그대로 태운다. ESPN 선수 id 는
  // AF 와 다르므로 id 는 비우고 이름으로 붙게 한다.
  const conv = (a) => ({ player: {
    id: null, name: a.athlete?.displayName || '', number: Number(a.jersey) || null } });
  return rosters.map(t => ({
    team: { id: null, name: t.team?.displayName || '' },
    startXI: (t.roster || []).filter(a => a.starter).map(conv),
    substitutes: (t.roster || []).filter(a => !a.starter).map(conv),
  }));
}

// ── 콜드 스타트 체감 개선 ────────────────────────────────────────
// 마지막으로 화면에 반영한 경기 목록을 저장해 두고 다음 실행에서 곧바로 그린다.
// 네트워크가 끝나면 통째로 교체된다(stale-while-revalidate). 그동안 낡은 값을
// 보여주는 셈이라, 갱신 중이라는 사실을 상단 바로 분명히 알린다.
const MATCH_CACHE_KEY = 'jumo_matches_cache';
const MATCH_CACHE_MAX_AGE = 12 * 60 * 60 * 1000;   // 하루 넘은 목록은 무의미
function loadCachedMatches() {
  try {
    const { at, matches } = JSON.parse(localStorage.getItem(MATCH_CACHE_KEY) || 'null') || {};
    if (!at || !Array.isArray(matches) || !matches.length) return null;
    if (Date.now() - at > MATCH_CACHE_MAX_AGE) return null;
    return { at, matches };
  } catch { return null; }
}
function saveCachedMatches(matches) {
  // 캐시는 '있으면 좋은 것'이다 — 쿼터 초과 등은 조용히 넘긴다(다음 실행은 스켈레톤).
  try {
    let payload = JSON.stringify({ at: Date.now(), matches });
    // 경기에 라인업·이벤트가 붙으면 목록이 커진다. localStorage 쿼터를 통째로
    // 잡아먹지 않도록 1MB 를 넘으면 앞쪽(최근·임박) 절반만 남긴다.
    if (payload.length > 1024 * 1024) {
      payload = JSON.stringify({ at: Date.now(), matches: matches.slice(0, Math.ceil(matches.length / 2)) });
    }
    localStorage.setItem(MATCH_CACHE_KEY, payload);
  } catch {}
}

// 상단 갱신 표시. 화면에 이미(낡은) 내용이 있을 때만 뜬다 — 스켈레톤이 떠 있는
// 첫 로드에는 중복이라 띄우지 않는다.
function RefreshBar({ show }) {
  const [label, setLabel] = React.useState(false);
  React.useEffect(() => {
    if (!show) { setLabel(false); return; }
    // 순식간에 끝나는 갱신에 글자가 깜빡이지 않도록 조금 늦게 붙인다.
    const t = setTimeout(() => setLabel(true), 1200);
    return () => clearTimeout(t);
  }, [show]);
  if (!show) return null;
  return (
    <div style={{ position:'fixed', top:'env(safe-area-inset-top)', left:0, right:0, zIndex:300, pointerEvents:'none' }}>
      <div style={{ height:2.5, overflow:'hidden', background:'rgba(255,255,255,0.06)' }}>
        <div style={{ width:'33%', height:'100%', background:'var(--acc)', animation:'refreshSweep 1.1s ease-in-out infinite' }}/>
      </div>
      {label && (
        <div style={{ display:'flex', justifyContent:'center', marginTop:6, animation:'fadeIn 0.25s ease' }}>
          <span style={{ fontSize:11, fontWeight:600, color:'var(--text2)', background:'rgba(0,0,0,0.55)',
                         backdropFilter:'blur(10px)', WebkitBackdropFilter:'blur(10px)',
                         borderRadius:12, padding:'4px 10px' }}>
            최신 정보 불러오는 중
          </span>
        </div>
      )}
    </div>
  );
}

function compactBadgeEvent(ev) {
  const m = /^(\d+타수\s*\d+안타)/.exec(ev || '');
  return m ? m[1] : (ev || '');
}
function formatExpectedEvent(kp, allMatches) {
  if (!kp) return '';
  if (kp.event === '출전 예상') {
    const p = computeStartProbability(kp.name, allMatches);
    // 계산하는 값은 '선발' 확률이다. 벤치에서 늘 출전하는 선수를 '출전 예상 20%'로
    // 적으면 사실과 어긋나므로 라벨을 실제 지표에 맞춘다.
    if (p != null) return `선발 예상 ${p}%`;
  }
  return kp.event || '';
}

// ─── HELPER: Dynamic date generator ──────────────────────────
function getRelativeDate(hoursFromNow) {
  const date = new Date();
  date.setHours(date.getHours() + hoursFromNow);
  return date.toISOString();
}

function formatHHMM(date) {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date(date)).reduce((acc, p) => (acc[p.type] = p.value, acc), {});
  return `${parts.hour}:${parts.minute}`;
}

function formatKRTime(date) {
  const d = new Date(date);
  const tz = 'Asia/Seoul';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz,
    hour: 'numeric', minute: '2-digit', hour12: false,
    year: 'numeric', month: 'numeric', day: 'numeric',
  }).formatToParts(d).reduce((acc, p) => (acc[p.type] = p.value, acc), {});
  const hours = parseInt(parts.hour, 10);
  const minutes = parts.minute;
  const period = hours < 12 ? '오전' : '오후';
  const displayHours = hours > 12 ? hours - 12 : (hours === 0 ? 12 : hours);

  const nowParts = new Intl.DateTimeFormat('en-US', { timeZone: tz, year:'numeric', month:'numeric', day:'numeric' })
    .formatToParts(new Date()).reduce((acc, p) => (acc[p.type] = p.value, acc), {});
  const isToday = parts.year === nowParts.year && parts.month === nowParts.month && parts.day === nowParts.day;
  const dayLabel = isToday ? '오늘' : '내일';

  return `${dayLabel} ${period} ${displayHours}:${minutes} KST`;
}

function formatShortTime(date) {
  const d = new Date(date);
  const now = new Date();
  const hours = String(d.getHours()).padStart(2, '0');
  const minutes = String(d.getMinutes()).padStart(2, '0');

  const isToday = d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();

  if (isToday) {
    return `${hours}:${minutes}`;
  } else {
    return `내일 ${hours}:${minutes}`;
  }
}

const teamLogoCache = {};

function TeamBadge({ code, size=36, logo }) {
  const colors = { TOT:'#132257', MCI:'#6CABDD', PSG:'#003399', Atletico:'#CB3524', ATM:'#CB3524', OL:'#FFFFFF', LAD:'#005A9C', TOR:'#134A8E', FCB:'#DC052D', BVB:'#FDE100', T1:'#C89B3C', GEN:'#EC1C24' };
  const textColors = { MCI:'#132257', OL:'#1B3A6B', BVB:'#1B1B1B' };
  const bg = colors[code] || '#333';
  const tc = textColors[code] || '#fff';
  const [blobUrl, setBlobUrl] = React.useState(logo ? (teamLogoCache[logo] || null) : null);

  React.useEffect(() => {
    if (!logo) return;
    if (teamLogoCache[logo]) { setBlobUrl(teamLogoCache[logo]); return; }
    if (teamLogoCache[logo] === '') return;
    fetch(logo, { referrerPolicy: 'no-referrer' })
      .then(r => r.ok ? r.blob() : null)
      .then(blob => {
        if (!blob) { teamLogoCache[logo] = ''; return; }
        const url = URL.createObjectURL(blob);
        teamLogoCache[logo] = url;
        setBlobUrl(url);
      })
      .catch(() => { teamLogoCache[logo] = ''; });
  }, [logo]);

  if (blobUrl) {
    return <img src={blobUrl} alt={code} style={{ width:size, height:size, objectFit:'contain', flexShrink:0 }}/>;
  }

  return (
    <div style={{ width:size, height:size, borderRadius:size*0.22, background:bg, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
      <span style={{ ...NUM, fontSize:size*0.3, fontWeight:700, color:tc, letterSpacing:-0.5 }}>{code}</span>
    </div>
  );
}

function BackBtn({ onBack, nativeHandled }) {
  // Only screens wired to the native glass back overlay (match/player/addplayer/notif)
  // pass nativeHandled. Tab-internal sub-views keep this web glass back so they
  // never end up with no back button when the native chrome is active.
  // When the native overlay handles it, render an invisible same-size SPACER (not
  // null) so the web header layout is preserved — otherwise a justify-between
  // header (addplayer's 완료) collapses left and other content rides up under the
  // floating native button. The native glass back is positioned over this spacer.
  if (nativeHandled && typeof window !== 'undefined' && window.__nativeChrome)
    return <div aria-hidden style={{ ...LG.circle, visibility:'hidden' }}/>;
  return (
    <button onClick={onBack} style={{ ...LG.base, ...LG.circle, color:'rgba(255,255,255,0.85)' }}>
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M7 1.5L2 7.5L7 13.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
    </button>
  );
}

// Liquid-glass segmented control (iOS 26 toolbar tabs). tabs: [{id,label}]
function GlassSegmented({ tabs, active, onChange, sticky = false, style }) {
  // On native, a fixed glass back (top-left) + follow pill (top-right) overlay the
  // screen. When this sticky tab bar pins to the top it collides with them, so we
  // detect the "stuck" state and shrink + center the bar to clear them.
  const [stuck, setStuck] = React.useState(false);
  const wrapRef = React.useRef(null);
  const isNative = typeof window !== 'undefined' && !!window.__nativeChrome;
  React.useEffect(() => {
    if (!sticky || !isNative) { setStuck(false); return; }
    const el = wrapRef.current; if (!el) return;
    let sc = el.parentElement;
    while (sc && sc !== document.body) { const oy = getComputedStyle(sc).overflowY; if (oy === 'auto' || oy === 'scroll') break; sc = sc.parentElement; }
    const target = (sc && sc !== document.body) ? sc : window;
    const SAFE = parseFloat(getComputedStyle(document.body).paddingTop) || 47;
    const check = () => { const el2 = wrapRef.current; if (!el2) return; const top = el2.getBoundingClientRect().top; setStuck(p => p ? top <= SAFE + 92 : top <= SAFE + 50); };
    check();
    target.addEventListener('scroll', check, { passive: true });
    window.addEventListener('resize', check);
    return () => { target.removeEventListener('scroll', check); window.removeEventListener('resize', check); };
  }, [sticky, isNative]);
  // When pinned on native, drop the bar a tier below the floating back/follow
  // buttons and paint a solid band over their row so nothing overlaps.
  const twoTier = sticky && isNative && stuck;
  return (
    <div ref={wrapRef} style={{ position: sticky ? 'sticky' : 'static', top: twoTier ? 50 : 0, zIndex: 10, padding: '10px 16px', background: 'var(--bg)', transition: 'top 0.2s ease', ...style }}>
      {twoTier && <div style={{ position: 'absolute', left: 0, right: 0, bottom: '100%', height: 240, background: 'var(--bg)' }}/>}
      <div style={{ display: 'flex', borderRadius: CTRL_H/2, padding: 4, background: 'var(--card)', border: '0.5px solid var(--border2)' }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => onChange(t.id)} style={{
            flex: 1, border: 'none', cursor: 'pointer', height: CTRL_H - 8, padding: '0 4px', fontSize: 13, fontWeight: 700,
            borderRadius: (CTRL_H - 8) / 2, letterSpacing: 0.2, whiteSpace: 'nowrap', transition: 'color 0.15s, background 0.15s',
            background: active === t.id ? 'rgba(255,255,255,0.14)' : 'transparent',
            boxShadow: active === t.id ? '0 1px 2px rgba(0,0,0,0.2)' : 'none',
            color: active === t.id ? '#fff' : 'var(--text3)',
            WebkitTapHighlightColor: 'transparent', touchAction: 'manipulation',
          }}>{t.label}</button>
        ))}
      </div>
    </div>
  );
}

// ─── TAB BAR ─────────────────────────────────────────────────
// iOS 26+ detection.
//   1) `?glass=1` query forces ON.
//   2) Capacitor iOS shell: ON unconditionally (the iOS 26 WKWebView reports
//      a frozen UA of "iPhone OS 18_x" so version sniffing doesn't work —
//      we instead rely on Xcode's deployment target to gate the OS version).
//   3) Mobile Safari on the public web: try UA patterns (works for ?glass=1
//      previews from desktop, and any future iOS that exposes a real version).
const IS_IOS26_PLUS = (() => {
  try {
    if (typeof location !== 'undefined' && /[?&]glass=1\b/.test(location.search)) return true;
    const inCapacitorIOS = typeof window !== 'undefined' && !!(window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === 'ios');
    if (inCapacitorIOS) return true;
    const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
    if (!/iPhone|iPad|iPod/.test(ua)) return false;
    const patterns = [/OS (\d+)[_.]/, /Version\/(\d+)\./, /CPU OS (\d+)/];
    let major = 0;
    for (const re of patterns) {
      const m = ua.match(re);
      if (m) major = Math.max(major, parseInt(m[1], 10));
    }
    return major >= 26;
  } catch { return false; }
})();

const TabBar = React.memo(function TabBar({ active: propActive, onTab, elevated = false, hidden = false }) {
  const [active, setActive] = React.useState(propActive);
  React.useEffect(() => { setActive(propActive); }, [propActive]);
  const handlePress = (id) => {
    if (id !== active) setActive(id);
  };
  const handleClick = (id) => {
    onTab(id);
  };
  // In Liquid Glass mode, active state is shown via the pill background, so we
  // keep icons stroke-only (no heavy fill) to match iOS 26 native behavior.
  const fillFor = (id) => (IS_IOS26_PLUS ? 'none' : (active===id ? 'currentColor' : 'none'));
  const ICON_SIZE = IS_IOS26_PLUS ? 21 : 22;
  const tabs = [
    { id:'home', label:'홈', icon: <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 22 22" fill="none"><path d="M3 9.5L11 2l8 7.5V20H14v-5h-6v5H3V9.5z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" fill={fillFor('home')}/></svg> },
    { id:'schedule', label:'일정', icon: <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 22 22" fill="none"><rect x="3" y="5" width="16" height="15" rx="3" stroke="currentColor" strokeWidth="1.8"/><path d="M7 3v4M15 3v4M3 10h16" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>{active==='schedule' && !IS_IOS26_PLUS && <circle cx="11" cy="15" r="1.5" fill="currentColor"/>}</svg> },
    { id:'players', label:'선수', icon: <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 22 22" fill="none"><circle cx="11" cy="8" r="3.5" stroke="currentColor" strokeWidth="1.8" fill={fillFor('players')}/><path d="M4 19c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg> },
    { id:'news', label:'뉴스', icon: <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 22 22" fill="none"><rect x="2" y="4" width="18" height="14" rx="2.5" stroke="currentColor" strokeWidth="1.8" fill={fillFor('news')}/><path d="M6 8.5h10M6 12h7" stroke={(active==='news' && !IS_IOS26_PLUS) ? 'var(--bg)' : 'currentColor'} strokeWidth="1.6" strokeLinecap="round"/></svg> },
    { id:'more', label:'더보기', icon: <svg width={ICON_SIZE} height={ICON_SIZE} viewBox="0 0 22 22" fill="none"><circle cx="5" cy="11" r="1.8" fill="currentColor"/><circle cx="11" cy="11" r="1.8" fill="currentColor"/><circle cx="17" cy="11" r="1.8" fill="currentColor"/></svg> },
  ];
  return (
    <div className={IS_IOS26_PLUS ? 'tabbar-liquid-glass' : ''} style={{
      position: 'fixed',
      bottom: 0,
      left: 0,
      right: 0,
      zIndex: elevated ? 350 : 100,
      pointerEvents: elevated ? 'none' : (hidden ? 'none' : undefined),
      transform: hidden ? 'translateY(120%)' : 'none',
      transition: 'transform 0.26s ease',
      display:'flex',
      borderTop: IS_IOS26_PLUS ? 'none' : '0.5px solid var(--border)',
      background: IS_IOS26_PLUS ? undefined : 'var(--tab-bg)',
      backdropFilter: IS_IOS26_PLUS ? undefined : 'blur(20px)',
      WebkitBackdropFilter: IS_IOS26_PLUS ? undefined : 'blur(20px)',
      paddingBottom: IS_IOS26_PLUS ? undefined : 'calc(8px + env(safe-area-inset-bottom))',
      paddingTop: IS_IOS26_PLUS ? undefined : 8,
      transform:'translateZ(0)',
      WebkitTransform:'translateZ(0)',
      willChange:'transform',
    }}>
      {tabs.map(t => (
        <button key={t.id} className={active===t.id ? 'active' : ''} onPointerDown={() => handlePress(t.id)} onClick={() => handleClick(t.id)} style={{ flex:1, background:'none', border:'none', cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:3, color: active===t.id ? 'var(--acc)' : 'var(--text4)', transition:'none', padding:'4px 0', WebkitTapHighlightColor:'transparent', touchAction:'manipulation' }}>
          {t.icon}
          <span style={{ fontSize: IS_IOS26_PLUS ? 9 : 10, fontWeight:600, letterSpacing:0.2 }}>{t.label}</span>
        </button>
      ))}
    </div>
  );
});

function TodayMatchCard({ m, onMatch, tweaks, allMatches = [] }) {
  // 카드에 실을 선수들 — 팔로우한 선수 전원(코리안 더비·같은 팀 복수). 팔로우 정보가
  // 아직 안 붙은 경로(일정 탭 등)에선 대표 선수 한 명으로 떨어진다.
  const explain = React.useContext(ExplainCtx);
  const cardKoreans = (m.followedKoreans?.length ? m.followedKoreans : [m.koreanPlayer]).filter(Boolean);
  const multiKorean = cardKoreans.length > 1;
  const isLive = m.live || m.time === 'LIVE';
  const isFinished = m.status === 'STATUS_FINAL' ||
                     m.status === 'STATUS_FULL_TIME' ||
                     m.status === 'final' ||
                     m.status === 'STATUS_END_PERIOD' ||
                     m.status === 'STATUS_FINAL_PEN';

  // Real-time live minute
  const calcMinute = () => {
    if (!m.periodStartTs) return m.minute || '';
    const minsInPeriod = Math.floor((Date.now()/1000 - m.periodStartTs) / 60);
    return String(Math.max(0, minsInPeriod + ((m.sfPeriod || 1) >= 2 ? 45 : 0)));
  };
  const [liveMinute, setLiveMinute] = React.useState(calcMinute);
  React.useEffect(() => {
    if (!isLive) return;
    const iv = setInterval(() => setLiveMinute(calcMinute()), 30000);
    return () => clearInterval(iv);
  }, [isLive, m.periodStartTs, m.sfPeriod]);

  // Countdown calculation
  const [countdown, setCountdown] = React.useState('');

  React.useEffect(() => {
    if (!isLive && m.fullDate) {
      const updateCountdown = () => {
        const now = new Date();
        const matchDate = new Date(m.fullDate);
        const diff = matchDate - now;

        if (diff > 0) {
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          setCountdown(`${hours}시간 ${minutes}분 ${seconds}초 뒤 시작`);
        } else {
          setCountdown('곧 시작');
        }
      };

      updateCountdown();
      const interval = setInterval(updateCountdown, 1000);
      return () => clearInterval(interval);
    }
  }, [isLive, m.fullDate]);

  // Format time display
  let timeLabel = '';
  let timeValue = m.time || '예정';
  if (!isLive && m.fullDate) {
    const date = new Date(m.fullDate);
    const now = new Date();
    const hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const isToday = date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();

    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const isTomorrow = date.getDate() === tomorrow.getDate() && date.getMonth() === tomorrow.getMonth() && date.getFullYear() === tomorrow.getFullYear();
    if (isToday) {
      timeLabel = hours < 12 ? '오전' : '오후';
    } else if (isTomorrow) {
      timeLabel = '내일';
    } else {
      timeLabel = `${date.getMonth() + 1}월 ${date.getDate()}일`;
    }

    const displayHours = hours > 12 ? hours - 12 : (hours === 0 ? 12 : hours);
    timeValue = `${String(displayHours).padStart(2, '0')}:${minutes}`;
  }

  return (
    <div onClick={() => onMatch(m)} style={{
      flexShrink:0, width:'calc(100vw - 44px)', maxWidth:280, borderRadius:20, overflow:'hidden', position:'relative',
      cursor:'pointer', background:'var(--card)', border:'0.5px solid var(--border)'
    }}>
      <div style={{ position:'relative', zIndex:2, padding:'16px' }}>
        {/* Korean player section - TOP.
            코리안 더비나 같은 팀 복수 선수(미트윌란)는 한 카드에 전원을 싣는다. */}
        <div style={{ marginBottom:16, paddingBottom:14, borderBottom:'0.5px solid var(--border)', display:'flex', flexDirection:'column', gap:10 }}>
          {cardKoreans.map((kp, i) => {
            const kpPlayer = ALL_PLAYERS.find(p => p.name === kp.name);
            const photoSize = multiKorean ? 40 : 48;
            return (
              <div key={kp.name || i} style={{ display:'flex', alignItems:'flex-start', gap:10 }}>
                <div style={{ display:'flex', alignItems:'center', gap:10, flex:1, minWidth:0 }}>
                  {tweaks.showPlayerPhoto && kpPlayer && (
                    <div style={{
                      width:photoSize, height:photoSize, borderRadius:'50%', overflow:'hidden',
                      background:'#fff', flexShrink:0,
                      boxShadow:'0 2px 6px rgba(0,0,0,0.15)'
                    }}>
                      <PlayerPhoto player={kpPlayer} style={{
                        width:'100%', height:'100%'
                      }}/>
                    </div>
                  )}
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize: multiKorean ? 14 : 15, fontWeight:700, color:'var(--text)', marginBottom:3 }}>
                      🇰🇷 {kp.name}
                    </div>
                    <div style={{ fontSize:11, color:'var(--text3)' }}>
                      {kp.team} #{kp.number}
                    </div>
                  </div>
                </div>

                {/* Event info - TOP RIGHT (마이너는 우측 상단에 표시하지 않고 하단 MLB 라벨로 대체) */}
                {kp.event && kp.event !== '마이너' && (() => {
                  const label = compactBadgeEvent(formatExpectedEvent(kp, allMatches));
                  const tip = explainForEvent(label);
                  return (
                  <div
                    onClick={tip ? (e) => {
                      e.stopPropagation();
                      // 눌린 배지 위치를 넘겨 그 옆에 툴팁을 띄운다.
                      explain({ ...tip, rect: e.currentTarget.getBoundingClientRect() });
                    } : undefined}
                    style={{
                    background: isMutedEvent(kp.event) ? 'transparent' : isLive ? 'rgba(230,48,48,0.1)' : 'var(--btn-bg)',
                    borderRadius:6, padding:'5px 8px', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center',
                    gap:3, cursor: tip ? 'pointer' : undefined
                  }}>
                    <span style={{ fontSize:10, fontWeight: isMutedEvent(kp.event) ? 500 : 600, color: isMutedEvent(kp.event) ? 'var(--text4)' : isLive ? 'var(--acc)' : 'var(--text2)', whiteSpace:'nowrap', lineHeight:1 }}>
                      {label}
                    </span>
                  </div>
                  );
                })()}
              </div>
            );
          })}
        </div>

        {/* Time Section or Result Section */}
        {isFinished ? (
          // FINISHED MATCH - Show score and player performance
          (() => {
            const koreanTeam = m.koreanPlayer?.team;
            const isHomeTeam = koreanTeam === m.home.code;
            const koreanScore = isHomeTeam ? m.home.score : m.away.score;
            const opponentScore = isHomeTeam ? m.away.score : m.home.score;
            const isWin = koreanScore > opponentScore;
            const isDraw = koreanScore === opponentScore;
            const opponentTeam = isHomeTeam ? m.away : m.home;

            const kp = m.koreanPlayer;
            const isMLB = (m.sport||'').includes('MLB') || (m.sport||'').includes('⚾');
            const matchGoals = m.events?.filter(e => e.type==='goal' && e.player===kp.name).length || 0;
            const matchAssists = m.events?.filter(e => e.type==='assist' && e.player===kp.name).length || 0;
            // '확인 불가'는 출전 여부 자체를 모르는 상태 → 출전으로 치지 않음(단, 골/도움이
            // 실제로 잡혔으면 출전 확정). 골/도움이 있으면 무조건 출전한 것.
            const isUnknown = kp.event === '확인 불가';
            const didPlay = (kp.event !== '미출전' && !isUnknown) || matchGoals > 0 || matchAssists > 0;

            // Build stat pills
            const statPills = [];
            if (!isMLB && didPlay) {
              if (matchGoals > 0) statPills.push({ label:`⚽ ${matchGoals}골`, accent:true });
              if (matchAssists > 0) statPills.push({ label:`🅰️ ${matchAssists}도움`, accent:true });
              if (kp.sfRating) statPills.push({ label:`★ ${kp.sfRating}`, accent:false, rating:true });
              else if (kp.rating) statPills.push({ label:`★ ${kp.rating}`, accent:false });
            } else if (isMLB && didPlay) {
              if (kp.hits !== undefined) statPills.push({ label:`${kp.hits}안타`, accent: kp.hits > 0 });
              if (kp.homeRuns > 0) statPills.push({ label:`${kp.homeRuns}홈런`, accent:true });
              if (kp.rbi > 0) statPills.push({ label:`${kp.rbi}타점`, accent:false });
              if (kp.avg) statPills.push({ label:`타율 ${kp.avg}`, accent:false });
            }

            return (
              <>
                {/* Player performance summary */}
                <div style={{ marginBottom:14 }}>
                  {multiKorean ? (
                    // 더비: 알약은 첫 번째 선수 기준이라 누구 기록인지 알 수 없다.
                    // 개인 기록은 위 각 선수 줄의 배지가 이미 보여준다.
                    <span style={{ fontSize:13, color:'var(--text3)', fontWeight:600 }}>
                      {isFinished ? '경기 종료' : (m.live || m.time === 'LIVE') ? '진행 중' : '경기 예정'}
                    </span>
                  ) : didPlay ? (
