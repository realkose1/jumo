          });
        }));

        // ── ESPN: MLB only ─────────────────────────────────────────────────
        const espnFmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
        const from = new Date(today); from.setDate(today.getDate() - 7);
        const to   = new Date(today); to.setDate(today.getDate() + 7);
        const mlbRes = await fetch(`${ESPN_API.mlb}?dates=${espnFmt(from)}-${espnFmt(to)}&limit=200`);
        const mlbData = await mlbRes.json();
        if (mlbData.events) {
          const matches = mlbData.events.map(e => transformESPNEvent(e, 'mlb'));
          allMatches.push(...matches);
        }

        // ── MLB StatsAPI: minor-league (AAA/AA/…) games for optioned-down players ──
        // ESPN scoreboard is MLB-only. When a Korean player is in the minors his MLB
        // club's games are hidden (koreanIsMinorLeaguer); instead we surface his real
        // minor-league games here so followers can still track him. Cheap: one
        // currentTeam batch + a per-minors-player (schedule + gameLog + team meta),
        // and usually 0–1 players are down at a time.
        try {
          const bbPlayers = ALL_PLAYERS.filter(p => p.sport === '야구' && p.mlbId);
          if (bbPlayers.length) {
            const ids = bbPlayers.map(p => p.mlbId).join(',');
            const [pplRes, mlbTeamsRes] = await Promise.all([
              fetch(`https://statsapi.mlb.com/api/v1/people?personIds=${ids}&hydrate=currentTeam`).then(r => r.ok ? r.json() : null).catch(() => null),
              fetch('https://statsapi.mlb.com/api/v1/teams?sportId=1').then(r => r.ok ? r.json() : null).catch(() => null),
            ]);
            const mlbTeamIds = new Set((mlbTeamsRes?.teams || []).map(t => t.id));
            const minorsList = [];
            (pplRes?.people || []).forEach(person => {
              const ct = person.currentTeam;
              if (!ct || mlbTeamIds.has(ct.id)) return; // on MLB roster → ESPN already covers it
              const pl = bbPlayers.find(p => p.mlbId === person.id);
              if (pl) minorsList.push({ player: pl, teamId: ct.id, teamName: ct.name });
            });

            const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
            const LEVEL = { 'Triple-A': 'AAA', 'Double-A': 'AA', 'High-A': 'A+', 'Single-A': 'A', 'Rookie': 'R', 'Rookie Advanced': 'R', 'Class A Short Season': 'A-' };
            const abbrOf = (team) => team?.abbreviation || (team?.name || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 3).toUpperCase();
            const logoOf = (id) => id ? `https://www.mlbstatic.com/team-logos/${id}.svg` : null;

            await Promise.all(minorsList.map(async ({ player, teamId, teamName }) => {
              try {
                // The level's sportId (AAA=11, AA=12, …) must be known FIRST: both the
                // schedule and gameLog need it, and gameLog accepts only a single
                // sportId (a CSV or omitting it returns MLB-only, not this level).
                const teamRes = await fetch(`https://statsapi.mlb.com/api/v1/teams/${teamId}`).then(r => r.ok ? r.json() : null).catch(() => null);
                const teamMeta = teamRes?.teams?.[0];
                const sportId = teamMeta?.sport?.id || 11; // default AAA
                const [schedRes, logRes] = await Promise.all([
                  fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=${sportId}&teamId=${teamId}&startDate=${ymd(from)}&endDate=${ymd(to)}&hydrate=team,linescore`).then(r => r.ok ? r.json() : null).catch(() => null),
                  fetch(`https://statsapi.mlb.com/api/v1/people/${player.mlbId}/stats?stats=gameLog&season=${today.getFullYear()}&group=hitting&sportId=${sportId}`).then(r => r.ok ? r.json() : null).catch(() => null),
                ]);
                const level = LEVEL[teamMeta?.sport?.name] || teamMeta?.sport?.name || '마이너';
                const myAbbr = teamMeta?.abbreviation || abbrOf({ name: teamName });
                // Match the player's per-game stat by gamePk (exact) — NOT by date:
                // schedule gameDate is UTC while gameLog date is the US officialDate,
                // so they disagree for US night games.
                const statByPk = {};
                (logRes?.stats?.[0]?.splits || []).forEach(s => { if (s.game?.gamePk) statByPk[s.game.gamePk] = s.stat; });

                (schedRes?.dates || []).forEach(dt => (dt.games || []).forEach(g => {
                  const home = g.teams?.home, away = g.teams?.away;
                  const isHome = home?.team?.id === teamId;
                  const st = g.status?.abstractGameState; // Preview | Live | Final
                  const isLive = st === 'Live', isFinished = st === 'Final';
                  const stat = statByPk[g.gamePk];
                  const ab = parseInt(stat?.atBats ?? 0) || 0, h = parseInt(stat?.hits ?? 0) || 0;
                  const hr = parseInt(stat?.homeRuns ?? 0) || 0, rbi = parseInt(stat?.rbi ?? 0) || 0;
                  const runs = parseInt(stat?.runs ?? 0) || 0, sb = parseInt(stat?.stolenBases ?? 0) || 0, bb = parseInt(stat?.baseOnBalls ?? 0) || 0;
                  const played = ab > 0 || bb > 0 || runs > 0;
                  const parts = [`${ab}타수 ${h}안타`]; if (hr) parts.push(`${hr}홈런`); if (rbi) parts.push(`${rbi}타점`); if (sb) parts.push(`${sb}도루`);
                  const event = played ? parts.join(' ') : (isFinished ? '미출전' : (isLive ? '출전 중' : '출전 예상'));
                  const half = g.linescore?.inningHalf;
                  const inning = (isLive && g.linescore?.currentInning) ? `${g.linescore.currentInning}회${half === 'Top' ? '초' : half === 'Bottom' ? '말' : ''}` : '';
                  const kp0 = { ...player, team: myAbbr, event, atBats: ab, hits: h, homeRuns: hr, rbi, runs, stolenBases: sb, baseOnBalls: bb };
                  allMatches.push({
                    id: `minor-${g.gamePk}`,
                    source: 'statsapi-minor',
                    live: isLive,
                    minute: '', inning,
                    sport: `⚾ ${level}`,
                    leagueKey: 'minor',
                    home: { name: home?.team?.name || '', code: isHome ? myAbbr : abbrOf(home?.team), score: (isLive || isFinished) ? (home?.score ?? 0) : null, logo: logoOf(home?.team?.id) },
                    away: { name: away?.team?.name || '', code: !isHome ? myAbbr : abbrOf(away?.team), score: (isLive || isFinished) ? (away?.score ?? 0) : null, logo: logoOf(away?.team?.id) },
                    koreanPlayer: kp0,
                    koreanPlayers: [kp0],
                    competition: level,
                    competitionLogo: null,
                    venue: g.venue?.name || '',
                    time: isLive ? 'LIVE' : (!isFinished ? formatHHMM(g.gameDate) : ''),
                    fullDate: g.gameDate,
                    krTime: formatKRTime(g.gameDate),
                    lineupConfirmed: isLive || isFinished,
                    events: [], stats: null,
                    status: isLive ? 'STATUS_IN_PROGRESS' : (isFinished ? 'STATUS_FINAL' : 'notstarted'),
                    isTimedOut: false,
                  });
                }));
              } catch (e) { console.warn('minor fetch failed for', player.name, e?.message || e); }
            }));
          }
        } catch (e) { console.warn('minor-league block failed:', e?.message || e); }

        // ── ESPN: UEFA club competitions (Champions/Europa/Conference) ──────
        // Keyless fallback so Korean players' European nights (e.g. the Champions
        // League final) always appear, even when the API-Football proxy is down.
        // Only Korean-player matches are kept; if API-Football also has the same
        // game it wins later (it carries lineup data), so no duplicates.
        try {
          const uefaUrls = [ESPN_API.soccer.ucl, ESPN_API.soccer.uel, ESPN_API.soccer.uecl];
          const uefaResults = await Promise.allSettled(
            uefaUrls.map(u => fetch(`${u}?dates=${espnFmt(from)}-${espnFmt(to)}&limit=200`).then(r => r.ok ? r.json() : null))
          );
          uefaResults.forEach(r => {
            if (r.status !== 'fulfilled' || !r.value?.events) return;
            r.value.events.forEach(e => {
              const leagueName = e.competitions?.[0]?.league?.name || 'UEFA';
              const m = transformESPNEvent(e, 'soccer', leagueName);
              if (m.koreanPlayer) { m.source = 'espn'; allMatches.push(m); }
            });
          });
        } catch (e) { console.warn('ESPN UEFA fetch failed:', e?.message || e); }

        // Deduplicate by id (same match can appear across multiple source responses)
        const seenIds = new Set();
        const uniqueMatches = allMatches.filter(m => {
          if (seenIds.has(m.id)) return false;
          seenIds.add(m.id);
          return true;
        });

        // ESPN UEFA matches are a fallback: if API-Football already has the same
        // Korean player's game that day, prefer it (it carries lineup data).
        const afKoreanKeys = new Set(
          uniqueMatches
            .filter(m => m.source === 'apifootball' && m.koreanPlayer)
            .map(m => `${m.koreanPlayer.name}|${m.fullDate ? new Date(m.fullDate).toDateString() : ''}`)
        );
        const dedupedMatches = uniqueMatches.filter(m => {
          if (m.source === 'espn' && m.koreanPlayer) {
            const k = `${m.koreanPlayer.name}|${m.fullDate ? new Date(m.fullDate).toDateString() : ''}`;
            if (afKoreanKeys.has(k)) return false; // API-Football already covers it
            return true;
          }
          if ((m.sport || '').includes('MLB')) return true; // keep MLB from ESPN
          return true;
        });

        // Filter for Korean players
        const koreanMatches = dedupedMatches.filter(m => m.koreanPlayer);

        // 이 시점의 목록은 아직 출전 정보가 초기값('출전 예상')이다. 곧바로 화면에
        // 내보내면 몇 초 뒤 보강 결과로 한 번 더 그려져 '떴다가 다시 갱신되는' 것이
        // 눈에 띈다. 스켈레톤이 로딩을 이미 알려주고 있으므로, 기본 목록은 보강이
        // 오래 걸릴 때만 쓰는 폴백으로 둔다 — 보강이 제때 끝나면 완성본 한 번만 그린다.
        //
        // ⚠ 폴백으로 내보낼 때도, 이전 폴링에서 확정된 정보('미출전'·'풀타임'·스탯
        // 라인)를 초기값으로 되돌리지 않도록 같은 경기(id)는 병합한다.
        const publishBase = () => {
          setLiveMatches(prev => {
            if (!prev.length) return [...koreanMatches];
            const prevById = new Map(prev.map(m => [m.id, m]));
            const merged = koreanMatches.map(m => {
              const old = prevById.get(m.id);
              const oldEv = old?.koreanPlayer?.event;
              const keepOld = oldEv && oldEv !== '출전 예상';
              return keepOld
                ? { ...m,
                    koreanPlayer: old.koreanPlayer,
                    koreanPlayers: old.koreanPlayers || m.koreanPlayers,
                    events: (old.events && old.events.length) ? old.events : m.events }
                : m;
            });
            return mergeUncovered(prev, merged);
          });
          setIsInitialLoad(false);
          lastPublishAtRef.current = Date.now();
        };
        const baseFallbackTimer = setTimeout(publishBase, 6000);

        // ── nameMatch helper ───────────────────────────────────────────────
        const nameMatch = (sfName, nameEn) => {
          const clean = s => (s || '').toLowerCase().replace(/[.\-\s]/g, '');
          const a = clean(sfName), b = clean(nameEn);
          if (!a || !b) return false;
          // Substring match, but require the shorter side to be ≥6 chars so a bare
          // surname (incl. "hwang", 5) can't collide with a different player's full
          // name — every full Korean name normalizes to ≥8 chars. Prevents a
          // teammate's goal being wrongly credited to the Korean player.
          const softEq = (x, y) => x === y || ((x.includes(y) || y.includes(x)) && Math.min(x.length, y.length) >= 6);
          if (softEq(a, b)) return true;
          // Western name order fallback (e.g. "Hee-chan Hwang" vs "Hwang Hee-chan")
          const words = nameEn.toLowerCase().split(/[\s-]+/).filter(Boolean);
          if (words.length >= 2) return softEq(a, clean(words.slice(1).join('') + words[0]));
          return false;
        };

        // ── API-Football: fetch lineups + events for live/finished/imminent soccer ──
        // Window: -10min..+90min from kickoff, plus all live/finished.
        const afKorean = koreanMatches.filter(m => {
          if (m.source !== 'apifootball') return false;
          if (m.live || m.status === 'STATUS_FINAL') return true;
          if (!m.fullDate) return false;
          const tilStart = new Date(m.fullDate).getTime() - Date.now();
          return tilStart > -10 * 60 * 1000 && tilStart <= 90 * 60 * 1000;
        });

        // 선수 확장으로 상세 대상이 많아지면 경기당 3콜이 API-Sports 분당 한도를
        // 넘겨 빈 응답('확인 불가')이 쏟아진다. 우선순위(라이브 > 임박 > 최근 종료)로
        // 정렬해 네트워크 fetch는 사이클당 8경기까지만 — 나머지는 다음 폴링에서
        // 이어서 채우고, 성공분은 영구 캐시라 결국 전부 소화된다.
        const detailsCacheForSort = afDetailsCacheRef.current;
        const afPriority = (m) => {
          if (m.live) return 0;
          if (m.status !== 'STATUS_FINAL') return 1;                       // 임박(킥오프 전 창)
          return 2 + Math.abs(Date.now() - new Date(m.fullDate).getTime()) / 86400000; // 최근 종료 우선
        };
        const afSorted = [...afKorean].sort((a, b) => afPriority(a) - afPriority(b));

        // 상세도 Supabase sf_cache 로 공유한다(키: 'af-detail-{fixtureId}') —
        // 여러 기기·푸시크론이 같은 경기를 각자 fetch 하지 않도록. 사용자가 늘어도
        // API 콜이 사용자 수에 비례해 늘지 않는다. 로컬 캐시가 없는 항목만 조회.
        // 라인업 응답은 '팀 껍데기만 오고 startXI 가 빈' 경우가 흔하다(발표 전 조회,
        // 순간 레이트리밋). lineups 배열 길이로 완결성을 판정하면 이런 반쪽 응답도
        // 정상으로 보여, 종료 경기라는 이유로 영구 캐시되고 영영 '확인 불가'로 굳는다.
        // → 실제 명단 엔트리 수로 판정한다.
        const rosterCount = (lu) => (lu || []).reduce(
          (n, t) => n + ((t.startXI || []).length + (t.substitutes || []).length), 0);
        // 종료 경기인데 이벤트가 하나도 없으면(교체·골·카드 전무) 완결로 보지 않는다.
        // 90분 경기에 이벤트가 0개인 건 사실상 없고, 실제로는 events 콜만 한도에
        // 걸려 빈 채로 온 경우다 — 그걸 영구 캐시하면 교체 투입 선수가 '미출전'으로
        // 굳는다(제보: 밤새 결과가 미출전으로 떠 있다가 재시작 후에야 정상).
        // 이 판정은 공유 캐시(sf_cache) 읽기에도 쓰이므로 이미 오염된 행도 만료된다.
        const detailIncomplete = (d) =>
          rosterCount(d && d.lineups) === 0 ||
          (d && d.status === 'STATUS_FINAL' && (d.events || []).length === 0);
        const kickoffById = {};
        afKorean.forEach(m => { kickoffById[m.id] = m.fullDate ? new Date(m.fullDate).getTime() : null; });
        const detailTtl = (d, id) => {
          if (!d) return 0;
          if (d.status !== 'STATUS_FINAL') {
            if (d.live) return 15000;
            // 실측: 상세 호출(events 2,087·lineups 702/일)의 상당분이 아직 시작도 안 한
            // 경기를 매분 다시 받은 것이었다. 라인업은 킥오프 한 시간 전쯤 나오고
            // 그 전엔 아무것도 없으므로, 90분 밖이면 6시간에 한 번이면 충분하다.
            const ko = kickoffById[id];
            const til = ko ? ko - Date.now() : 0;
            return til > 90 * 60 * 1000 ? 6 * 60 * 60 * 1000 : 60000;
          }
          if (!detailIncomplete(d)) return Infinity;   // 명단이 채워졌으면 더 볼 것 없음
          // 비어 있으면 일시적 누락(레이트리밋으로 lineups 콜만 실패 등)일 수 있다.
          // 갓 끝난 경기는 10분, 그 뒤로는 6시간마다 느리게 재시도한다. 경기 목록
          // 자체가 ±7일로 제한돼 있어 영구 포기 규칙은 따로 두지 않는다 —
          // 진짜 명단이 없는 경기라도 비용은 6시간에 1콜뿐이다.
          const ko = kickoffById[id];
          const aged = ko && Date.now() - ko > 24 * 60 * 60 * 1000;
          return aged ? 6 * 60 * 60 * 1000 : 10 * 60 * 1000;
        };
        const needShared = afSorted.filter(m => {
          const c = detailsCacheForSort[m.id];
          return !(c && (Date.now() - c.fetchedAt) < detailTtl(c, m.id));
        });
        if (needShared.length > 0) {
          try {
            const keys = needShared.map(m => `af-detail-${m.id}`);
            const r = await SB.from('sf_cache').select('date,events,updated_at').in('date', keys);
            (r?.data || []).forEach(row => {
              const d = row.events;
              if (!d) return;
              const id = String(row.date).replace('af-detail-', '');
              const empty = (d.lineups || []).length === 0 && (d.events || []).length === 0;
              const age = Date.now() - new Date(row.updated_at).getTime();
              if (age < detailTtl(d, id)) {
                detailsCacheForSort[id] = {
                  lineups: d.lineups || [], events: d.events || [], players: d.players || [],
                  fetchedAt: Date.now() - age, status: d.status, live: d.live, empty,
                };
              }
            });
          } catch (e) { /* 공유 캐시 불가 시 개별 fetch 로 진행 */ }
        }

        const AF_FETCH_LIMIT = 8;
        let afNetBudget = AF_FETCH_LIMIT;
        const afTargets = afSorted.filter(m => {
          const c = detailsCacheForSort[m.id];
          const cacheFresh = c && (Date.now() - c.fetchedAt) < detailTtl(c, m.id);
          if (cacheFresh) return true;              // 캐시 히트는 예산 소모 없음
          if (afNetBudget <= 0) return false;
          afNetBudget--; return true;
        });

        if (afTargets.length > 0) {
          const detailsCache = afDetailsCacheRef.current;
          let afFetchSeq = 0; // network-bound fetches only (cache hits don't wait)
          const afDetails = await Promise.allSettled(
            afTargets.map(async (m) => {
              const needPlayers = m.live || m.status === 'STATUS_FINAL';
              const isFinalMatch = m.status === 'STATUS_FINAL';
              const cached = detailsCache[m.id];
              // TTL 은 detailTtl 한 곳에서 결정한다 — 명단이 채워진 종료 경기만 영구 캐시.
              if (cached) {
                const age = Date.now() - cached.fetchedAt;
                const ttl = detailTtl(cached, m.id);
                if (age < ttl) {
                  return { id: m.id, lineups: cached.lineups, events: cached.events, players: cached.players, isLive: m.live };
                }
              }
              // API-Sports는 순간 동시 버스트에 초당 제한을 건다(실측: 동시 16콜 중 일부
              // 거부, 150ms 분산 시 전부 통과). 경기당 3콜 묶음을 600ms 간격으로 분산해
              // 로드 시점 버스트를 없앤다. 캐시 히트는 위에서 이미 반환돼 대기 없음.
              await new Promise(r => setTimeout(r, (afFetchSeq++) * 600));
              // 라이브 경기는 15초마다 도는데 세 엔드포인트를 매번 부르면
              // 경기 하나가 시간당 400콜을 먹는다(실측 기준 쿼터 소진의 주범).
              // - 라인업: 한 번 채워지면 경기 중 바뀌지 않는다(교체는 events 로
              //   들어온다) → 이미 있으면 재조회하지 않는다.
              // - 평점(players): 분 단위로 바뀌지 않으니 90초로 늦춘다.
              // - events: 골·교체가 실시간이라 그대로 매번 받는다.
              const haveRoster = (cached?.lineups || []).some(t => (t.startXI || []).length);
              const playersAge = Date.now() - (cached?.playersAt || 0);
              const wantPlayers = needPlayers && (!cached?.players?.length || playersAge > 180000);
              // API-Football 은 한도를 넘으면 HTTP 200 에 errors 를 담고 response:[] 를
              // 준다. r.ok 만 보면 정상 빈 데이터와 구분이 안 되고, [] 는 truthy 라
              // '|| cached' 폴백도 타지 않아 직전의 멀쩡한 값을 빈 배열로 덮어썼다.
              // → errors 가 있으면 실패(null)로 돌려 직전 값을 지키고 캐시도 하지 않는다.
              // afFetch: 전 호출을 한 줄로 세워 초당 버스트를 막고, errors 가 있으면
              // null(실패)로 돌려준다 → 직전 값을 지키고 캐시하지 않는다.
              const [lineups, events, players] = await Promise.all([
                haveRoster
                  ? Promise.resolve(undefined)   // 요청 안 함(캐시 사용)
                  : afFetch(`path=fixtures/lineups&fixture=${m.id}`).catch(() => null),
                afFetch(`path=fixtures/events&fixture=${m.id}`).catch(() => null),
                wantPlayers
                  ? afFetch(`path=fixtures/players&fixture=${m.id}`).catch(() => null)
                  : Promise.resolve(undefined),
              ]);
              // null = 요청했는데 실패, undefined = 요청 안 함. 둘 다 직전 값을 이어쓴다.
              const failed = lineups === null || events === null || players === null;
              const detail = {
                lineups: lineups ? lineups.response : (cached?.lineups || []),
                events: events ? events.response : (cached?.events || []),
                players: players ? players.response : (cached?.players || []),
                playersAt: players ? Date.now() : (cached?.playersAt || 0),
                fetchedAt: Date.now(),
                status: m.status,
                live: m.live,
              };
              // Only cache successful (non-empty) responses; failed fetches shouldn't poison.
              // 종료 경기도 '빈 상세'는 영구 캐시하지 않는다 — API-Football 분당 한도에
              // 걸려 빈 응답을 받은 경우 다음 폴링에서 재시도해야 결국 채워진다.
              // (진짜 라인업이 없는 하위 친선경기의 반복 재요청은 3분 TTL로 완화.)
              detail.empty = detail.lineups.length === 0 && detail.events.length === 0;
              // 하나라도 실패한 회차는 캐시하지 않는다 — 다음 폴링에서 다시 받는다.
              // (직전 값으로 화면은 그리되, 그 반쪽을 '완결'로 굳히지 않기 위해)
              if (!failed && (!detail.empty || isFinalMatch)) {
                detailsCache[m.id] = detail;
              }
              if (!failed && !detail.empty) {
                // players 원본은 팀 전체 스탯이라 크다 — 매칭에 쓰는 id·이름·평점만 남긴다.
                const slimPlayers = (detail.players || []).map(team => ({
                  players: (team.players || []).map(e => ({
                    player: { id: e.player?.id, name: e.player?.name },
                    statistics: [{ games: { rating: (e.statistics || [{}])[0]?.games?.rating } }],
                  })),
                }));
                SB.from('sf_cache').upsert({
                  date: `af-detail-${m.id}`,
                  events: { lineups: detail.lineups, events: detail.events, players: slimPlayers, status: m.status, live: m.live },
                  updated_at: new Date().toISOString(),
                }).then(() => {}, () => {});
              }
              return { id: m.id, lineups: detail.lineups, events: detail.events, players: detail.players, isLive: m.live };
            })
          );

          // ── ESPN 라인업 폴백 ──────────────────────────────────────────
          // API-Football 은 라인업을 킥오프 직전에야 낸다(실측: 챔피언십 T-8분,
          // MLS 는 T-22분에도 없음). 같은 MLS 경기를 ESPN 은 T-30분에 냈다.
          // 아직 시작 전이거나 진행 중인데 AF 명단이 비어 있으면 ESPN 으로 채운다.
          // ESPN 은 iPhone UA 를 403 으로 막아 /api/espn 프록시를 거친다.
          const needEspn = afDetails
            .filter(r => r.status === 'fulfilled' && r.value)
            .map(r => r.value)
            .filter(v => {
              const mm = koreanMatches.find(x => x.id === v.id);
              // 종료 경기는 AF 가 결국 채우므로 굳이 두 소스를 쓰지 않는다.
              if (!mm || mm.status === 'STATUS_FINAL') return false;
              return !(v.lineups || []).some(t => (t.startXI || []).length);
            })
            .slice(0, 4);   // 경기당 최대 2콜 — 임박 경기만이라 보통 0~2건
          if (needEspn.length) {
            await Promise.allSettled(needEspn.map(async v => {
              const mm = koreanMatches.find(x => x.id === v.id);
              const lu = await espnLineupsForMatch(mm);
              if (lu) { v.lineups = lu; v.espnLineup = true; }
            }));
          }

          afDetails.forEach(result => {
            if (result.status !== 'fulfilled' || !result.value) return;
            const { id, lineups, events: incidents, players: playerStats, isLive } = result.value;
            const idx = koreanMatches.findIndex(m => m.id === id);
            if (idx === -1) return;

            const m = koreanMatches[idx];
            // Flatten startXI + substitutes from both teams into a single roster list,
            // tagging each with whether they were in the starting XI.
            const linePlayers = [];
            (lineups || []).forEach(team => {
              (team.startXI || []).forEach(e => linePlayers.push({ player: e.player, substitute: false }));
              (team.substitutes || []).forEach(e => linePlayers.push({ player: e.player, substitute: true }));
            });
            const allKoreans = m.koreanPlayers || [m.koreanPlayer];
            const isFinishedMatch = m.status === 'STATUS_FINAL';
            const isUpcoming = !isLive && !isFinishedMatch;
            // API-Football confirms by populating startXI; if startXI is empty
            // it means lineup hasn't been published yet.
            const lineupConfirmed = (lineups || []).some(t => (t.startXI || []).length > 0);

            const computeFor = (kp) => {
              const nameEn = kp.nameEn;
              // AF 선수 ID 정확 매칭 — 로마자 표기 변형('Gue-Sung'/'Gue-sung')이나
              // 축약형('J. Castrop')은 이름 매칭이 놓칠 수 있다. ID 일치 우선, 이름 폴백.
              const afId = ALL_PLAYERS.find(p => p.name === kp.name)?.apiFootballId || null;
              const isKp = (pl) => !!pl && ((afId && pl.id === afId) || nameMatch(pl.name || '', nameEn));
              let started = false, foundInRoster = false, sfRating = null, rosterNumber = null;
              for (const entry of linePlayers) {
                if (isKp(entry.player)) {
                  foundInRoster = true;
                  // 실제 스쿼드 번호를 그대로 쓴다 — 이적 직후처럼 하드코딩 번호가
                  // 아직 틀릴 수 있는 경우를 라인업이 뜨는 즉시 자동 교정.
                  if (entry.player?.number != null) rosterNumber = entry.player.number;
                  if (entry.substitute === false) started = true;
                }
              }
              // Pull rating from /fixtures/players (only fetched for live/finished).
              for (const team of (playerStats || [])) {
                for (const entry of (team.players || [])) {
                  if (isKp(entry.player)) {
                    const r = (entry.statistics || [{}])[0]?.games?.rating;
                    if (r != null) sfRating = parseFloat(r).toFixed(1);
                  }
                }
              }
              let minutesIn = null, minutesOff = null, matchGoals = 0, matchAssists = 0;
              // Only attribute goals/assists/subs when the player is actually in the
              // published squad. Otherwise (e.g. a lower-tier friendly whose lineup is
              // never posted → '확인 불가'), fuzzy name matching against incidents can
              // wrongly credit a teammate's goals to him (the "3골" phantom hat-trick).
              if (foundInRoster) {
                for (const inc of (incidents || [])) {
                  const min = inc.time?.elapsed;
                  if (inc.type === 'subst') {
                    // API-Football: inc.player = the one coming OFF (sub OUT),
                    // inc.assist = the one coming ON (sub IN).
                    if (isKp(inc.player)) minutesOff = min;
                    if (isKp(inc.assist)) minutesIn = min;
                  }
                  if (inc.type === 'Goal' && inc.detail !== 'Missed Penalty') {
                    if (isKp(inc.player)) {
                      if (inc.detail === 'Own Goal') { /* skip — not their goal */ }
                      else matchGoals++;
                    }
                    if (inc.assist?.name && isKp(inc.assist)) matchAssists++;
                  }
                }
              }
              const didPlay = started || minutesIn !== null || matchGoals > 0 || matchAssists > 0;
              let newEvent, minutesPlayed = 0;
              if (isUpcoming) {
                // Lineup announced for upcoming match
                if (lineupConfirmed) {
                  if (started) newEvent = '선발 출전';
                  else if (foundInRoster) newEvent = '벤치 대기';
                  else newEvent = '미출전';
                } else {
                  newEvent = '출전 예상';
                }
              } else if (isLive) {
                // 경기가 이미 시작됐는데 라인업에서 못 찾은 경우 두 가지를 구분한다:
                // - 라인업 자체가 발표됨 + 명단에 없음 → 확정 미출전
                // - 라인업이 아예 없음(발표 안 된 하위 친선경기 등) → 모르는 것이지 미출전이
                //   확정된 게 아니므로 '확인 불가'로 정직하게 표시(히어로에서도 제외됨).
                const lineupAvailable = linePlayers.length > 0;
                const onPitch = (started && minutesOff === null) || (minutesIn !== null && minutesOff === null);
                if (!foundInRoster && lineupAvailable) newEvent = '미출전';
                else if (!foundInRoster) newEvent = '확인 불가';
                else if (onPitch) newEvent = minutesIn !== null ? '교체 출전 중' : '출전 중';
                else if (started && minutesOff !== null) newEvent = '교체 아웃';
                else newEvent = '벤치';
              } else {
                // Finished. Mirror the live logic: no lineup ever posted → '확인 불가'
                // (we can't claim he played OR sat), not a false '미출전'/goal count.
                const lineupAvailable = linePlayers.length > 0;
                if (started) minutesPlayed = minutesOff ?? 90;
                else if (minutesIn !== null) minutesPlayed = (minutesOff ?? 90) - minutesIn;
                newEvent = (!foundInRoster && !lineupAvailable) ? '확인 불가'
                  : !didPlay ? '미출전'
                  : minutesPlayed >= 90 ? '풀타임'
                  : minutesPlayed > 0 ? `${minutesPlayed}분 출전`
                  : '출전 완료';
              }
              return { ...kp, number: rosterNumber ?? kp.number, event: newEvent, minutesPlayed, matchGoals, matchAssists, sfRating, lineupConfirmed };
            };

            const updatedKoreans = allKoreans.map(computeFor);
            const newEvents = [...(m.events || [])];
            updatedKoreans.forEach(kp => {
              for (let i = 0; i < kp.matchGoals; i++) newEvents.push({ type:'goal', player: kp.name });
              for (let i = 0; i < kp.matchAssists; i++) newEvents.push({ type:'assist', player: kp.name });
            });

            koreanMatches[idx] = {
              ...m,
              events: newEvents,
              koreanPlayer: updatedKoreans[0],
              koreanPlayers: updatedKoreans,
            };
          });
        }

        // ── MLB Stats API: fetch gameLog per Korean baseball player ──
        const mlbPlayers = ALL_PLAYERS.filter(p => p.sport === '야구' && p.mlbId);
        const mlbKorean = koreanMatches.filter(m => (m.sport || '').includes('MLB'));
        if (mlbKorean.length > 0 && mlbPlayers.length > 0) {
          const season = new Date().getFullYear();
          const logResults = await Promise.allSettled(
            mlbPlayers.map(p =>
              fetch(`https://statsapi.mlb.com/api/v1/people/${p.mlbId}/stats?stats=gameLog&season=${season}&group=hitting&sportId=1`)
                .then(r => r.ok ? r.json() : null)
                .then(data => ({ playerName: p.name, splits: data?.stats?.[0]?.splits || [] }))
                .catch(() => ({ playerName: p.name, splits: [] }))
            )
          );
          // Build map: 'playerName|YYYY-MM-DD' -> stat
          const statByKey = {};
          logResults.forEach(r => {
            if (r.status !== 'fulfilled') return;
            const { playerName, splits } = r.value;
            for (const s of splits) {
              const date = s.date; // e.g., '2026-05-04'
              if (!date) continue;
              statByKey[`${playerName}|${date}`] = s.stat || {};
            }
          });
          // Game might span midnight UTC vs local; try both date and the day before in case of TZ shift
          const ymd = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
          const gameLogStat = (kp, fullDate) => {
            const d = new Date(fullDate);
            for (const c of [ymd(d), ymd(new Date(d.getTime() - 86400000))]) {
              if (statByKey[`${kp.name}|${c}`]) return statByKey[`${kp.name}|${c}`];
            }
            return null;
          };

          // The season gameLog lags 1-3 days behind, so it can't answer "is he in the
          // lineup right now / did he play in the latest game?". For those we read the
          // ESPN boxscore (live lineup + final stats) directly. Only fetch where the
          // gameLog can't answer, to keep the request count small.
          const needsBox = mlbKorean.filter(m =>
            m.koreanPlayer && (m.live || (m.status === 'STATUS_FINAL' && !gameLogStat(m.koreanPlayer, m.fullDate)))
          );
          const boxResults = await Promise.allSettled(
            needsBox.map(m =>
              fetch(`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event=${m.id}`)
                .then(r => r.ok ? r.json() : null)
                .then(data => ({ id: m.id, players: data?.boxscore?.players || [] }))
                .catch(() => ({ id: m.id, players: [] }))
            )
          );
          const boxById = {};
          boxResults.forEach(r => { if (r.status === 'fulfilled') boxById[r.value.id] = r.value.players; });

          // Locate a Korean batter inside an ESPN boxscore by English name (same matching
          // as the lineup tab: handles "Hyeseong Kim" vs "Kim Hyeseong" ordering).
          const norm = s => (s||'').toLowerCase().replace(/[-\s.']/g,'');
          const findInBox = (players, nameEn) => {
            const variants = [norm(nameEn)];
            const parts = (nameEn||'').toLowerCase().split(/[\s-]+/).filter(Boolean);
            if (parts.length >= 2) {
              variants.push(norm(parts.slice(1).join('') + parts[0]));
              variants.push(norm([parts[parts.length-1], ...parts.slice(0,-1)].join('')));
            }
            const isMatch = n => { const x = norm(n); return x && variants.some(t => t && (x === t || x.includes(t) || t.includes(x))); };
            let lineupPosted = false;
            for (const t of (players || [])) {
              const bat = (t.statistics || []).find(s => s.type === 'batting');
              const aths = bat?.athletes || [];
              if (aths.length) lineupPosted = true;
              const keys = bat?.keys || [];
              const val = (a, k) => { const i = keys.indexOf(k); return i >= 0 ? (parseInt(a.stats?.[i]) || 0) : 0; };
              for (const a of aths) {
                if (isMatch(a.athlete?.displayName || '')) {
                  return {
                    found: true, lineupPosted, starter: !!a.starter,
                    atBats: val(a, 'atBats'), hits: val(a, 'hits'), homeRuns: val(a, 'homeRuns'),
                    rbi: val(a, 'RBIs'), runs: val(a, 'runs'), baseOnBalls: val(a, 'walks'),
                  };
                }
              }
            }
            return { found: false, lineupPosted };
          };

          // Apply to matches
          mlbKorean.forEach(m => {
            const idx = koreanMatches.findIndex(mm => mm.id === m.id);
            if (idx === -1) return;
            const cur = koreanMatches[idx];
            const kp = cur.koreanPlayer;
            if (!kp || !cur.fullDate) return;
            const isFinished = cur.status === 'STATUS_FINAL';
            const isLive = cur.live;
            const gl = gameLogStat(kp, cur.fullDate);
            const box = boxById[cur.id] ? findInBox(boxById[cur.id], kp.nameEn) : null;

            let newEvent, atBats = 0, hits = 0, homeRuns = 0, rbi = 0, runs = 0, stolenBases = 0, baseOnBalls = 0;
            const statLine = () => {
              const parts = [`${atBats}타수 ${hits}안타`];
              if (homeRuns) parts.push(`${homeRuns}홈런`);
              if (rbi) parts.push(`${rbi}타점`);
              if (stolenBases) parts.push(`${stolenBases}도루`);
              return parts.join(' ');
            };

            // 1) 가능한 스탯을 먼저 확보(박스스코어 우선, 없으면 시즌 게임로그).
            //    played = 실제 타석에 섰는지(= 이 경기에 나왔는지) 여부.
            let played = false;
            // ESPN 박스스코어는 경기 초반에 **시즌 누적**을 그대로 실어 보낸다.
            // (실측: 1회초 0-0 경기에서 이정후가 '467타수 136안타 9홈런 48타점')
            // 한 경기 타석은 연장을 감안해도 10을 넘지 않으므로, 그보다 크면
            // 경기 기록이 아니라 시즌 성적으로 보고 버린다. starter/lineupPosted 는
            // 라인업 판별에 계속 쓰므로 box 자체는 그대로 둔다.
            const boxIsThisGame = !!box && box.found &&
              box.atBats <= 10 && box.hits <= 10 && box.runs <= 10 &&
              box.rbi <= 10 && box.homeRuns <= 5 && box.baseOnBalls <= 6;
            if (boxIsThisGame) {
              atBats = box.atBats; hits = box.hits; homeRuns = box.homeRuns;
              rbi = box.rbi; runs = box.runs; baseOnBalls = box.baseOnBalls;
              stolenBases = parseInt(gl?.stolenBases ?? 0) || 0; // SB absent from ESPN batting box
              played = atBats > 0 || baseOnBalls > 0 || runs > 0;
            } else if (gl && !isLive) {
              // 진행 중인 경기엔 게임로그를 쓰지 않는다 — 1~3일 늦게 채워지므로
              // TZ 보정으로 '어제 경기' 기록을 오늘 경기에 붙일 수 있다.
              atBats = parseInt(gl.atBats ?? 0) || 0; hits = parseInt(gl.hits ?? 0) || 0;
              homeRuns = parseInt(gl.homeRuns ?? 0) || 0; rbi = parseInt(gl.rbi ?? 0) || 0;
              runs = parseInt(gl.runs ?? 0) || 0; stolenBases = parseInt(gl.stolenBases ?? 0) || 0;
              baseOnBalls = parseInt(gl.baseOnBalls ?? 0) || 0;
              played = atBats > 0 || baseOnBalls > 0 || runs > 0 || (parseInt(gl.plateAppearances ?? 0) || 0) > 0;
            }

            // 2) 단일 기준으로 이벤트 라벨 결정.
            //    출전함 → n타수 n안타 / 출전 안 함 → 미출전 / 라이브 선발·기록전 → 출전 중.
            if (played) {
              newEvent = statLine();                       // 실제 출전: 라이브·종료 공통으로 스탯 라인
            } else {
              const k = ALL_PLAYERS.find(pl => pl.name === kp.name)?.injury?.kind;
              const rosterOut = k === 'minors' || k === 'il' || k === 'injured'; // 마이너/부상 → 아예 미출전
              if (rosterOut || isFinished) {
                newEvent = '미출전';                        // 명단 제외거나, 경기 종료까지 무출전
              } else if (isLive) {
                newEvent = (box && box.found && box.starter) ? '출전 중' : '벤치'; // 라이브 선발 기록전 or 벤치
              } else {
                newEvent = '출전 예상';                     // 경기 시작 전
              }
            }

            koreanMatches[idx] = {
              ...cur,
              koreanPlayer: { ...kp, event: newEvent, atBats, hits, homeRuns, rbi, runs, stolenBases, baseOnBalls },
              koreanPlayers: (cur.koreanPlayers || [kp]).map(p => p.name === kp.name ? { ...p, event: newEvent, atBats, hits, homeRuns, rbi, runs, stolenBases, baseOnBalls } : p),
            };
          });
        }

        // 보강까지 끝난 완성본을 반영한다. 폴백(기본 목록)이 아직 안 나갔으면
        // 취소해서 '떴다가 다시 갱신되는' 두 번 그리기를 피한다.
        clearTimeout(baseFallbackTimer);
        setLiveMatches(prev => mergeUncovered(prev, [...koreanMatches]));
        setIsInitialLoad(false);
        lastPublishAtRef.current = Date.now();
        // 다음 콜드 스타트에서 즉시 그릴 수 있도록 완성본만 저장한다.
        // quick 회차(어제~내일)는 저장하지 않는다 — 좁은 목록을 캐시에 넣으면
        // 다음 부팅이 반쪽짜리 화면으로 시작한다. 전체 범위 회차가 800ms 뒤에
        // 이어지므로 그때 온전한 목록이 저장된다.
        if (!quick) saveCachedMatches(koreanMatches);

        // Save manual baseline once (first run) so we can rebuild totals each refresh
        // by adding contributions from finished matches in the live cache.
        if (!ALL_PLAYERS[0]._baselineSnapshot) {
          ALL_PLAYERS.forEach(p => {
            p._baselineSnapshot = {
              goals: Number(p.goals) || 0,
              assists: Number(p.assists) || 0,
              matches: Number(p.matches) || 0,
              hits: Number(p.hits) || 0,
              homeRuns: Number(p.homeRuns) || 0,
              rbi: Number(p.rbi) || 0,
              rating: Number(p.rating) || 0,
              avg: p.avg,
            };
          });
        }

        // For each player: take baseline + add per-match deltas from finished matches
        const FINAL_STATUSES = ['STATUS_FINAL','STATUS_FULL_TIME','final','STATUS_END_PERIOD','STATUS_FINAL_PEN'];
        const seenMatchByPlayer = new Map(); // playerIdx -> Set of match IDs already counted
        ALL_PLAYERS.forEach((p, idx) => seenMatchByPlayer.set(idx, new Set()));

        // Reset to baseline first
        ALL_PLAYERS.forEach(p => {
          const b = p._baselineSnapshot;
          if (!b) return;
          p.goals = b.goals;
          p.assists = b.assists;
          p.matches = b.matches;
          p.hits = b.hits;
          p.homeRuns = b.homeRuns;
          p.rbi = b.rbi;
          p.rating = b.rating;
          p.avg = b.avg;
        });

        // Track latest rating/avg per player
        const latestPerPlayer = new Map(); // idx -> { ts, rating, avg }

        koreanMatches.forEach(match => {
          if (!FINAL_STATUSES.includes(match.status)) return;
          const allKp = match.koreanPlayers || [match.koreanPlayer];
          allKp.forEach(kp => {
            if (!kp) return;
            const idx = ALL_PLAYERS.findIndex(p => p.nameEn === kp.nameEn || p.name === kp.name);
            if (idx === -1) return;
            const seen = seenMatchByPlayer.get(idx);
            if (seen.has(match.id)) return;
            seen.add(match.id);
            const player = ALL_PLAYERS[idx];

            // Per-match contributions (additive)
            if (player.sport === '축구') {
              const mg = Number(kp.matchGoals) || 0;
              const ma = Number(kp.matchAssists) || 0;
              if (mg > 0) player.goals += mg;
              if (ma > 0) player.assists += ma;
              // Count appearance if event indicates play
              const ev = kp.event || '';
              const played = (kp.minutesPlayed || 0) > 0
                || ev === '풀타임' || ev === '교체 아웃' || ev.includes('분 출전')
                || mg > 0 || ma > 0;
              if (played) player.matches += 1;
            } else if (player.sport === '야구') {
              const h = Number(kp.hits) || 0;
              const hr = Number(kp.homeRuns) || 0;
              const rbi = Number(kp.rbi) || 0;
              if (h > 0) player.hits += h;
              if (hr > 0) player.homeRuns += hr;
              if (rbi > 0) player.rbi += rbi;
              const didPlay = (kp.atBats || 0) > 0 || h > 0;
              if (didPlay) player.matches += 1;
            }

            // Track latest rating/avg
            const ts = match.fullDate ? new Date(match.fullDate).getTime() : 0;
            const cur = latestPerPlayer.get(idx) || { ts: 0 };
            if (ts >= cur.ts) {
              const upd = { ts };
              if (kp.sfRating != null && kp.sfRating !== '') {
                const r = parseFloat(kp.sfRating);
                if (!Number.isNaN(r)) upd.rating = r;
              }
              if (kp.avg != null && kp.avg !== '') upd.avg = kp.avg;
              latestPerPlayer.set(idx, { ...cur, ...upd });
            }
          });
        });

        // Apply latest rating/avg
        latestPerPlayer.forEach((info, idx) => {
          if (info.rating !== undefined) ALL_PLAYERS[idx].rating = info.rating;
          if (info.avg !== undefined) ALL_PLAYERS[idx].avg = info.avg;
        });

        console.log(`✅ ${new Date().toLocaleTimeString('ko-KR')} | 한국 선수 경기: ${koreanMatches.length}개`);
      } catch (error) {
        console.error('❌ Failed to fetch matches:', error);
      } finally {
        clearTimeout(safetyTimer);
        setApiLoading(false);
        setIsInitialLoad(false);
        lastPublishAtRef.current = Date.now();   // 복귀 시 낡음 판단 기준
      }
  }, []);

  // Fetch each Korean soccer player's 2025-26 season totals from API-Football
  // once at app load. Updates ALL_PLAYERS baseline + per-competition breakdown
  // (club competitions only — friendlies/international matches are excluded).
  React.useEffect(() => {
    let cancelled = false;
    // Map league name → display name + icon for the player stats tab.
    const LEAGUE_DISPLAY = {
      'Major League Soccer': { name: 'MLS', icon: '🇺🇸' },
      'Premier League': { name: '프리미어리그', icon: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
      'Bundesliga': { name: '분데스리가', icon: '🇩🇪' },
      'Ligue 1': { name: '리그앙', icon: '🇫🇷' },
      'Serie A': { name: '세리에A', icon: '🇮🇹' },
      'La Liga': { name: '라리가', icon: '🇪🇸' },
      'Eredivisie': { name: '에레디비시', icon: '🇳🇱' },
      'Primeira Liga': { name: '프리메이라리가', icon: '🇵🇹' },
      'Süper Lig': { name: '쉬페르리그', icon: '🇹🇷' },
      'Championship': { name: '챔피언십', icon: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
      'Premiership': { name: '스코티시 PL', icon: '🏴󠁧󠁢󠁳󠁣󠁴󠁿' },
      'Superliga': { name: '덴마크 SL', icon: '🇩🇰' },
      'Super Liga': { name: '세르비아 SL', icon: '🇷🇸' },
      'Jupiler Pro League': { name: '벨기에 1부', icon: '🇧🇪' },
      'UEFA Champions League': { name: '챔피언스리그', icon: '🏆' },
      'UEFA Europa League': { name: '유로파리그', icon: '🏆' },
      'UEFA Conference League': { name: '컨퍼런스리그', icon: '🏆' },
      'UEFA Super Cup': { name: 'UEFA 슈퍼컵', icon: '🏆' },
      'FA Cup': { name: 'FA컵', icon: '🏆' },
      'EFL Cup': { name: 'EFL컵', icon: '🏆' },
      'League Cup': { name: '리그컵', icon: '🏆' },
      'DFB Pokal': { name: 'DFB-포칼', icon: '🏆' },
      'DFB-Pokal': { name: 'DFB-포칼', icon: '🏆' },
      'Coupe de France': { name: '쿠프 드 프랑스', icon: '🏆' },
      'KNVB Beker': { name: 'KNVB컵', icon: '🏆' },
      'Türkiye Kupası': { name: '터키 컵', icon: '🏆' },
      'FIFA Club World Cup': { name: 'FIFA 클럽 월드컵', icon: '🏆' },
      'FIFA Intercontinental Cup': { name: 'FIFA 인터컨티넨탈컵', icon: '🏆' },
      'CONCACAF Champions League': { name: 'CONCACAF 챔피언스컵', icon: '🏆' },
      'US Open Cup': { name: 'US 오픈컵', icon: '🏆' },
      'Leagues Cup': { name: '리그스컵', icon: '🏆' },
      'Friendlies': { name: '국가대표 친선', icon: '🇰🇷' },
      'Friendlies Clubs': { name: '클럽 친선', icon: '🤝' },
      'World Cup - Qualification Asia': { name: '월드컵 예선 (아시아)', icon: '🌏' },
      'AFC Asian Cup': { name: 'AFC 아시안컵', icon: '🌏' },
      'Nations League': { name: 'UEFA 네이션스리그', icon: '🌍' },
    };
    const labelLeague = (name, country) => {
      if (LEAGUE_DISPLAY[name]) return LEAGUE_DISPLAY[name];
      const isCup = /Cup|Coppa|Coupe|Pokal|Beker|Kupası|Kupa|Trophy/i.test(name);
      return { name: name || '대회', icon: isCup ? '🏆' : '⚽' };
    };
    const soccerPlayers = ALL_PLAYERS.filter(p => p.sport === '축구' && p.apiFootballId);
    (async () => {
      // 마지막으로 성공한 값을 먼저 얹는다. API 가 한 번 실패했다고 화면이
      // 통째로 '스탯을 불러올 수 없습니다'가 되지 않게 한다(실측: 분당 한도를
      // 넘기면 전 선수가 그렇게 됐다).
      const STATS_CACHE_KEY = 'jumo_player_season_stats';
      let cached = {};
      try {
        const raw = JSON.parse(localStorage.getItem(STATS_CACHE_KEY) || '{}');
        if (raw && raw.season === afSeasonFor({})) cached = raw.byId || {};
      } catch {}
      let restored = 0;
      for (const p of soccerPlayers) {
        const c = cached[p.id];
        if (!c) continue;
        p.goals = c.goals; p.assists = c.assists; p.matches = c.matches;
        if (c.rating) p.rating = c.rating;
        p.compStats = c.compStats; p.detailStats = c.detailStats;
        restored++;
      }
      if (restored && !cancelled) setLiveMatches(prev => [...prev]);

      await Promise.all(soccerPlayers.map(async p => {
        try {
          const j = await afFetch(`path=players&id=${p.apiFootballId}&season=${afSeasonFor(p)}`);
          if (!j) return;   // 호출 실패·한도 초과 → 기존 값(캐시)을 유지한다
          // Club competitions only. API-Football uses `team.name` = national team
          // (e.g., 'South Korea') for national team appearances and the club name
          // (e.g., 'Paris Saint Germain') for club competitions including UEFA
          // Champions League, Super Cup, FIFA Intercontinental Cup, domestic
          // cups, etc. So a simple team-name check is the most accurate filter.
          // 응답 자체가 비면(네트워크·레이트리밋 실패) 기존 값을 건드리지 않는다.
          // 아래의 '0으로 초기화'는 응답은 왔는데 클럽 기록이 없는 경우에만 해야 한다.
          if (!j?.response?.[0]) return;
          const stats = j.response[0].statistics || [];
          const NATIONAL_TEAM_NAMES = new Set(['south korea', 'korea republic', 'korea']);
          const clubStats = stats.filter(s => {
            const teamName = (s.team?.name || '').toLowerCase();
            return !NATIONAL_TEAM_NAMES.has(teamName);
          });
          if (clubStats.length === 0) {
            // 시즌이 막 시작해 클럽 경기 기록이 아직 없다(대표팀 경기만 잡히는 경우도
            // 포함). 예전엔 여기서 그냥 반환해 지난 시즌 숫자가 그대로 남아 있었다
            // → 새 시즌 기준으로 0으로 초기화한다. 평점은 UI가 0일 때 숨긴다.
            p.goals = 0; p.assists = 0; p.matches = 0; p.rating = 0;
            p.compStats = []; p.detailStats = null;
            delete p._baselineSnapshot;
            return;
          }
          let g = 0, a = 0, m = 0;
          const ratings = [];
          const compStats = [];
          // 슈팅·키패스 등 상세 지표. 예전엔 PLAYER_EXTRA 에 손으로 적어둔 값을
          // 썼는데 갱신되지 않아 실제와 어긋났다 — 같은 응답에서 합산한다.
          const det = { shots:0, shotsOn:0, keyPasses:0, dribbles:0, duelsWon:0, minutes:0 };
          for (const s of clubStats) {
            const sg = s.goals?.total || 0;
            const sa = s.goals?.assists || 0;
            const sm = s.games?.appearences || 0;
            g += sg; a += sa; m += sm;
            det.shots     += s.shots?.total      || 0;
            det.shotsOn   += s.shots?.on         || 0;
            det.keyPasses += s.passes?.key       || 0;
            det.dribbles  += s.dribbles?.success || 0;
            det.duelsWon  += s.duels?.won        || 0;
            det.minutes   += s.games?.minutes    || 0;
            const r2 = s.games?.rating, w = sm;
            if (r2 && w > 0) ratings.push([parseFloat(r2), w]);
            // Only include competitions where the player actually played
            if (sm > 0 || sg > 0 || sa > 0) {
              const lbl = labelLeague(s.league?.name, s.league?.country);
              compStats.push({ name: lbl.name, icon: lbl.icon, goals: sg, assists: sa, matches: sm });
            }
          }
          const totalW = ratings.reduce((acc, [, w]) => acc + w, 0);
          const avgR = totalW > 0 ? ratings.reduce((acc, [r2, w]) => acc + r2 * w, 0) / totalW : 0;
          if (cancelled) return;
          p.goals = g; p.assists = a; p.matches = m;
          if (avgR > 0) p.rating = parseFloat(avgR.toFixed(2));
          // Sort: leagues first by matches desc, then cups
          p.compStats = compStats.sort((x, y) => y.matches - x.matches);
          p.detailStats = m > 0 ? [
            ['출전 시간',   `${det.minutes}분`],
            ['슈팅',       det.shots],
            ['유효 슈팅',   det.shotsOn],
            ['키패스',      det.keyPasses],
            ['드리블 성공', det.dribbles],
            ['경합 승리',   det.duelsWon],
          ] : null;
          delete p._baselineSnapshot; // force baseline rebuild in next poll
        } catch (e) {
          console.warn(`Season stats fetch failed for ${p.name}:`, e?.message || e);
        }
      }));
      // API-Football 이 못 준 선수(할당량 소진·장애)는 ESPN 으로 메운다.
      // 대회별 내역까지는 못 만들어도, 종합 수치가 있는 게 '스탯을 불러올 수
      // 없습니다'보다 낫다. ESPN 은 키가 필요 없어 한도에 걸리지 않는다.
      const stillMissing = soccerPlayers.filter(p => !p.compStats && p.espnLeague && p.espnId);
      if (stillMissing.length) {
        await Promise.all(stillMissing.map(async p => {
          try {
            const r = await fetch(`${API_BASE}/api/espn-player-stats?league=${p.espnLeague}&id=${p.espnId}&season=${afSeasonFor(p)}`);
            const cats = (await r.json())?.splits?.categories || [];
            if (!cats.length) return;
            const all = cats.flatMap(c => c.stats || []);
            const g = (...ns) => { for (const n of ns) { const st = all.find(x => x.name === n); if (st) return parseFloat(st.value) || 0; } return 0; };
            const mt = g('appearances');
            if (!mt) return;
            p.goals = g('totalGoals'); p.assists = g('goalAssists'); p.matches = mt;
            p.compStats = [{ name: p.league || '리그', icon: '⚽', goals: p.goals, assists: p.assists, matches: mt }];
            p.detailStats = [
              ['출전 시간',   `${g('minutes')}분`],
              ['슈팅',       g('totalShots')],
              ['유효 슈팅',   g('shotsOnTarget')],
              ['키패스',      g('shotAssists')],
              ['태클',       g('totalTackles')],
              ['경고',       g('yellowCards')],
            ];
          } catch (e) {}
        }));
        if (!cancelled) setLiveMatches(prev => [...prev]);
      }

      try {
        const byId = {};
        for (const p of soccerPlayers) {
          if (!p.compStats) continue;   // 이번에도 못 받았으면 이전 캐시를 남겨둔다
          byId[p.id] = { goals: p.goals, assists: p.assists, matches: p.matches,
                         rating: p.rating, compStats: p.compStats, detailStats: p.detailStats };
        }
        const merged = { ...cached, ...byId };
        localStorage.setItem(STATS_CACHE_KEY, JSON.stringify({ season: afSeasonFor({}), byId: merged }));
      } catch {}
      if (!cancelled) setLiveMatches(prev => [...prev]); // trigger re-render
    })();
    return () => { cancelled = true; };
  }, []);

  // ── Daily player availability sync (IL / minors / injury) ──────────────
  // Hardcoded injury fields go stale (trades, IL stints, demotions). Once a day
  // we refresh every player's real status: MLB from statsapi (current team +
  // 40-man roster status code), soccer from API-Football injuries via the proxy.
  // Result is cached in localStorage for 24h and written onto ALL_PLAYERS so the
  // status badges and live "not in lineup" labels stay accurate.
  React.useEffect(() => {
    let cancelled = false;
    const KEY = 'jumoPlayerStatus_v2'; // bumped: ESPN-based soccer status source
    const DAY = 24 * 60 * 60 * 1000;
    // Apply a name→status map onto ALL_PLAYERS. A present key with null clears any
    // (now stale) injury; an absent key leaves the existing value untouched.
    const apply = (map) => {
      if (!map) return;
      ALL_PLAYERS.forEach(p => {
        if (Object.prototype.hasOwnProperty.call(map, p.name)) p.injury = map[p.name] || null;
      });
    };
    const REASON_KO = {
      'knee injury':'무릎 부상', 'ankle injury':'발목 부상', 'hamstring':'햄스트링 부상',
      'muscle injury':'근육 부상', 'thigh injury':'허벅지 부상', 'calf injury':'종아리 부상',
      'groin injury':'사타구니 부상', 'back injury':'허리 부상', 'shoulder injury':'어깨 부상',
      'foot injury':'발 부상', 'illness':'질병', 'knock':'타박상', 'fitness':'컨디션 난조',
      'suspended':'출전 정지', 'red card':'퇴장 누적', 'coach decision':'감독 결정',
    };
    const koReason = (reason) => REASON_KO[(reason || '').toLowerCase().trim()] || reason || '부상';

    (async () => {
      // Serve from cache when fresh enough.
      try {
        const cached = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (cached && cached.ts && (Date.now() - cached.ts) < DAY && cached.map) {
          apply(cached.map);
          if (!cancelled) setLiveMatches(prev => [...prev]);
          return;
        }
      } catch {}

      const map = {};

      // ── MLB: statsapi roster status ──
      try {
        const mlb = ALL_PLAYERS.filter(p => p.sport === '야구' && p.mlbId);
        if (mlb.length) {
          const ids = mlb.map(p => p.mlbId).join(',');
          const [pplRes, teamsRes] = await Promise.all([
            fetch(`https://statsapi.mlb.com/api/v1/people?personIds=${ids}&hydrate=currentTeam`).then(r => r.json()),
            fetch('https://statsapi.mlb.com/api/v1/teams?sportId=1').then(r => r.json()),
          ]);
          const mlbTeamIds = new Set((teamsRes.teams || []).map(t => t.id));
          const personById = {};
          (pplRes.people || []).forEach(p => { personById[p.id] = p; });
          // Fetch each relevant MLB club's 40-man roster once (status codes live there).
          const needTeams = new Set();
          mlb.forEach(p => { const ct = personById[p.mlbId]?.currentTeam; if (ct && mlbTeamIds.has(ct.id)) needTeams.add(ct.id); });
          const rosterByTeam = {};
          await Promise.all([...needTeams].map(tid =>
            fetch(`https://statsapi.mlb.com/api/v1/teams/${tid}/roster?rosterType=40Man`)
              .then(r => r.ok ? r.json() : null)
              .then(d => { rosterByTeam[tid] = d?.roster || []; })
              .catch(() => { rosterByTeam[tid] = []; })
          ));
          mlb.forEach(p => {
            const ct = personById[p.mlbId]?.currentTeam;
            if (!ct) return; // unknown → leave existing value
            if (!mlbTeamIds.has(ct.id)) { map[p.name] = { label:'마이너', severity:'medium', kind:'minors', note: ct.name }; return; }
            const entry = (rosterByTeam[ct.id] || []).find(r => r.person?.id === p.mlbId);
            const code = entry?.status?.code || 'A';
            const desc = entry?.status?.description || '';
            if (/^D\d/.test(code) || code === 'DL') map[p.name] = { label:'부상자 명단 (IL)', severity:'high', kind:'il', note: desc };
            else if (code === 'RM' || code === 'OPT' || code === 'DES' || code === 'OUT') map[p.name] = { label:'마이너', severity:'medium', kind:'minors', note: desc };
            else map[p.name] = null; // active → clear any stale injury
          });
        }
      } catch (e) { console.warn('MLB status sync failed:', e?.message || e); }

      // ── Soccer: ESPN athlete status (CORS-open, no proxy/key) ──
      // Primary, reliable source — clears stale injuries for active players and
      // flags ones ESPN reports as injured. Runs before API-Football so that when
      // the proxy is unavailable, ESPN's verdict still stands.
      try {
        const soccerEspn = ALL_PLAYERS.filter(p => p.sport === '축구' && p.espnId && p.espnLeague);
        await Promise.all(soccerEspn.map(async p => {
          try {
            const r = await fetch(`https://site.web.api.espn.com/apis/common/v3/sports/soccer/${p.espnLeague}/athletes/${p.espnId}`);
            if (!r.ok) return; // keep existing
            const a = (await r.json())?.athlete;
            if (!a) return;
            const inj = Array.isArray(a.injuries) ? a.injuries : [];
            if (inj.length > 0) {
              const it = inj[0] || {};
              const detail = it?.type?.description || it?.details?.type || it?.status || it?.shortComment || '부상';
              const susp = /suspen|red card/i.test(JSON.stringify(it));
              map[p.name] = { label: koReason(detail), severity: susp ? 'medium' : 'high', kind: susp ? 'suspended' : 'injured', note: detail };
            } else {
              map[p.name] = null; // ESPN reports active / no injuries → available
            }
          } catch {}
        }));
      } catch (e) { console.warn('Soccer ESPN status sync failed:', e?.message || e); }

      // ── Soccer: API-Football injuries via proxy (enriches when available) ──
      try {
        const soccer = ALL_PLAYERS.filter(p => p.sport === '축구' && p.apiFootballId);
        await Promise.all(soccer.map(async (p, i) => {
          // 간격은 afFetch 큐가 보장한다(개별 스태거는 합산 시 한도를 넘겼다).
          try {
            const j = await afFetch(`path=injuries&player=${p.apiFootballId}&season=${afSeasonFor(p)}`);
            if (!j) return; // 호출 실패·한도 초과 → 기존 값 유지
            const rows = j.response || [];
            if (!rows.length) { map[p.name] = null; return; } // no injuries this season → available
            rows.sort((a, b) => new Date(b.fixture?.date || 0) - new Date(a.fixture?.date || 0));
            const latest = rows[0];
            const dt = new Date(latest.fixture?.date || 0).getTime();
            // Only treat as currently unavailable if the latest entry is recent (~12 days).
            if (dt && (Date.now() - dt) < 12 * DAY) {
              const reason = latest.player?.reason || '';
              const low = reason.toLowerCase();
              const kind = (low.includes('suspend') || low.includes('red card')) ? 'suspended'
                : (latest.player?.type || '').toLowerCase().includes('quest') ? 'doubtful' : 'injured';
              map[p.name] = { label: koReason(reason), severity: kind === 'injured' ? 'high' : 'medium', kind, note: reason };
            } else {
              map[p.name] = null; // recovered
            }
          } catch {}
        }));
      } catch (e) { console.warn('Soccer injury sync failed:', e?.message || e); }

      if (cancelled) return;
      apply(map);
      try { localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), map })); } catch {}
      setLiveMatches(prev => [...prev]);
    })();
    return () => { cancelled = true; };
  }, []);


  // Adaptive polling: 20s near kickoff (so confirmed lineups land within seconds),
  // 60s otherwise. Recomputed each tick by reading the latest liveMatches via ref.
  const liveMatchesRef = React.useRef(liveMatches);
  React.useEffect(() => { liveMatchesRef.current = liveMatches; }, [liveMatches]);

  React.useEffect(() => {
    let cancelled = false;
    let timeoutId;
    const computeNextDelay = () => {
      const hasImminent = (liveMatchesRef.current || []).some(m => {
        if (m.live || m.time === 'LIVE') return true;
        if (!m.fullDate) return false;
        const til = new Date(m.fullDate).getTime() - Date.now();
        return til > -10 * 60 * 1000 && til <= 90 * 60 * 1000;
      });
      // 0~5초 지터: 기기들이 같은 초에 틱을 쏘면 키 전체의 초당 한도(5회)를 넘긴다.
      return (hasImminent ? 20000 : 60000) + Math.random() * 5000;
    };
    let firstRun = true;
    // 네트워크가 끝내 응답하지 않아도 루프가 멈추지 않도록 상한을 둔다.
    // 예전엔 fetchLiveMatches 가 한 번 걸리면 '최신 정보 불러오는 중' 바가
    // 영영 남고 다음 폴링도 예약되지 않아 앱이 갱신을 멈췄다(제보).
    const POLL_TIMEOUT_MS = 20000;
    const withTimeout = (pr) => Promise.race([
      pr, new Promise((res) => setTimeout(res, POLL_TIMEOUT_MS)),
    ]);
    const tick = async () => {
      if (cancelled || pollInFlightRef.current) return;
      pollInFlightRef.current = true;
      const announce = announceRef.current;
      announceRef.current = false;
      if (announce) setRefreshing(true);
      try {
        await withTimeout(fetchLiveMatches(firstRun));   // 첫 실행만 quick(어제~내일)
      } catch (e) {
        console.warn('폴링 실패:', e?.message || e);
      } finally {
        pollInFlightRef.current = false;
        // cancelled 여부와 무관하게 내린다 — 정리 중이라고 건너뛰면 바가 남는다.
        if (announce) setRefreshing(false);
      }
      if (cancelled) return;
      const wasFirst = firstRun;
      firstRun = false;
      // quick으로 첫 화면을 띄운 직후, 전체 범위(±7일)를 곧바로 한 번 더 받는다.
      timeoutId = setTimeout(tick, wasFirst ? 800 : computeNextDelay());
    };
    tick();

    // 앱이 다시 활성화되면 즉시 갱신한다.
    // iOS는 앱을 메모리에 유지하므로 '앱을 다시 실행'해도 실제로는 이전 WebView가
    // 복원된다 → 스켈레톤 없이 옛 화면이 그대로 보이고(캐싱처럼 느껴지는 이유),
    // 백그라운드에선 폴링 타이머도 지연돼 한동안 낡은 정보가 남아 있었다.
    const STALE_MS = 60 * 1000;
    const onVisible = () => {
      if (cancelled || document.visibilityState !== 'visible') return;
      clearTimeout(timeoutId);   // 예약된 폴링과 중복 실행 방지
      // 오래 백그라운드에 있었다면 낡은 정보를 말없이 두지 않는다. 다만 이미
      // 보여줄 내용이 있으면 스켈레톤으로 되돌리지 않고(내용이 사라지는 게 더
      // 나쁘다) 상단 갱신 바로 '지금 새로 받는 중'임을 알린다.
      // (잠깐 앱을 전환한 정도면 조용히 갱신한다.)
      if (Date.now() - lastPublishAtRef.current > STALE_MS) {
        announceRef.current = true;
        if (!(liveMatchesRef.current || []).length) setIsInitialLoad(true);
      }
      tick();
    };
    document.addEventListener('visibilitychange', onVisible);

    return () => {
      cancelled = true;
      clearTimeout(timeoutId);
      document.removeEventListener('visibilitychange', onVisible);
    };
  }, [fetchLiveMatches]);

  // Generate notifications from match data
  React.useEffect(() => {

            newNotifs.push({

            newNotifs.push({

    // Sort by timestamp (most recent first) and remove duplicates
    const uniqueNotifs = Array.from(new Map(newNotifs.map(n => [n.id, n])).values())
      .sort((a, b) => b.timestamp - a.timestamp)
      .slice(0, 50); // Keep last 50 notifications

    setNotifications(uniqueNotifs);

  // ── API-Football fixture transformer ─────────────────────────────────
  // Maps a fixture object from api-sports.io to our standard match shape.
  const transformApiFootballFixture = (fx) => {
    if (!fx?.fixture || !fx?.teams) return null;
    const tourneyName = (fx.league?.name || '').toLowerCase();
    const homeTeamRaw = (fx.teams.home?.name || '').toLowerCase();
    const awayTeamRaw = (fx.teams.away?.name || '').toLowerCase();
    const WOMEN_MARKERS = ['women', ' w ', '(w)', 'frauen', 'féminin', 'femenin', 'dames', 'ladies'];
    if (WOMEN_MARKERS.some(k => tourneyName.includes(k) || homeTeamRaw.includes(k) || awayTeamRaw.includes(k))) return null;
    // Skip youth / reserve / II teams
    const YOUTH_MARKERS = [' u17', ' u18', ' u19', ' u20', ' u21', ' u23', 'youth', 'reserve', ' ii ', ' ii$'];
    const homeAwayCombined = `${homeTeamRaw} ${awayTeamRaw}`;
    if (YOUTH_MARKERS.some(k => new RegExp(k).test(homeAwayCombined))) return null;

    const homeTeamName = fx.teams.home?.name || '';
    const awayTeamName = fx.teams.away?.name || '';
    const homeShort = homeTeamName.replace(/[^A-Za-z0-9]/g,'').slice(0, 3).toUpperCase() || homeTeamName.slice(0,3).toUpperCase();
    const awayShort = awayTeamName.replace(/[^A-Za-z0-9]/g,'').slice(0, 3).toUpperCase() || awayTeamName.slice(0,3).toUpperCase();

    // Match against KOREAN_PLAYERS map. Use ONLY the full team name to avoid
    // false positives like Wolfsberg→WOL→황희찬 from the 3-letter slice.
    const homeHasKo = !!(KOREAN_PLAYERS[homeTeamName] || KOREAN_PLAYERS_EXTRA[homeTeamName]);
    const awayHasKo = !!(KOREAN_PLAYERS[awayTeamName] || KOREAN_PLAYERS_EXTRA[awayTeamName]);
    if (!homeHasKo && !awayHasKo) return null;

    // Use player's canonical team abbrev from ALL_PLAYERS for both card display
    // and home.code/away.code comparisons (which key off Korean player's team).
    const codeFor = (teamName, fallback) => {
      const first = KOREAN_PLAYERS[teamName] || (KOREAN_PLAYERS_EXTRA[teamName] || [])[0];
      const info = first && ALL_PLAYERS.find(p => p.name === first.name);
      return info?.team || fallback;
    };
    const homeCode = homeHasKo ? codeFor(homeTeamName, homeShort) : homeShort;
    const awayCode = awayHasKo ? codeFor(awayTeamName, awayShort) : awayShort;
    // 같은 팀에 한국 선수가 둘 이상일 수 있다(미트윌란: 조규성+이한범).
    const homeKoreans = koreansForTeam(homeTeamName, homeCode, '축구');
    const awayKoreans = koreansForTeam(awayTeamName, awayCode, '축구');
    const koreanPlayers = [...homeKoreans, ...awayKoreans];
    const koreanPlayer = koreanPlayers[0];
    const isKoreanDerby = homeKoreans.length > 0 && awayKoreans.length > 0;

    // API-Football status codes
    const sShort = fx.fixture.status?.short || 'NS';
    const LIVE_CODES = new Set(['1H','HT','2H','ET','BT','P','INT','LIVE']);
    const FINAL_CODES = new Set(['FT','AET','PEN']);
    const isLive = LIVE_CODES.has(sShort);
    const isFinished = FINAL_CODES.has(sShort);

    const matchDate = new Date(fx.fixture.date);
    const isTimedOut = isLive && (Date.now() - matchDate.getTime()) > 160 * 60 * 1000;
    const liveAfterTimeout = isLive && !isTimedOut;
    const status = liveAfterTimeout ? 'STATUS_IN_PROGRESS' : (isFinished || isTimedOut) ? 'STATUS_FINAL' : 'notstarted';

    const elapsed = fx.fixture.status?.elapsed;
    let minute = '';
    if (liveAfterTimeout && elapsed != null) minute = String(elapsed);
    const periodStartTs = null; // not provided by API-football; we'll just show elapsed

    let timeDisplay = '';
    if (liveAfterTimeout) timeDisplay = 'LIVE';
    else if (!isFinished && !isTimedOut) timeDisplay = formatHHMM(matchDate);

    const tournamentName = fx.league?.name || '';
    const TOURNEY_ABBR = {
      'Premier League':'EPL','Bundesliga':'GER','Ligue 1':'L1','Serie A':'ITA',
      'Premiership':'SPL','Süper Lig':'TUR','Eredivisie':'NED','Primeira Liga':'POR',
      'Jupiler Pro League':'BEL','Major League Soccer':'MLS','Superliga':'DEN','La Liga':'ESP',
      'Championship':'CHA','Serbian SuperLiga':'SRB','UEFA Champions League':'UCL',
      'UEFA Europa League':'UEL','UEFA Conference League':'UECL',
    };
    const leagueAbbr = TOURNEY_ABBR[tournamentName] || tournamentName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,4);

    return {
      id: String(fx.fixture.id),
      source: 'apifootball',
      live: liveAfterTimeout,
      minute,
      sport: `⚽ ${leagueAbbr}`,
      leagueKey: '',
      // id/leagueId/leagueSeason 은 팀 상세 화면(TeamScreen)이 쓴다. API-Football
      // 경기에만 있고 야구(statsapi)·ESPN 경기에는 없다 — 없으면 팀 상세로 들어갈 수
      // 없게 막는 게 의도된 동작이다.
      home: { name: homeTeamName, code: homeCode, score: (liveAfterTimeout || isFinished || isTimedOut) ? (fx.goals?.home ?? 0) : null, logo: fx.teams.home?.logo || null, id: fx.teams.home?.id || null },
      away: { name: awayTeamName, code: awayCode, score: (liveAfterTimeout || isFinished || isTimedOut) ? (fx.goals?.away ?? 0) : null, logo: fx.teams.away?.logo || null, id: fx.teams.away?.id || null },
      leagueId: fx.league?.id || null,
      leagueSeason: fx.league?.season || null,
      koreanPlayer: { ...koreanPlayer, event: (isFinished || isTimedOut) ? '미출전' : '출전 예상', minutesPlayed: 0, matchGoals: 0, matchAssists: 0 },
      koreanPlayers: koreanPlayers.map(kp => ({ ...kp, event: (isFinished || isTimedOut) ? '미출전' : '출전 예상', minutesPlayed: 0, matchGoals: 0, matchAssists: 0 })),
      isKoreanDerby,
      competition: tournamentName,
      competitionLogo: fx.league?.logo || null,
      venue: fx.fixture.venue?.city || '',
      time: timeDisplay,
      fullDate: matchDate.toISOString(),
      krTime: formatKRTime(matchDate.toISOString()),
      lineupConfirmed: liveAfterTimeout || isFinished,
      events: [],
      stats: null,
      status,
      isTimedOut,
      periodStartTs,
      sfPeriod: 1,
    };
  };

  const transformESPNEvent = (event, sport, league = '') => {
    const comp = event.competitions[0];
    const home = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors[0];
    const away = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors[1];
    const status = event.status.type.name;
    // If match started long ago, ESPN API may lag — treat as not live.
    // 야구는 평균 3시간·연장 시 4~5시간이라 축구(160분) 기준을 쓰면 정상 진행 중인
    // 경기가 라이브에서 탈락한다 → MLB는 330분으로 넉넉히.
    const matchStartMs = event.date ? new Date(event.date).getTime() : 0;
    const timeoutMin = sport === 'mlb' ? 330 : 160;
    const isTimedOut = matchStartMs > 0 && (Date.now() - matchStartMs) > timeoutMin * 60 * 1000;
    // Check multiple live status codes
    const isLive = !isTimedOut && (
                   status === 'STATUS_IN_PROGRESS' ||
                   status === 'STATUS_FIRST_HALF' ||
                   status === 'STATUS_SECOND_HALF' ||
                   status === 'STATUS_HALFTIME' ||
                   status === 'STATUS_EXTRA_TIME' ||
                   status === 'STATUS_OVERTIME');

    // Check for Korean players
    let koreanPlayer = null;
    let lineupConfirmed = false;
    let events = [];
    const homeTeam = home.team.displayName;
    const awayTeam = away.team.displayName;
    const homeAbbr = home.team.abbreviation;
    const awayAbbr = away.team.abbreviation;

    // Try multiple variations to match Korean players
    const homeVariations = [homeTeam, homeAbbr, home.team.name, home.team.shortDisplayName].filter(Boolean);
    const awayVariations = [awayTeam, awayAbbr, away.team.name, away.team.shortDisplayName].filter(Boolean);


    // 같은 팀에 한국 선수가 둘 이상일 수 있고(미트윌란: 조규성+이한범), 코리안 더비면
    // 양 팀에 나눠 있다. 홈에서 찾았다고 멈추지 말고 양쪽 다 모은다.
    let espnHomeKoreans = [];
    for (const variation of homeVariations) {
      const found = koreansForTeam(variation, homeAbbr, sport === 'mlb' ? '야구' : '축구');
      if (found.length) { espnHomeKoreans = found; break; }
    }
    let espnAwayKoreans = [];
    for (const variation of awayVariations) {
      const found = koreansForTeam(variation, awayAbbr, sport === 'mlb' ? '야구' : '축구');
      if (found.length) { espnAwayKoreans = found; break; }
    }
    const espnKoreans = [...espnHomeKoreans, ...espnAwayKoreans];
    const espnIsDerby = espnHomeKoreans.length > 0 && espnAwayKoreans.length > 0;
    koreanPlayer = espnKoreans[0] || null;

    // Check lineup confirmation only 1 hour before match start
    const matchDate = new Date(event.date);
    const now = new Date();
    const oneHourBeforeMatch = new Date(matchDate.getTime() - 60 * 60 * 1000);

    // Only check lineup if within 1 hour of match start or match has started
    if (now >= oneHourBeforeMatch || isLive) {
      if (comp.situation?.lastPlay || comp.details || home.linescores) {
        lineupConfirmed = true;
      }
    }

    // Extract events (goals, cards, etc.) from the match
    if (comp.details) {
      const details = comp.details;
      if (details.redCards) {
        details.redCards.forEach(card => {
          events.push({ type: 'red', player: card.athlete?.displayName, min: card.clock?.displayValue, team: card.team?.abbreviation });
        });
      }
      if (details.yellowCards) {
        details.yellowCards.forEach(card => {
          events.push({ type: 'yellow', player: card.athlete?.displayName, min: card.clock?.displayValue, team: card.team?.abbreviation });
        });
      }
    }

    // Check for Korean player in match events (goals, assists)
    if (koreanPlayer && comp.situation?.lastPlay) {
      const lastPlay = comp.situation.lastPlay;
      if (lastPlay.text && lastPlay.text.includes(koreanPlayer.name)) {
        if (lastPlay.scoringPlay) {
          events.push({ type: 'goal', player: koreanPlayer.name, min: lastPlay.clock?.displayValue, team: koreanPlayer.team });
        }
      }
    }

    let timeDisplay = '';
    if (!isLive && event.date) {
      timeDisplay = formatHHMM(event.date);
    } else if (isLive) {
      timeDisplay = 'LIVE';
    }

    // Determine Korean player event status and extract stats
    let playerEventText = '출전 예상';
    let playerStats = { goals: undefined, assists: undefined, rating: undefined, minutesPlayed: undefined };

    if (koreanPlayer) {
      // Try to find Korean player in rosters/statistics
      const homeRoster = home.athletes || home.roster || [];
      const awayRoster = away.athletes || away.roster || [];
      const allAthletes = [...homeRoster, ...awayRoster];

      const koreanAthlete = allAthletes.find(athlete => {
        const name = (athlete.athlete?.displayName || athlete.displayName || '').toLowerCase().replace(/[-\s]/g, '');
        const nameEn = (koreanPlayer.nameEn || '').toLowerCase().replace(/[-\s]/g, '');
        const lastName = (koreanPlayer.nameEn || '').split(' ').pop().toLowerCase();
        return nameEn && (name.includes(nameEn) || nameEn.includes(name) || name.includes(lastName));
      });

      let didPlay = false;

      if (koreanAthlete) {
        const athleteStats = koreanAthlete.statistics || koreanAthlete.stats || [];

        // For soccer: Extract season stats from athlete.statistics
        if (sport === 'soccer') {
          const goals = athleteStats.find(s =>
            s.name === 'goals' ||
            s.abbreviation === 'G' ||
            s.displayName === 'Goals'
          );
          if (goals) playerStats.goals = parseInt(goals.displayValue || goals.value) || 0;

          const assists = athleteStats.find(s =>
            s.name === 'assists' ||
            s.abbreviation === 'A' ||
            s.displayName === 'Assists'
          );
          if (assists) playerStats.assists = parseInt(assists.displayValue || assists.value) || 0;

          const rating = athleteStats.find(s =>
            s.name === 'rating' ||
            s.name === 'playerRating' ||
            s.displayName === 'Rating'
          );
          if (rating) playerStats.rating = parseFloat(rating.displayValue || rating.value).toFixed(1);

          const minutes = athleteStats.find(s =>
            s.name === 'minutesPlayed' ||
            s.abbreviation === 'MIN' ||
            s.displayName === 'Minutes Played'
          );
          if (minutes) {
            playerStats.minutesPlayed = parseInt(minutes.displayValue || minutes.value) || 0;
            didPlay = playerStats.minutesPlayed > 0;
          }
        }

        // For MLB: Extract batting stats — presence of at-bat stats means player batted
        if (sport === 'mlb') {
          const atBats = athleteStats.find(s => s.abbreviation === 'AB' || s.name === 'atBats');
          const hits = athleteStats.find(s => s.abbreviation === 'H' || s.name === 'hits');
          if (hits !== undefined) {
            playerStats.hits = parseInt(hits?.displayValue || hits?.value) || 0;
            didPlay = true;
          }
          if (atBats !== undefined) didPlay = true;

          const avg = athleteStats.find(s => s.abbreviation === 'AVG' || s.name === 'avg');
          if (avg) playerStats.avg = parseFloat(avg.displayValue || avg.value).toFixed(3);

          const hr = athleteStats.find(s => s.abbreviation === 'HR' || s.name === 'homeRuns');
          if (hr) playerStats.homeRuns = parseInt(hr.displayValue || hr.value) || 0;

          const rbi = athleteStats.find(s => s.abbreviation === 'RBI' || s.name === 'RBIs');
          if (rbi) playerStats.rbi = parseInt(rbi.displayValue || rbi.value) || 0;
        }
      }

      const isFinished = isTimedOut || status === 'STATUS_FINAL' || status === 'STATUS_FULL_TIME' || status === 'STATUS_END_PERIOD' || status === 'STATUS_FINAL_PEN';
      if (isLive) {
        const isStarter = koreanAthlete?.starter === true;
        const hasMinutes = playerStats.minutesPlayed && playerStats.minutesPlayed > 0;
        if (isStarter || hasMinutes || didPlay) {
          playerEventText = '출전 중';
        } else if (koreanAthlete) {
          playerEventText = '벤치';
        } else {
          playerEventText = '출전 예상';
        }
      } else if (isFinished) {
        if (!koreanAthlete || !didPlay) {
          playerEventText = '미출전';
        } else if (playerStats.minutesPlayed > 0) {
          playerEventText = `${playerStats.minutesPlayed}분 출전`;
        } else {
          playerEventText = '출전 완료';
        }
        // 이벤트(골/도움)가 있으면 실제 출전 — '미출전' 덮어쓰기
        if (koreanPlayer) {
          const hasEvent = events.some(e => e.player === koreanPlayer.name);

          }

        else if (/^Mid/i.test(shortDetail)) half = '중간';
        else if (/^End/i.test(shortDetail)) half = '종료';

      }

    const homeLogo = home.team?.logo || home.team?.logos?.[0]?.href || null;
    const awayLogo = away.team?.logo || away.team?.logos?.[0]?.href || null;

    return {
      id: event.id,
      live: isLive,
      minute,
      inning,
      sport: sport === 'mlb' ? '⚾ MLB' : `⚽ ${league.toUpperCase()}`,
      leagueKey: league,
      home: { name: homeTeam, code: home.team.abbreviation, score: parseInt(home.score) || 0, logo: homeLogo },
      away: { name: awayTeam, code: away.team.abbreviation, score: parseInt(away.score) || 0, logo: awayLogo },

  // (경기 파생 알림은 본문에 정확한 팀명이 들어가 정확히 매칭, 푸시 알림은 최선 매칭.)
  const matchForNotif = React.useCallback((notif) => {
    if (!notif) return null;
    const pool = liveMatches;
    if (!pool.length) return null;
    const text = `${notif.title || ''} ${notif.body || ''}`;
    const norm = (s) => (s || '').toLowerCase().replace(/[\s.]/g, '');
    const nt = norm(text);
    const scored = pool.map((m) => {
      let score = 0;
      const hn = norm(m.home && m.home.name), an = norm(m.away && m.away.name);
      if (hn && nt.includes(hn)) score += 2;
      if (an && nt.includes(an)) score += 2;

      if (kps.some((kp) => kp.name && text.includes(kp.name))) score += 1;

    return Array.from(m.values()).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 60)

  const resolvePushMatch = React.useCallback((notif) => {

    // 애니메이션은 붙이지 않는다 — 주 동선은 엣지 제스처이고, 버튼 뒤로가기는
    // 즉시 닫혀도 어색하지 않다.
