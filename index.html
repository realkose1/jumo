            <div style={{ fontSize:10, color:'var(--text4)', marginTop:3, fontWeight:600, letterSpacing:0.3 }}>{label}</div>
          </div>
        ))}
      </div>

      {/* Tabs (liquid glass segmented) */}
      <GlassSegmented sticky active={tab} onChange={setTab}
        tabs={[{id:'overview',label:'요약'},{id:'stats',label:'스탯'},{id:'info',label:'정보'}]}/>

      {/* Overview tab */}
      {tab === 'overview' && (
        <div style={{ padding:'16px' }}>
          {(player.sport === '축구' || player.sport === '야구' || player.sport === '배드민턴') && (
            <>
              {player.sport === '야구' && recentLiveMatches.length > 0 && (() => {
                // Baseline games (most recent N), oldest → newest for left→right reading
                const games = recentLiveMatches.slice(0, 7).slice().reverse();
                const parsed = games.map(m => {
                  const c = m.contrib || '';
                  const ab = (c.match(/(\d+)타수/) || [])[1];
                  const h = (c.match(/(\d+)안타/) || [])[1];
                  const hr = (c.match(/(\d+)HR/) || [])[1];
                  return {
                    opp: m.opp,
                    date: m.date,
                    ab: ab ? parseInt(ab) : 0,
                    h: h ? parseInt(h) : 0,
                    hr: hr ? parseInt(hr) : 0,
                    result: m.result,
                  };
                });
                const totalAB = parsed.reduce((s,g) => s + g.ab, 0);
                const totalH = parsed.reduce((s,g) => s + g.h, 0);
                const recentAvg = totalAB > 0 ? (totalH / totalAB) : 0;
                const fmtAvg = '.' + (Math.round(recentAvg * 1000) || 0).toString().padStart(3,'0');
                const colorFor = (g) => {
                  if (!g.ab) return { bg:'var(--border)', fg:'var(--text4)' }; // DNP
                  if (g.hr > 0) return { bg:'rgba(245,196,0,0.25)', fg:'var(--acc)' };
                  if (g.h >= 2) return { bg:'rgba(44,201,109,0.18)', fg:'#2cc96d' };
                  if (g.h >= 1) return { bg:'rgba(255,255,255,0.08)', fg:'var(--text)' };
                  return { bg:'rgba(230,48,48,0.10)', fg:'rgba(255,107,107,0.85)' };
                };
                return (
                  <div style={{ background:'var(--surface)', borderRadius:16, padding:'16px', border:'0.5px solid var(--border)', marginBottom:12 }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:14 }}>
                      <div>
                        <div style={{ fontSize:13, fontWeight:700, color:'var(--text)', marginBottom:2 }}>최근 {parsed.length}경기 타격 폼</div>
                        <div style={{ fontSize:11, color:'var(--text4)' }}>{totalH}안타 / {totalAB}타수</div>
                      </div>
                      <div style={{ textAlign:'right' }}>
                        <div style={{ ...NUM, fontSize:26, fontWeight:800, color:'var(--acc)', lineHeight:1 }}>{fmtAvg}</div>
                        <div style={{ fontSize:10, color:'var(--text4)', marginTop:3 }}>최근 타율</div>
                      </div>
                    </div>
                    <div style={{ display:'flex', gap:5 }}>
                      {parsed.map((g, i) => {
                        const c = colorFor(g);
                        return (
                          <div key={i} style={{ flex:1, background:c.bg, borderRadius:6, padding:'7px 4px', textAlign:'center', minWidth:0 }}>
                            <div style={{ ...NUM, fontSize:13, fontWeight:800, color:c.fg, lineHeight:1.1 }}>{g.ab > 0 ? `${g.h}/${g.ab}` : '−'}</div>
                            <div style={{ fontSize:9, color:'var(--text5)', marginTop:3, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{g.date}</div>
                            {g.hr > 0 && <div style={{ fontSize:9, color:'var(--acc)', fontWeight:700, marginTop:1 }}>HR</div>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
              <div style={{ background:'var(--surface)', borderRadius:16, padding:'16px', border:'0.5px solid var(--border)', marginBottom:12 }}>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:'var(--text)' }}>최근 경기 결과</div>
                  {recentLiveMatches.length > 0 && <span style={{ fontSize:10, color:'var(--acc)', fontWeight:700 }}>LIVE</span>}
                </div>
                {recentLiveMatches.map((m, i, arr) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:10, marginBottom: i < arr.length-1 ? 12 : 0, paddingBottom: i < arr.length-1 ? 12 : 0, borderBottom: i < arr.length-1 ? '0.5px solid var(--border2)' : 'none' }}>
                    <div style={{ width:30, height:30, borderRadius:8, background: m.result==='W'?'rgba(44,201,109,0.12)':m.result==='D'?'rgba(255,193,7,0.12)':'rgba(230,48,48,0.12)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                      <span style={{ fontSize:12, fontWeight:800, color:resultColor[m.result] }}>{resultLabel[m.result]}</span>
                    </div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:13, fontWeight:600, color:'var(--text)', marginBottom:1 }}>vs {m.opp}</div>
                      <div style={{ fontSize:11, color:'var(--text4)' }}>{m.date} · {m.score}</div>
                    </div>
                    <span style={{ fontSize:13, fontWeight:600, color:'var(--text)' }}>{m.contrib}</span>
                  </div>
                ))}
              </div>
              {upcomingMatch && (() => {
                const kp = playerKpInMatch(upcomingMatch);
                const isHome = kp.team === upcomingMatch.home.code;
                const opp = isHome ? upcomingMatch.away : upcomingMatch.home;
                const date = new Date(upcomingMatch.fullDate);
                const now = new Date();
                const isToday = date.toDateString() === now.toDateString();
                const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
                const isTomorrow = date.toDateString() === tomorrow.toDateString();
                const dateLabel = isToday ? '오늘' : isTomorrow ? '내일' : `${date.getMonth()+1}.${date.getDate()}`;
                const hh = String(date.getHours()).padStart(2,'0');
                const mm = String(date.getMinutes()).padStart(2,'0');
                const diff = Math.max(0, date.getTime() - now.getTime());
                const days = Math.floor(diff / 86400000);
                const hours = Math.floor((diff % 86400000) / 3600000);
                const mins = Math.floor((diff % 3600000) / 60000);
                const tilStart = days > 0 ? `${days}일 ${hours}시간 뒤` : hours > 0 ? `${hours}시간 ${mins}분 뒤` : `${mins}분 뒤`;
                return (
                  <div onClick={() => onMatch && onMatch(upcomingMatch)} style={{ background:'var(--surface)', borderRadius:16, padding:'16px', border:'0.5px solid var(--border)', marginBottom:12, cursor: onMatch ? 'pointer' : 'default' }}>
                    <div style={{ fontSize:13, fontWeight:700, color:'var(--text)', marginBottom:14 }}>다음 예정 경기</div>
                    <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                      <TeamBadge code={opp.code} size={36} logo={opp.logo}/>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:14, fontWeight:700, color:'var(--text)', marginBottom:2 }}>{isHome ? 'vs' : '@'} {opp.name}</div>
                        <div style={{ fontSize:11, color:'var(--text4)' }}>{upcomingMatch.competition}</div>
                      </div>
                      <div style={{ textAlign:'right', flexShrink:0 }}>
                        <div style={{ fontSize:13, fontWeight:700, color:'var(--text)' }}>{dateLabel} {hh}:{mm}</div>
                        <div style={{ fontSize:10, fontWeight:600, color:'var(--acc)', marginTop:3 }}>{tilStart}</div>
                      </div>
                    </div>
                  </div>
                );
              })()}
              <CareerTimeline extra={extra}/>
            </>
          )}
          {player.sport !== '축구' && player.sport !== '야구' && player.sport !== '배드민턴' && (
            <div style={{ background:'var(--surface)', borderRadius:14, padding:'14px 16px', border:'0.5px solid var(--border)', marginBottom:12 }}>
              <div style={{ fontSize:11, color:'var(--text4)', fontWeight:700, letterSpacing:1, textTransform:'uppercase', marginBottom:12 }}>프로필</div>
              {[['생년월일', player.birth],['나이', `${player.age}세`],['포지션', player.position],['신장', player.height],['클럽', player.team],['리그', player.league]].map(([k,v]) => (
                <div key={k} style={{ display:'flex', justifyContent:'space-between', paddingBottom:8, marginBottom:8, borderBottom:'0.5px solid var(--border2)' }}>
                  <span style={{ fontSize:13, color:'var(--text3)' }}>{k}</span>
                  <span style={{ fontSize:13, fontWeight:600, color:'var(--text)' }}>{v}</span>
                </div>
              ))}
            </div>
          )}
          <PlayerNews name={player.name}/>
        </div>
      )}

      {/* Stats tab */}
      {tab === 'stats' && (
        <div style={{ padding:'16px' }}>
          {statsLoading ? (
            <div style={{ display:'flex', justifyContent:'center', padding:'48px 0' }}>
              <div style={{ width:28, height:28, borderRadius:'50%', border:'3px solid var(--border)', borderTopColor:'var(--acc)', animation:'spin 0.8s linear infinite' }}/>
            </div>
          ) : player.sport === '축구' && player.compStats ? (() => {
            // 예전엔 지난 시즌(25-26) 기록을 하드코딩해 두고 API 실패 시 폴백으로
            // 썼다 — 그러면 작년 숫자가 '이번 시즌'인 양 떴다. 표째로 걷어냈고,
            // compStats 가 없으면 '스탯을 불러올 수 없습니다'로 떨어진다.
            const comps = player.compStats;
            return (
            <>
              <div style={{ background:'var(--surface)', borderRadius:16, padding:'14px 16px', border:'0.5px solid var(--border)', marginBottom:12 }}>
                <div style={{ fontSize:11, fontWeight:700, color:'var(--text4)', letterSpacing:1, textTransform:'uppercase', marginBottom:10 }}>{seasonLabel(player)} 시즌 합계</div>
                <div style={{ display:'flex', justifyContent:'space-around', textAlign:'center' }}>
                  {(() => {
                    const total = comps.reduce((acc,c)=>({goals:acc.goals+c.goals, assists:acc.assists+c.assists, matches:acc.matches+c.matches}),{goals:0,assists:0,matches:0});
                    return [['골',total.goals],['도움',total.assists],['경기',total.matches]].map(([k,v]) => (
                      <div key={k}><div style={{ ...NUM, fontSize:22, fontWeight:800, color:'var(--text)' }}>{v}</div><div style={{ fontSize:10, color:'var(--text4)', marginTop:2 }}>{k}</div></div>

                    <div style={{ fontSize:11, color:'var(--text4)', marginTop:2 }}>{c.matches}경기</div>
                  </div>
                  <div style={{ display:'flex', gap:14, textAlign:'center', flexShrink:0 }}>
                    <div><div style={{ ...NUM, fontSize:15, fontWeight:800, color:c.goals>0?'var(--acc)':'var(--text)' }}>{c.goals}</div><div style={{ fontSize:9, color:'var(--text4)' }}>골</div></div>
                    <div><div style={{ ...NUM, fontSize:15, fontWeight:800, color:c.assists>0?'var(--acc)':'var(--text-60)' }}>{c.assists}</div><div style={{ fontSize:9, color:'var(--text4)' }}>도움</div></div>
                  </div>
                </div>
              ))}

                <div style={{ background:'var(--surface)', borderRadius:16, padding:'14px 16px', border:'0.5px solid var(--border)', marginTop:12 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:'var(--text4)', letterSpacing:1, textTransform:'uppercase', marginBottom:10 }}>리그 디테일 (ESPN)</div>
                  {[
                    ['평점', liveStats.rating, '/ 10'],
                    ['슈팅', liveStats.shotsTotal, '개'],
                    ['유효슈팅', liveStats.shotsOn, '개'],
                    ['키패스', liveStats.keyPasses, '개'],
                    ['태클', liveStats.tackles, '회'],
                    ['경고', liveStats.yellowCards, '회'],

                      <span style={{ fontSize:13, fontWeight:700, color:'var(--text)' }}>{val} <span style={{ fontSize:10, color:'var(--text4)', fontWeight:400 }}>{unit}</span></span>
                    </div>
                  ))}
                </div>
              )}
              {!liveStats && player.detailStats && (
                <div style={{ background:'var(--surface)', borderRadius:16, padding:'14px 16px', border:'0.5px solid var(--border)', marginTop:12 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:'var(--text4)', letterSpacing:1, textTransform:'uppercase', marginBottom:10 }}>세부 기록</div>
                  {player.detailStats.map(([label, val]) => (
                    <div key={label} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', paddingBottom:8, marginBottom:8, borderBottom:'0.5px solid var(--border2)' }}>
                      <span style={{ fontSize:12, color:'var(--text3)' }}>{label}</span>
                      <span style={{ ...NUM, fontSize:13, fontWeight:700, color:'var(--text)' }}>{val}</span>
                    </div>
                  ))}
                </div>
              )}
            </>
            );
          })() : player.sport === '야구' && liveStats ? (
            <div style={{ background:'var(--surface)', borderRadius:16, padding:'16px', border:'0.5px solid var(--border)' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
                <div style={{ fontSize:13, fontWeight:700, color:'var(--text)' }}>{new Date().getFullYear()} 시즌 스탯</div>
                <span style={{ fontSize:10, color:'var(--acc)', fontWeight:700 }}>LIVE</span>
              </div>
              {[
                ['출전', liveStats.matches, '경기'],
                ['안타', liveStats.hits, '개'],
                ['홈런', liveStats.homeRuns, '개'],
                ['타점', liveStats.rbi, '점'],
                ['타율', liveStats.avg, ''],
                ['출루율', liveStats.obp, ''],
                ['OPS', liveStats.ops, ''],
              ].map(([label, val, unit]) => (
                <div key={label} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', paddingBottom:10, marginBottom:10, borderBottom:'0.5px solid var(--border2)' }}>
                  <span style={{ fontSize:13, color:'var(--text3)' }}>{label}</span>
                  <span style={{ fontSize:14, fontWeight:700, color:'var(--text)' }}>{val}{unit && <span style={{ fontSize:11, color:'var(--text4)', fontWeight:400 }}> {unit}</span>}</span>
                </div>
              ))}
            </div>
          ) : (
            <div style={{ textAlign:'center', padding:'40px 0', color:'var(--text5)', fontSize:14 }}>스탯을 불러올 수 없습니다</div>
          )}
        </div>
      )}

      {/* Info tab */}
      {tab === 'info' && (
        <div style={{ padding:'16px' }}>
          <div style={{ background:'var(--surface)', borderRadius:14, padding:'14px 16px', border:'0.5px solid var(--border)' }}>
            <div style={{ fontSize:11, color:'var(--text4)', fontWeight:700, letterSpacing:1, textTransform:'uppercase', marginBottom:12 }}>프로필</div>
            {[['생년월일', player.birth],['나이', `${player.age}세`],['포지션', player.position],['신장', player.height],['클럽', player.team],['리그', player.league]].map(([k,v]) => (
              <div key={k} style={{ display:'flex', justifyContent:'space-between', paddingBottom:8, marginBottom:8, borderBottom:'0.5px solid var(--border2)' }}>
                <span style={{ fontSize:13, color:'var(--text3)' }}>{k}</span>
                <span style={{ fontSize:13, fontWeight:600, color:'var(--text)' }}>{v}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ height:'calc(96px + env(safe-area-inset-bottom))' }}/>
    </div>
  );
}

// ─── SCREEN: SCHEDULE ─────────────────────────────────────────
function ScheduleScreen({ onMatch, liveApiMatches = [], isLoading = false, onRefresh, isActive = false, scrollTopKey = 0, onTabBarScroll }) {
  const onTabScroll = useTabBarScrollSync(onTabBarScroll);
  const days = ['일','월','화','수','목','금','토'];
  const now = new Date();

  // Generate dates: today ±7 days
  const datesList = [];
  for (let i = -7; i <= 7; i++) {
    const date = new Date(now);
    date.setDate(date.getDate() + i);
    datesList.push(date);
  }

  const [selDate, setSelDate] = React.useState(now.toDateString());
  const stripRef = React.useRef(null);
  const todayRef = React.useRef(null);

  // Pull-to-refresh + horizontal day-swipe state
  const [pullY, setPullY] = React.useState(0);
  const [refreshing, setRefreshing] = React.useState(false);
  const [trans, setTrans] = React.useState(null); // {dir:1|-1, from:dateStr} during a day-change carousel slide
  const touchStartY = React.useRef(0);
  const touchStartX = React.useRef(0);
  const touchDX = React.useRef(0);
  const touchDY = React.useRef(0);
  const scrollRef = React.useRef(null);
  const selRef = React.useRef(null);
  const PULL_THRESHOLD = 64;

  const goToDate = (dateStr) => {
    const ci = datesList.findIndex(d => d.toDateString() === selDate);
    const ni = datesList.findIndex(d => d.toDateString() === dateStr);
    if (ni < 0 || ni === ci) return;
    setTrans({ dir: ni > ci ? 1 : -1, from: selDate });
    setSelDate(dateStr);
  };
  const changeDay = (delta) => {
    const ci = datesList.findIndex(d => d.toDateString() === selDate);
    const ni = Math.max(0, Math.min(datesList.length - 1, ci + delta));
    if (ni !== ci) goToDate(datesList[ni].toDateString());
  };

  // 제스처 축 잠금. 예전엔 손을 뗀 뒤에야 가로/세로를 판정해서, 비스듬히 미는
  // 동안 세로 스크롤이 그대로 돌아갔다 — 날짜가 넘어가면서 목록도 같이 튀어
  // '간섭되는' 느낌이 났다. 이제 초반 8px 에서 축을 하나로 정하고, 가로로
  // 정해지면 세로 스크롤을 막는다.
  const axisRef = React.useRef(null);
  const refreshingRef = React.useRef(false);
  React.useEffect(() => { refreshingRef.current = refreshing; }, [refreshing]);

  const handleTouchStart = (e) => {
    touchStartY.current = e.touches[0].clientY;
    touchStartX.current = e.touches[0].clientX;
    touchDX.current = 0; touchDY.current = 0;
    axisRef.current = null;
  };

  // React 의 onTouchMove 는 passive 로 붙어 preventDefault 가 통하지 않는다.
  // 세로 스크롤을 실제로 멈추려면 네이티브 리스너를 non-passive 로 달아야 한다.
  React.useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onMove = (e) => {
      if (!e.touches || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - touchStartX.current;
      const dy = e.touches[0].clientY - touchStartY.current;
      touchDX.current = dx; touchDY.current = dy;
      if (axisRef.current == null) {
        const ax = Math.abs(dx), ay = Math.abs(dy);
        if (ax < 8 && ay < 8) return;            // 아직 방향을 알 수 없다
        axisRef.current = ax > ay * 1.2 ? 'x' : 'y';
      }
      if (axisRef.current === 'x') {
        // 가로 제스처로 확정 — 스크롤이 따라오지 않게 막는다.
        if (e.cancelable) e.preventDefault();
        return;
      }
      if (refreshingRef.current) return;
      if ((el.scrollTop || 0) > 0) return;
      if (dy > 0) setPullY(Math.min(dy * 0.45, PULL_THRESHOLD + 16));
    };
    el.addEventListener('touchmove', onMove, { passive: false });
    return () => el.removeEventListener('touchmove', onMove);
  }, []);

  const handleTouchEnd = async () => {
    const dx = touchDX.current, dy = touchDY.current;
    const axis = axisRef.current;
    axisRef.current = null;
    // 가로로 확정된 제스처만 날짜를 넘긴다 (왼쪽 = 다음 날, 오른쪽 = 이전 날).
    if (axis === 'x') {
      if (Math.abs(dx) > 55) changeDay(dx < 0 ? 1 : -1);
      setPullY(0);
      return;
    }
    if (pullY >= PULL_THRESHOLD && onRefresh && !refreshing) {
      haptic('medium');
      setRefreshing(true);
      setPullY(PULL_THRESHOLD);
      // Safety: cap PTR spinner duration so it never sticks.
      const ptrSafety = setTimeout(() => setRefreshing(false), 12000);
      try { await onRefresh(); } catch (e) { console.warn('PTR refresh error:', e); }
      clearTimeout(ptrSafety);
      setRefreshing(false);
    }
    setPullY(0);
  };

  // Scroll today's cell to center whenever tab becomes active
  React.useEffect(() => {
    if (!isActive) return;
    const strip = stripRef.current;
    const cell = todayRef.current;
    if (!strip || !cell) return;
    const offset = cell.offsetLeft - (strip.clientWidth / 2) + (cell.offsetWidth / 2);
    strip.scrollLeft = offset;
  }, [isActive]);

  // Scroll to top when tab tapped
  React.useEffect(() => { if (scrollTopKey > 0) { SCROLL_MEM.schedule = 0; scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); } }, [scrollTopKey]);
  useScrollMemory('schedule', scrollRef);

  // 경기가 많은 날엔 지금 진행 중인 경기를 찾으려고 한참 스크롤해야 한다.
  // 일정 탭에 들어오면 라이브 경기를 화면 중앙으로 보낸다.
  // 라이브가 없을 때는 건드리지 않는다 — 그때는 이전 스크롤 위치를 기억하는
  // 기존 동작이 더 자연스럽다.
  const liveRowRef = React.useRef(null);
  const centeredRef = React.useRef(false);
  React.useEffect(() => { if (!isActive) centeredRef.current = false; }, [isActive]);
  React.useEffect(() => {
    if (!isActive || centeredRef.current) return;
    const el = liveRowRef.current;
    if (!el) return;
    centeredRef.current = true;
    // 목록이 그려진 뒤 위치가 잡히도록 한 프레임 미룬다.
    const t = setTimeout(() => {
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch { el.scrollIntoView(); }
    }, 120);
    return () => clearTimeout(t);
  }, [isActive, liveApiMatches]);

  // Keep the selected date centered in the strip when it changes (tap or swipe).
  React.useEffect(() => {
    const strip = stripRef.current, cell = selRef.current;
    if (strip && cell) strip.scrollTo({ left: cell.offsetLeft - strip.clientWidth / 2 + cell.offsetWidth / 2, behavior: 'smooth' });
  }, [selDate]);

  // Filter matches for selected date and within ±7 days range
  const sevenDaysAgo = new Date(now);
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
  sevenDaysAgo.setHours(0, 0, 0, 0);

  const sevenDaysLater = new Date(now);
  sevenDaysLater.setDate(sevenDaysLater.getDate() + 7);
  sevenDaysLater.setHours(23, 59, 59, 999);

  const allMatches = liveApiMatches.filter(m => {
    if (!m.fullDate || !m.koreanPlayer) return false;
    // 마이너 강등 선수의 MLB(부모 구단) 경기는 그의 경기가 아니므로 일정에서도 제외.
    if (koreanIsMinorLeaguer(m)) return false;
    const matchDate = new Date(m.fullDate);
    return matchDate >= sevenDaysAgo && matchDate <= sevenDaysLater;
  });

  const matchesForDate = (ds) => allMatches
    .filter(m => new Date(m.fullDate).toDateString() === ds)
    .sort((a, b) => new Date(a.fullDate) - new Date(b.fullDate));
  const selectedDateMatches = matchesForDate(selDate);

  // Get label for date
  const getDateLabel = (date) => {
    const diff = Math.round((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / (1000 * 60 * 60 * 24));
    if (diff === 0) return '오늘';
    if (diff === -1) return '어제';
    if (diff === 1) return '내일';
    return diff < 0 ? `${-diff}일전` : `${diff}일후`;
  };

  const stripFade = useEdgeFade(stripRef);

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, height:'100%', background:'var(--bg)', minHeight:0 }}>
      {/* Fixed top nav (title + date strip) */}
      <div style={{ flexShrink:0, background:'var(--bg)' }}>
        <TabHeader title="일정"/>
        <div
          ref={stripRef}
          onScroll={stripFade.onScroll}
          style={{ display:'flex', gap:6, padding:'0 16px 14px', overflowX:'auto', ...stripFade.style }}
          className="scrollbar-hide">
          {datesList.map(date => {
            const dayIdx = date.getDay();
            const dateStr = date.toDateString();
            const isSel = dateStr === selDate;
            const isToday = dateStr === now.toDateString();
            const label = getDateLabel(date);
            return (
              <div key={dateStr} ref={el => { if (isToday) todayRef.current = el; if (isSel) selRef.current = el; }} onClick={() => goToDate(dateStr)} style={{ flexShrink:0, minWidth:64, height:72, borderRadius:12, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:3, cursor:'pointer', background: isSel ? 'var(--acc)' : isToday ? 'rgba(245,196,0,0.12)' : 'var(--border2)', border: isToday && !isSel ? '0.5px solid rgba(245,196,0,0.4)' : '0.5px solid transparent', padding:'8px 6px' }}>
                <span style={{ fontSize:9, color: isSel ? 'rgba(0,0,0,0.6)' : 'var(--text5)', fontWeight:600, letterSpacing:0.3 }}>{label}</span>
                <span style={{ ...NUM, fontSize:22, fontWeight:800, color: isSel ? '#000' : isToday ? 'var(--acc)' : 'var(--text-70)', lineHeight:1 }}>{date.getDate()}</span>
                <span style={{ fontSize:10, color: isSel ? 'rgba(0,0,0,0.5)' : 'var(--text4)', fontWeight:600 }}>{days[dayIdx]}</span>
              </div>
            );
          })}
        </div>
      </div>
      {/* Scrollable content with pull-to-refresh */}
      <div ref={scrollRef} onScroll={onTabScroll} onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd} onTouchCancel={handleTouchEnd} style={{ flex:1, overflowX:'hidden', overflowY:'auto', background:'var(--bg)', minHeight:0, touchAction:'pan-y' }} className="scrollbar-hide">
      {/* Pull-to-refresh indicator */}
      <div style={{ overflow:'hidden', height: pullY, transition: pullY === 0 ? 'height 0.25s ease' : 'none', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, opacity: Math.min(pullY / PULL_THRESHOLD, 1) }}>
          <div style={{ width:18, height:18, border:'2.5px solid var(--acc)', borderTopColor:'transparent', borderRadius:'50%', animation: refreshing ? 'spin 0.7s linear infinite' : (pullY >= PULL_THRESHOLD ? 'spin 0.7s linear infinite' : 'none'), transform: !refreshing && pullY < PULL_THRESHOLD ? `rotate(${pullY * 4}deg)` : undefined }}/>
          <span style={{ fontSize:12, color:'var(--text3)', fontWeight:600 }}>{refreshing ? '새로고침 중...' : pullY >= PULL_THRESHOLD ? '놓아서 새로고침' : '당겨서 새로고침'}</span>
        </div>
      </div>


      {/* Match list — 2-panel carousel slide on day change */}
      {(() => {
        const renderDay = (dayMatches) => (
          isLoading ? (
          <div style={{ paddingTop:8 }}>
            {Array.from({length:9}).map((_,i) => <SkeletonScheduleItem key={i}/>)}
          </div>
        ) : dayMatches.length === 0 ? (
          <div style={{ textAlign:'center', padding:'60px 20px', color:'var(--text4)' }}>
            <div style={{ fontSize:48, marginBottom:16 }}>📅</div>
            <div style={{ fontSize:15, fontWeight:600, marginBottom:6 }}>경기가 없습니다</div>
            <div style={{ fontSize:13 }}>다른 날짜를 선택해보세요</div>
          </div>
        ) : (
          dayMatches.map((m, mi) => {
            const isFinished = m.status === 'STATUS_FINAL' || m.status === 'STATUS_FULL_TIME' || m.status === 'final' || m.status === 'STATUS_END_PERIOD' || m.status === 'STATUS_FINAL_PEN';
            const kp = m.koreanPlayer;
            const rawLeague = (m.competition || m.sport || '').replace(/^[⚽⚾🏀🎾]\s*/,'');
            const leagueName = (() => {
              const s = rawLeague;
              if (/챔피언스|Champions League/i.test(s)) return 'UCL';
              if (/유로파|Europa League/i.test(s)) return 'UEL';
              if (/컨퍼런스|Conference/i.test(s)) return 'UECL';
              if (/Premier League/i.test(s)) return '프리미어리그';
              if (/La Liga|Primera Division/i.test(s)) return '라리가';
              if (/Bundesliga/i.test(s)) return '분데스리가';
              if (/Serie A/i.test(s)) return '세리에 A';
              if (/Ligue 1/i.test(s)) return '리그앙';
              if (/Major League Soccer|^MLS/i.test(s)) return 'MLS';
              if (/Major League Baseball/i.test(s)) return 'MLB';
              if (s.length > 10) return s.slice(0, 9) + '…';
              return s;
            })();
            const koreans = m.koreanPlayers || [kp];
            const koreanNames = koreans.map(k => k.name).join(' · ');
            const labelParts = [];
            if (isFinished || m.live) {
              // Show events aggregated across all Korean players
              // 이름은 왼쪽에 이미 있다 — 더비(2명 이상)일 때만 누구 기록인지 밝힌다.
              const multiKp = koreans.length > 1;
              koreans.forEach(k => {
                const goals = (m.events||[]).filter(e=>e.type==='goal'&&e.player===k.name).length;
                const assists = (m.events||[]).filter(e=>e.type==='assist'&&e.player===k.name).length;
                const who = multiKp ? `${k.name} ` : '';
                if (goals > 0) labelParts.push(`${who}${goals}골`);
                if (assists > 0) labelParts.push(`${who}${assists}도움`);
              });
              if (labelParts.length === 0 && kp.event) {
                // 더비(2명 이상)에서 kp.event 는 첫 번째 선수 것이라 누구 기록인지
                // 알 수 없다. 개인 기록 대신 경기 상태로 바꾼다.
                labelParts.push(multiKp
                  ? (m.live || m.time === 'LIVE' ? '진행 중' : '경기 종료')
                  : formatExpectedEvent(kp, liveApiMatches));
              }
            }

            const homeHasKorean = koreans.some(k => k.team === m.home.code);
            const awayHasKorean = koreans.some(k => k.team === m.away.code);
            const homeIsKorean = homeHasKorean;
            const awayIsKorean = awayHasKorean;

            return (
              <React.Fragment key={m.id}>
                {/* Label above card — 좌: 선수·경기 정보, 우: 리그. ('종료'는 스코어 표시로 충분해 삭제) */}
                <div
                  // 그날의 첫 라이브 경기에만 표식을 달아 중앙 정렬 대상으로 삼는다.
                  ref={(m.live || m.time === 'LIVE') && dayMatches.findIndex(x => x.live || x.time === 'LIVE') === mi
                       ? liveRowRef : undefined}
                  style={{ display:'flex', alignItems:'center', gap:4, marginBottom:5, paddingLeft:2 }}>
                  {koreans.map(k => {
                    const kpProfile = ALL_PLAYERS.find(p => p.name === k.name);
                    return kpProfile ? (
                      <div key={k.name} style={{ width:16, height:16, borderRadius:'50%', overflow:'hidden', background:'#fff', flexShrink:0, marginRight:1 }}>
                        <PlayerPhoto player={kpProfile} style={{ width:'100%', height:'100%' }}/>
                      </div>
                    ) : null;
                  })}
                  <span style={{ fontSize:11, color:'var(--acc)', fontWeight:700 }}>{koreanNames}</span>
                  {m.isKoreanDerby && (
                    <span style={{ fontSize:9, fontWeight:800, color:'#000', background:'linear-gradient(90deg, var(--acc), #ff8a3d)', borderRadius:4, padding:'2px 5px', letterSpacing:0.3, lineHeight:1 }}>🇰🇷 더비</span>
                  )}
                  {labelParts.length > 0 && (
                    <span style={{ fontSize:11, color: isMutedEvent(labelParts[0]) ? 'var(--text4)' : 'var(--text)', fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{' · ' + labelParts.join(' · ')}</span>
                  )}
                  <span style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:4, flexShrink:0 }}>
                    {m.competitionLogo
                      ? <img src={m.competitionLogo} style={{ width:12, height:12, objectFit:'contain', opacity:0.55 }} alt=""/>
                      : <span style={{ fontSize:10 }}>{m.sport?.includes('MLB')||m.sport?.includes('⚾') ? '⚾' : '⚽'}</span>
                    }
                    <span style={{ fontSize:11, color:'var(--text4)' }}>{leagueName}</span>
                  </span>
                </div>
                <div onClick={() => onMatch(m)} style={{ marginBottom:20, background:'var(--surface)', borderRadius:14, padding:'12px 16px', cursor:'pointer', border: m.live ? '0.5px solid rgba(230,48,48,0.25)' : '0.5px solid var(--border2)' }}>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
                    {/* Home */}
                    <div style={{ display:'flex', alignItems:'center', gap:6, flex:1, justifyContent:'flex-end' }}>
                      <span style={{ fontSize:13, fontWeight: homeIsKorean ? 800 : 500, color:'var(--text)', textAlign:'right', lineHeight:1.3 }}>{m.home.name}</span>
                      <TeamBadge code={m.home.code} size={24} logo={m.home.logo}/>
                    </div>
                    {/* Center: score or time */}
                    <div style={{ width:64, flexShrink:0, textAlign:'center' }}>
                      {m.live ? (
                        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:1 }}>
                          <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                            <LiveDot/>
                            <span style={{ ...NUM, fontSize:15, fontWeight:800, color:'var(--text)' }}>{m.home.score}-{m.away.score}</span>
                          </div>
                          <span style={{ fontSize:9, fontWeight:700, color:'var(--acc)' }}>{liveTimeLabel(m, m.minute)}</span>
                        </div>
                      ) : isFinished ? (
                        <span style={{ ...NUM, fontSize:16, fontWeight:800, color:'var(--text)' }}>{m.home.score}-{m.away.score}</span>
                      ) : (
                        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:1 }}>
                          <span style={{ ...NUM, fontSize:14, fontWeight:700, color:'var(--text-60)' }}>{m.time||'예정'}</span>
                          <span style={{ fontSize:9, color:'var(--text5)' }}>KST</span>
                        </div>
                      )}
                    </div>
                    {/* Away */}
                    <div style={{ display:'flex', alignItems:'center', gap:6, flex:1 }}>
                      <TeamBadge code={m.away.code} size={24} logo={m.away.logo}/>
                      <span style={{ fontSize:13, fontWeight: awayIsKorean ? 800 : 500, color:'var(--text)', lineHeight:1.3 }}>{m.away.name}</span>
                    </div>
                  </div>
                </div>
              </React.Fragment>
            );
          })
          )
        );
        const panel = (ms) => <div style={{ width: trans ? '50%' : '100%', flexShrink:0, boxSizing:'border-box', padding:'0 16px' }}>{renderDay(ms)}</div>;
        if (!trans) return panel(selectedDateMatches);
        const l = trans.dir > 0 ? matchesForDate(trans.from) : selectedDateMatches;
        const r = trans.dir > 0 ? selectedDateMatches : matchesForDate(trans.from);
        return (
          <div key={selDate} className={trans.dir > 0 ? 'sched-car-next' : 'sched-car-prev'} onAnimationEnd={() => setTrans(null)} style={{ display:'flex', width:'200%' }}>
            {panel(l)}{panel(r)}
          </div>
        );
      })()}
      <div style={{ height:'calc(96px + env(safe-area-inset-bottom))' }}/>
      </div>
    </div>
  );
}

// ─── SCREEN: PLAYERS LIST ────────────────────────────────────
// 팔로우하지 않은 선수를 목록 맨 아래에서 제안한다.
// 로스터에 선수가 늘어도 사용자가 알 길이 없었다 — 선수 편집에 들어가 훑어야만
// 새로 들어온 선수를 발견할 수 있었다. 최근에 추가된 순으로 앞에 놓고 NEW 를 붙인다.
const NEW_PLAYER_DAYS = 7;
function SuggestPlayersBanner({ followed, onToggleFollow, onAdd, sportFeeds, filter, sportOrder = ['축구','야구'] }) {
  const scrollRef = React.useRef(null);
  const fade = useEdgeFade(scrollRef, 24);
  const now = Date.now();

  const candidates = React.useMemo(() => {
    const daysAgo = p => p.addedAt ? (now - new Date(p.addedAt).getTime()) / 86400000 : Infinity;
    const pool = ALL_PLAYERS
      .filter(p => !followed.has(p.id))
      .filter(p => isPlayerAllowed(p, sportFeeds))
      .filter(p => filter === '전체' || p.sport === filter)
      .map(p => ({ p, d: daysAgo(p) }))
      .sort((a, b) => a.d - b.d);         // 종목 안에서 최근 합류 순

    // '전체'에서 최근순으로만 자르면 수가 많은 축구가 12칸을 다 차지해
    // 야구 선수가 한 명도 안 보인다. 종목을 번갈아 뽑아 둘 다 앞쪽에 나오게 한다.
    const sports = [...sportOrder, ...[...new Set(pool.map(c => c.p.sport))].filter(sp => !sportOrder.includes(sp))];
    const groups = sports.map(sp => pool.filter(c => c.p.sport === sp)).filter(g => g.length);
    const out = [];
    const at = groups.map(() => 0);
    while (out.length < 12 && groups.some((g, i) => at[i] < g.length)) {
      for (let i = 0; i < groups.length && out.length < 12; i++) {
        if (at[i] < groups[i].length) out.push(groups[i][at[i]++]);
      }
    }
    return out;
  }, [followed, sportFeeds, filter, sportOrder, now]);

  React.useEffect(() => { fade.update(); }, [candidates.length]);
  if (!candidates.length) return null;

  return (
    <div style={{ marginTop:18, padding:'14px 0 4px', borderTop:'0.5px solid var(--border)' }}>
      <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:12, paddingLeft:2 }}>
        <span style={{ fontSize:13, fontWeight:800, color:'var(--text)', letterSpacing:-0.3 }}>
          다른 한국 선수도 팔로우해 보세요
        </span>
        <button onClick={onAdd} style={{ marginLeft:'auto', background:'none', border:'none', padding:0,
                 fontSize:12, fontWeight:700, color:'var(--acc)', cursor:'pointer' }}>모두 보기</button>
      </div>
      <div ref={scrollRef} onScroll={fade.onScroll} className="scrollbar-hide"
           style={{ display:'flex', gap:12, overflowX:'auto', WebkitOverflowScrolling:'touch',
                    padding:'2px 2px 6px', ...fade.style }}>
        {candidates.map(({ p, d }) => (
          <button key={p.id} onClick={() => onToggleFollow(p.id)}
                  style={{ background:'none', border:'none', padding:0, cursor:'pointer', flexShrink:0,
                           width:62, display:'flex', flexDirection:'column', alignItems:'center', gap:6 }}>
            <div style={{ position:'relative', width:54, height:54 }}>
              <div style={{ position:'absolute', inset:0, borderRadius:'50%', overflow:'hidden',
                            boxShadow:'0 0 0 1px var(--border2)' }}>
                <PlayerPhoto player={p} style={{ position:'absolute', inset:0 }} tint="var(--surface)"/>
              </div>
              <div style={{ position:'absolute', right:-2, bottom:-2, width:19, height:19, borderRadius:'50%',
                            background:'var(--acc)', border:'2px solid var(--bg)',
                            display:'flex', alignItems:'center', justifyContent:'center' }}>
                <svg width="9" height="9" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="#000" strokeWidth="2.2" strokeLinecap="round"/></svg>
              </div>
              {d <= NEW_PLAYER_DAYS && (
                <div style={{ position:'absolute', left:-3, top:-3, background:'var(--acc)', color:'#000',
                              fontSize:8, fontWeight:900, letterSpacing:0.2, borderRadius:5,
                              padding:'1px 4px', border:'1.5px solid var(--bg)' }}>NEW</div>
              )}
            </div>
            <span style={{ fontSize:11, fontWeight:700, color:'var(--text2)', letterSpacing:-0.3,
                           whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:62 }}>{p.name}</span>
            <span style={{ fontSize:9, color:'var(--text5)', whiteSpace:'nowrap', overflow:'hidden',
                           textOverflow:'ellipsis', maxWidth:62, marginTop:-4 }}>{p.team}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function PlayersScreen({ onPlayer, onAdd, onToggleFollow, onTabBarScroll, followed, statsCache = {}, isLoading = false, onRefresh, scrollTopKey = 0, liveApiMatches = [], sportFeeds, playerOrder = [], sportOrder = ['축구','야구'] }) {
  // Static fallback team logo URLs by player name (used when no recent match cached)
  const TEAM_LOGO_FALLBACK = {
    '손흥민':'https://a.espncdn.com/i/teamlogos/soccer/500/18966.png',
    '이강인':'https://a.espncdn.com/i/teamlogos/soccer/500/1068.png',
    '김민재':'https://a.espncdn.com/i/teamlogos/soccer/500/132.png',
    '황희찬':'https://a.espncdn.com/i/teamlogos/soccer/500/380.png',
    '황인범':'https://a.espncdn.com/i/teamlogos/soccer/500/437.png',
    '조규성':'https://a.espncdn.com/i/teamlogos/soccer/500/304.png',
    '오현규':'https://a.espncdn.com/i/teamlogos/soccer/500/113.png',
    '양현준':'https://a.espncdn.com/i/teamlogos/soccer/500/256.png',
    '백승호':'https://a.espncdn.com/i/teamlogos/soccer/500/337.png',
    '배준호':'https://a.espncdn.com/i/teamlogos/soccer/500/336.png',
    '엄지성':'https://a.espncdn.com/i/teamlogos/soccer/500/318.png',
    '설영우':'https://a.espncdn.com/i/teamlogos/soccer/500/3841.png',
    '김하성':'https://a.espncdn.com/i/teamlogos/mlb/500/pit.png',
    '이정후':'https://a.espncdn.com/i/teamlogos/mlb/500/sf.png',
    '김혜성':'https://a.espncdn.com/i/teamlogos/mlb/500/lad.png',
  };
  // Build a map: player name → team logo URL.
  // Prefer API-Football logos (media.api-sports.io) from live/recent matches —
  // they're always up-to-date with current team. Fall back to static URLs only
  // for players not yet found in any recent match.
  const teamLogoByPlayer = React.useMemo(() => {
    const map = {};
    for (const m of liveApiMatches) {
      const allKp = m.koreanPlayers || [m.koreanPlayer];
      for (const kp of allKp) {
        if (!kp || map[kp.name]) continue;
        const koreanIsHome = kp.team === m.home.code;
        const logo = koreanIsHome ? m.home.logo : m.away.logo;
        if (logo) map[kp.name] = logo;
      }
    }
    for (const [name, logo] of Object.entries(TEAM_LOGO_FALLBACK)) {
      if (!map[name]) map[name] = logo;
    }
    return map;
  }, [liveApiMatches]);

  const onTabScroll = useTabBarScrollSync(onTabBarScroll);
  // 오버레이 헤더의 실제 높이 — 스크롤 영역 상단 여백을 이 값으로 맞춘다.
  const headRef = React.useRef(null);
  const [headH, setHeadH] = React.useState(0);
  React.useLayoutEffect(() => {
    const el = headRef.current;
    if (!el) return;
    const sync = () => setHeadH(el.offsetHeight);
    sync();
    const ro = new ResizeObserver(sync);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const sports = ['전체', '축구', '야구'];
  const [scrolled, setScrolled] = React.useState(false);
  const [filter, setFilter] = React.useState('전체');
  const followedPlayers = ALL_PLAYERS
    .filter(p => followed.has(p.id))
    .filter(p => isPlayerAllowed(p, sportFeeds));
  const filtered = filter === '전체' ? followedPlayers
    : followedPlayers.filter(p => p.sport === filter);

  const [pullY, setPullY] = React.useState(0);
  const [refreshing, setRefreshing] = React.useState(false);
  const touchStartY = React.useRef(0);
  const scrollRef = React.useRef(null);
  const PULL_THRESHOLD = 64;
  React.useEffect(() => { if (scrollTopKey > 0) { SCROLL_MEM.players = 0; scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); } }, [scrollTopKey]);
  useScrollMemory('players', scrollRef);

  const handleTouchStart = (e) => { touchStartY.current = e.touches[0].clientY; };
  const handleTouchMove = (e) => {
    if (refreshing) return;
    const scrollTop = scrollRef.current?.scrollTop || 0;
    if (scrollTop > 0) return;
    const dy = e.touches[0].clientY - touchStartY.current;
    if (dy > 0) setPullY(Math.min(dy * 0.45, PULL_THRESHOLD + 16));
  };
  const handleTouchEnd = async () => {
    if (pullY >= PULL_THRESHOLD && onRefresh && !refreshing) {
      haptic('medium');
      setRefreshing(true);
      setPullY(PULL_THRESHOLD);
      // Safety: cap PTR spinner duration so it never sticks.
      const ptrSafety = setTimeout(() => setRefreshing(false), 12000);
      try { await onRefresh(); } catch (e) { console.warn('PTR refresh error:', e); }
      clearTimeout(ptrSafety);
      setRefreshing(false);
    }
    setPullY(0);
  };

  return (
    <div style={{ position:'relative', display:'flex', flexDirection:'column', flex:1, background:'var(--bg)', minHeight:0,
                  // 앱 컨테이너가 상태표시줄만큼 padding-top 을 갖고 있어 콘텐츠가
                  // 그 아래에서 시작한다 → 상태표시줄 자리는 단색이라 유리 블러가
                  // 거기서 끊겨 보인다(제보). 이 화면만 위로 끌어올려 콘텐츠가
                  // 상태표시줄 밑으로도 흐르게 하고, 헤더가 그 영역까지 덮는다.
                  marginTop: 'calc(-1 * env(safe-area-inset-top))',
                  height: 'calc(100% + env(safe-area-inset-top))' }}>
      {/* 상단 고정 — 스크롤 '위에' 겹쳐 둔다.
          밖으로 빼면 당겨서 새로고침·키보드에 안 밀리지만, 콘텐츠가 그 아래로
          지나가지 않아 유리 블러가 걸릴 대상이 없어져 답답해진다(제보).
          absolute 로 겹치고 스크롤 영역 맨 위에 같은 높이의 여백을 둔다. */}
      <div ref={headRef} style={{ position:'absolute', top:0, left:0, right:0, zIndex:20, paddingTop:'env(safe-area-inset-top)', background: scrolled ? 'rgba(11,11,13,0.55)' : 'var(--bg)', backdropFilter: scrolled ? 'saturate(180%) blur(22px)' : 'none', WebkitBackdropFilter: scrolled ? 'saturate(180%) blur(22px)' : 'none', borderBottom: `0.5px solid ${scrolled ? 'var(--border)' : 'transparent'}`, transition: 'background 0.28s ease, backdrop-filter 0.28s ease, border-color 0.28s ease' }}>
        <TabHeader title="선수" right={
          <button onClick={onAdd} style={{ display:'flex', alignItems:'center', gap:6, background:'rgba(255,255,255,0.10)', border:'0.5px solid rgba(255,255,255,0.22)', height:CTRL_H, boxSizing:'border-box', borderRadius:CTRL_H/2, padding:'0 16px', color:'#fff', fontSize:13, fontWeight:700, cursor:'pointer', visibility: (typeof window !== 'undefined' && window.__nativeChrome) ? 'hidden' : 'visible' }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#fff"/></svg>
            선수 편집
          </button>
        }/>
        <div style={{ display:'flex', gap:8, padding:'0 16px 14px', overflowX:'auto' }} className="scrollbar-hide">
          {sports.map(s => (
            <button key={s} onClick={() => setFilter(s)} style={{ flexShrink:0, background: filter===s ? 'var(--acc)' : 'var(--border)', border:'none', height:CTRL_H, boxSizing:'border-box', borderRadius:CTRL_H/2, padding:'0 16px', color: filter===s ? '#000' : 'var(--text2)', fontSize:13, fontWeight:600, cursor:'pointer' }}>{s}</button>
          ))}
        </div>
      </div>
      <div ref={scrollRef} onScroll={e => { const s = e.currentTarget.scrollTop > 4; setScrolled(p => p !== s ? s : p); onTabScroll(e); }} onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} style={{ flex:1, overflow:'auto', background:'var(--bg)', minHeight:0 }} className="scrollbar-hide">
        {/* 오버레이 헤더가 가리는 만큼 비워둔다 — 스크롤하면 내용이 그 아래로 흐른다 */}
        <div style={{ height: headH, flexShrink: 0 }}/>
      {/* Pull-to-refresh indicator */}
      <div style={{ overflow:'hidden', height: pullY, transition: pullY === 0 ? 'height 0.25s ease' : 'none', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, opacity: Math.min(pullY / PULL_THRESHOLD, 1) }}>
          <div style={{ width:18, height:18, border:'2.5px solid var(--acc)', borderTopColor:'transparent', borderRadius:'50%', animation: refreshing || pullY >= PULL_THRESHOLD ? 'spin 0.7s linear infinite' : 'none', transform: !refreshing && pullY < PULL_THRESHOLD ? `rotate(${pullY * 4}deg)` : undefined }}/>
          <span style={{ fontSize:12, color:'var(--text3)', fontWeight:600 }}>{refreshing ? '새로고침 중...' : pullY >= PULL_THRESHOLD ? '놓아서 새로고침' : '당겨서 새로고침'}</span>
        </div>
      </div>
      <div style={{ padding:'0 16px', display:'flex', flexDirection:'column', gap:10 }}>
        {(() => {
          const renderCard = p => {
            const teamLogo = teamLogoByPlayer[p.name];
            const s = statsCache[p.id];
            const goals   = p.sport === '야구' ? (s?.goals   ?? p.goals  ) : p.goals;
            const assists = p.sport === '야구' ? (s?.assists ?? p.assists) : p.assists;
            const matches = p.sport === '야구' ? (s?.matches ?? p.matches) : p.matches;
            const stats = [];
            if (p.sport === '축구') {
              stats.push({ k:'골',   v:goals,   accent: goals > 0 });
              stats.push({ k:'도움', v:assists, accent: false });
              stats.push({ k:'경기', v:matches, accent: false });
              if (p.rating > 0) stats.push({ k:'평점', v:p.rating.toFixed(1), accent: true });
            } else if (p.sport === '야구' && s) {
              stats.push({ k:'홈런', v:s.homeRuns, accent: s.homeRuns > 0 });
              stats.push({ k:'안타', v:s.hits, accent: false });
              if (s.avg) stats.push({ k:'타율', v:s.avg, accent: true });
            } else if (p.sport === '배드민턴') {
              stats.push({ k:'경기', v:matches, accent: false });
              if (p.wins != null) stats.push({ k:'승', v:p.wins, accent: true });
              if (p.winRate != null) stats.push({ k:'승률', v:`${p.winRate}%`, accent: true });
            } else {
              stats.push({ k:'경기', v:matches, accent: false });
              if (p.rating > 0) stats.push({ k:'평점', v:p.rating.toFixed(1), accent: true });
            }
            return (
              <div key={p.id} onClick={() => onPlayer(p)} style={{ background:'var(--surface)', borderRadius:16, overflow:'hidden', cursor:'pointer', border:'0.5px solid var(--border2)', display:'flex', alignItems:'stretch', height:112 }}>
                <div style={{ width:90, height:112, flexShrink:0, background:'var(--card)', position:'relative', overflow:'hidden' }}>
                  <PlayerPhoto player={p} style={{ position:'absolute', inset:0 }} tint="var(--surface)"/>
                </div>
                <div style={{ flex:1, padding:'12px 14px 6px', display:'flex', flexDirection:'column', justifyContent:'space-between', minWidth:0 }}>
                  {/* Top: name */}
                  <div>
                    <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:7, flexWrap:'wrap' }}>
                      <span style={{ fontSize:16, fontWeight:800, color:'var(--text)', letterSpacing:-0.3 }}>{p.name}</span>
                      <span style={{ fontSize:10, color:'var(--text5)', fontWeight:500 }}>{p.nameEn}</span>
                      {p.injury && <span title={p.injury.label} style={{ fontSize:13, fontWeight:900, color:injuryStyle(p.injury).ic }}>{injuryStyle(p.injury).icon}</span>}
                    </div>
                    <div style={{ fontSize:11, color:'var(--text3)' }}>{p.team} · {p.position}</div>
                  </div>
                  {/* Bottom: team logo on left, stats on right (vertically aligned at number row) */}
                  <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8, marginTop:6 }}>
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', flexShrink:0 }}>
                      {teamLogo
                        ? <img src={teamLogo} alt={p.team} style={{ width:22, height:22, objectFit:'contain', marginTop:10 }}/>
                        : <div style={{ width:22, height:22, marginTop:10 }}/>
                      }
                      <div style={{ fontSize:9, marginTop:1, visibility:'hidden' }}>·</div>
                    </div>
                    <div style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
                      {stats.map((st, i) => (
                        <div key={i} style={{ textAlign:'center', display:'flex', flexDirection:'column', alignItems:'center' }}>
                          <div style={{ ...NUM, fontSize:15, fontWeight:800, color: st.accent ? 'var(--acc)' : 'var(--text)', height:22, display:'flex', alignItems:'center' }}>{st.v}</div>
                          <div style={{ fontSize:9, color:'var(--text4)', marginTop:1 }}>{st.k}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          };
          if (isLoading) return Array.from({length:5}).map((_,i) => <SkeletonPlayerCard key={i}/>);
          // 선수 편집에서 정한 사용자 순서를 그대로 따른다.
          const ordered = byOrder(filtered, playerOrder, p => p.id);
          if (filter !== '전체') return ordered.map(renderCard);
          // Grouped rendering for 전체
          const SPORT_ICON = { '축구':'⚽', '야구':'⚾', '배드민턴':'🏸' };
          const grouped = {};
          for (const p of ordered) {
            (grouped[p.sport] = grouped[p.sport] || []).push(p);
          }
          // 사용자 종목 순서 → 거기에 없는 종목은 뒤에 붙인다.
          const SPORT_ORDER = [...sportOrder, ...Object.keys(grouped).filter(s => !sportOrder.includes(s))];
          return SPORT_ORDER.filter(s => grouped[s]?.length).map(sport => (
            <React.Fragment key={sport}>
              <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:6, marginBottom:-2, paddingLeft:2 }}>
                <span style={{ fontSize:14 }}>{SPORT_ICON[sport]}</span>
                <span style={{ fontSize:11, fontWeight:700, color:'var(--text3)', letterSpacing:1, textTransform:'uppercase' }}>{sport}</span>
                <span style={{ fontSize:10, color:'var(--text5)', fontWeight:600 }}>{grouped[sport].length}명</span>
              </div>
              {grouped[sport].map(renderCard)}
            </React.Fragment>
          ));
        })()}
        {!isLoading && (
          <SuggestPlayersBanner followed={followed} onToggleFollow={onToggleFollow}
                                onAdd={onAdd} sportFeeds={sportFeeds} filter={filter}
                                sportOrder={sportOrder}/>
        )}
      </div>
      <div style={{ height:'calc(96px + env(safe-area-inset-bottom))' }}/>
      </div>
    </div>
  );
}

// ─── SCREEN: NOTIFICATIONS ───────────────────────────────────
const stripLeadEmoji = (t) => String(t || '').replace(/^[^\w가-힣]+/, '').trim();
// Capacitor(iOS)는 APNs 페이로드 **전체**를 notification.data 에 담는다. 우리가 보낸
// 커스텀 필드는 그 안에 한 겹 더 들어 있다: { aps: {...}, data: { key, matchId } }.
// 그동안 notif.data.matchId 를 읽어 항상 undefined 였고, 그래서 알림을 눌러도
// id 로는 경기를 못 찾고 제목·본문의 팀명 매칭에만 기대고 있었다.
// (혹시 평평하게 오는 경로가 생겨도 되도록 양쪽을 다 본다.)
const pushPayload = (notif) => {
  const d = notif && notif.data;
  if (!d || typeof d !== 'object') return {};
  return (d.data && typeof d.data === 'object') ? d.data : d;
};
const pushIcon = (key, title) => { const k = String(key || ''); if (/goal/i.test(k)) return '⚽'; if (/start/i.test(k)) return '🏟️'; if (/result|end|final/i.test(k)) return '🏁'; const m = String(title || '').trim().match(/^([^\w\s가-힣])/); return (m && m[1]) || '🔔'; };
function NotifScreen({ notifications, onMatch }) {
  const notifs = notifications;
  return (
    <div style={{ flex:1, overflow:'auto', background:'var(--bg)' }} className="scrollbar-hide">
      {notifs.length === 0 ? (
        <div style={{ textAlign:'center', padding:'60px 20px', color:'var(--text4)' }}>
          <div style={{ fontSize:48, marginBottom:16 }}>🔔</div>
          <div style={{ fontSize:15, fontWeight:600, marginBottom:6 }}>알림이 없습니다</div>
          <div style={{ fontSize:13 }}>한국 선수의 특이사항이 생기면 알려드릴게요</div>
        </div>
      ) : (

    // 기본값(50% 50%)이 위아래를 똑같이 깎아 머리가 잘린다(목만 남는 사진).
    // 원본이 박스보다 세로로 길 때만 위쪽으로 당겨 얼굴을 살린다 — 가로로 긴
    // 사진은 좌우가 깎이는 것이라 그대로 두는 게 맞다.
    return (
      <img
        src={imgSrc}
        alt=""
        style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition:'50% 50%' }}
        onLoad={e => {
          const img = e.target;
          // 레이아웃이 아직 안 잡혔으면(높이 0) 판단하지 않는다 — 잘못된 비율로
          // 엉뚱하게 당겨질 수 있다.
          if (img.clientHeight < 10 || !img.naturalHeight) return;
          const nat = img.naturalWidth / img.naturalHeight;
          const box = img.clientWidth / img.clientHeight;
          if (nat < box * 0.95) {
            // 세로로 잘리는 정도에 비례해 위로 당긴다(최대 20%). 인물 사진의
            // 얼굴은 대체로 상단 1/3 안에 있다.
            const excess = Math.min(1, (box - nat) / box);      // 0~1
            img.style.objectPosition = `50% ${Math.round(50 - 30 * excess)}%`;
          }
        }}
        onError={e => { e.target.style.display='none'; }}
      />
    );
  }

// 외부 링크: 네이티브에선 인앱 브라우저(SFSafariViewController)로, 웹에선 새 탭.
// 앱 밖(Safari)으로 튕기지 않아 돌아오기가 자연스럽다.
// 탭 화면은 상세로 들어갈 때 언마운트된다 — 스크롤 위치를 기억했다가 돌아오면 복원.
const SCROLL_MEM = {};
function useScrollMemory(key, ref) {
  React.useLayoutEffect(() => {
    const el = ref.current;
    const saved = SCROLL_MEM[key];
    if (el && saved) {
      el.scrollTop = saved;
      // 데이터가 늦게 채워져 높이가 아직 모자란 경우를 위해 몇 프레임 더 시도
      let tries = 0;
      const retry = () => {
        if (!ref.current || tries++ > 8) return;
        if (Math.abs(ref.current.scrollTop - saved) > 2 && ref.current.scrollHeight > saved) {
          ref.current.scrollTop = saved;
        }
        requestAnimationFrame(retry);
      };
      requestAnimationFrame(retry);
    }
    return () => { if (ref.current) SCROLL_MEM[key] = ref.current.scrollTop; };
  }, [key]);
}

function openExternal(url) {
  // 네이티브(iOS): 시트로 띄우는 커스텀 핸들러 — 아래에서 위로 올라오고
  // 아래로 스와이프해 닫힌다. @capacitor/browser 는 fullScreen/popover 만
  // 지원해 스와이프 닫기가 안 되므로 MainViewController 쪽에서 처리한다.
  const mh = window.webkit?.messageHandlers?.openurl;
  if (mh) { mh.postMessage(url); return; }
  const B = window.Capacitor?.Plugins?.Browser;
  if (B) { B.open({ url }); return; }
  window.open(url, '_blank', 'noopener');
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  return Math.floor(diff/86400) + '일 전';
}

// 새로고침할 때마다 다른 조합을 보여준다.
// 예전엔 최신순 정렬 후 상위 40개를 그대로 썼기 때문에, 새로고침해도(재조회는 됐다)
// 같은 기사가 같은 순서로 나왔다. 필터링된 풀은 40개보다 크므로
//  ① 선수별 라운드로빈 — 한 선수 기사가 상단을 독식하지 않게 섞고
//  ② 새로고침 회차(seed)만큼 각 선수 큐와 선수 순서를 회전 — 매번 다른 기사가 위로
// 올라오고, 그동안 안 보였던 기사도 노출된다.
function curateNews(pool, seed, limit) {
  const byPlayer = new Map();
  for (const a of pool) {
    const k = a.player || '기타';
    if (!byPlayer.has(k)) byPlayer.set(k, []);
    byPlayer.get(k).push(a);
  }
  const rot = (arr, n) => (arr.length ? [...arr.slice(n % arr.length), ...arr.slice(0, n % arr.length)] : arr);
  // 선수 큐는 회차당 3칸씩 밀어 새 기사가 더 많이 올라오게 하고,
  // 선수 순서는 1칸씩 돌려 상단에 오는 선수를 바꾼다.
  const queues = rot([...byPlayer.values()].map(q => rot(q, seed * 3)), seed);
  const seen = new Set(), out = [];
  for (let i = 0; out.length < limit; i++) {
    let progressed = false;
    for (const q of queues) {
      const a = q[i];
      if (!a) continue;
      progressed = true;
      const key = `${a.title}|${a.link}`;
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(a);
      if (out.length >= limit) break;
    }
    if (!progressed) break;   // 모든 큐 소진
  }
  return out;
}
