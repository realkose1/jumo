    return () => { clearInterval(iv); if (timer.current) clearTimeout(timer.current); flush(); };
  }, [mid, fetchCounts, flush]);

  const total = counts.home + counts.away;
  const hShare = total > 0 ? Math.max(0.28, Math.min(0.72, counts.home / total)) : 0.5;
  const hPct = hShare * 100;
  // Prefer team-logo colors; fall back to the brand-map/hash derivation while the
  // logos load or if extraction fails (CORS, monochrome, or no logo URL).
  const fallbackColors = React.useMemo(() => deriveCardColors(match.home, match.away), [match.home, match.away]);
  const [logoHsl, setLogoHsl] = React.useState({ home: null, away: null });
  React.useEffect(() => {
    let alive = true;
    Promise.all([extractLogoHSL(match.home?.logo), extractLogoHSL(match.away?.logo)])
      .then(([h, a]) => { if (alive) setLogoHsl({ home: h, away: a }); });
    return () => { alive = false; };
  }, [match.home?.logo, match.away?.logo]);
  const { homeColor, awayColor } = React.useMemo(() => {
    let homeColor = cardFromHSL(logoHsl.home) || fallbackColors.homeColor;
    let awayColor = cardFromHSL(logoHsl.away) || fallbackColors.awayColor;
    // Both hues from logos and nearly identical → deepen the away side so the two read distinct.
    if (logoHsl.home && logoHsl.away && hueDist(logoHsl.home.h, logoHsl.away.h) < 16) {
      awayColor = cardFromHSL(logoHsl.away, 20);
    }
    return { homeColor, awayColor };
  }, [logoHsl, fallbackColors]);
  const statusText = isFinished ? '종료' : (isLive ? 'LIVE' : 'VS');
  const statusColor = isLive ? 'var(--acc)' : 'rgba(255,255,255,0.6)';

  const renderSide = (team, t, alignRight) => (
    <button onClick={() => tap(team)} aria-label={`${t.name} 응원`}
      style={{ width:`calc(${team === 'home' ? hPct : 100 - hPct}% - 3px)`, transition:'width 0.45s cubic-bezier(.4,0,.2,1)',
        flexShrink:0, height:'100%', position:'relative', overflow:'hidden', cursor:'pointer', WebkitTapHighlightColor:'transparent',
        background: team === 'home' ? homeColor : awayColor, border:'none', borderRadius:14, padding:'10px 13px',
        display:'flex', flexDirection:'column', justifyContent:'space-between', alignItems: alignRight ? 'flex-end' : 'flex-start' }}>
      <TeamBadge code={t.code} size={26} logo={t.logo}/>
      <span key={counts[team]} style={{ ...NUM, fontSize:20, fontWeight:800, color:'#fff', lineHeight:1, letterSpacing:-0.5, animation:'cheerPop 0.25s ease' }}>{counts[team].toLocaleString()}</span>
      {floats.filter(f => f.team === team).map(f => (
        <span key={f.id} style={{ position:'absolute', bottom:30, [alignRight ? 'right' : 'left']:16, ...NUM, fontSize:15, fontWeight:800, color:'#fff', pointerEvents:'none', animation:'cheerFloat 0.7s ease-out forwards' }}>+1</span>
      ))}
    </button>
  );

  return (
    <div style={{ marginTop:20 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10 }}>
        <div style={{ fontSize:12, color:'var(--text3)', fontWeight:600 }}>팀 응원</div>
        <div style={{ fontSize:11, color:'var(--text5)' }}>탭해서 응원 · {total.toLocaleString()}</div>
      </div>
      <div style={{ position:'relative', display:'flex', gap:6, height:74 }}>
        {renderSide('home', match.home, false)}
        {renderSide('away', match.away, true)}
        <div style={{ position:'absolute', left:`${hPct}%`, top:'50%', transform:'translate(-50%,-50%)', zIndex:3,
          background:'rgba(10,10,12,0.82)', backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)',
          border:'0.5px solid rgba(255,255,255,0.14)', borderRadius:11, padding:'4px 10px', fontSize:11, fontWeight:800,
          letterSpacing:0.3, color:statusColor, whiteSpace:'nowrap', transition:'left 0.45s cubic-bezier(.4,0,.2,1)',
          display:'flex', alignItems:'center', gap:4 }}>
          {isLive && <span style={{ width:5, height:5, borderRadius:'50%', background:'var(--acc)', display:'inline-block' }}/>}
          {statusText}
        </div>
      </div>
    </div>
  );
}

// ─── 팀 상세용 공유 캐시 ───────────────────────────────────────
// 목적은 하나다: 같은 팀을 여러 사용자가 열어도 API-Football 호출이 한 번만 나가게.
// 메모리 캐시 → Supabase sf_cache(기기 간 공유) → 네트워크 순으로 내려가고,
// 캐시가 신선하면 네트워크는 아예 타지 않는다.
// sf_cache 는 기존 'af-detail-{id}' 관례를 그대로 따른다(date=문자열 키, events=jsonb).
//   af-team-{teamId}                 30일   국가·창단·홈구장 — 거의 안 바뀜
//   af-teamfix-{teamId}-{season}     6시간  시즌 일정/결과
//   af-squad-{teamId}                7일    스쿼드
//   af-standings-{leagueId}-{season} 1시간  리그 순위
const TEAM_TTL = {
  team: 30 * 24 * 3600e3,
  fixtures: 6 * 3600e3,
  squad: 7 * 24 * 3600e3,
  standings: 3600e3,
};
const teamCacheMem = {};   // key → { data, at }
// slim: 네트워크 응답을 화면에 필요한 필드만 남기는 변환(캐시에도 이 형태로 저장).
async function afCachedResponse(key, ttl, query, slim) {
  let stale = teamCacheMem[key] || null;
  if (stale && Date.now() - stale.at < ttl) return stale.data;
  try {
    const r = await SB.from('sf_cache').select('date,events,updated_at').eq('date', key).limit(1);
    const row = (r && r.data || [])[0];
    if (row && row.events != null) {
      const at = new Date(row.updated_at).getTime();
      if (!stale || at > stale.at) { stale = { data: row.events, at }; teamCacheMem[key] = stale; }
      if (Date.now() - at < ttl) return stale.data;
    }
  } catch (e) { /* 공유 캐시를 못 읽으면 네트워크로 간다 */ }
  const j = await afFetch(query).catch(() => null);
  const resp = j && Array.isArray(j.response) ? j.response : null;
  // afFetch 는 한도 초과·오류를 null 로 준다 — 그럴 땐 만료된 캐시라도 보여준다.
  if (resp == null) return stale ? stale.data : null;
  const data = slim ? slim(resp) : resp;
  teamCacheMem[key] = { data, at: Date.now() };
  SB.from('sf_cache').upsert({ date: key, events: data, updated_at: new Date().toISOString() })
    .then(() => {}, () => {});
  return data;
}

// 탭이 처음 열릴 때 한 번만 부른다. data === null 이면 '불러올 수 없음'.
function useLazyAf(active, run) {
  const [st, setSt] = React.useState({ loading: false, data: null, done: false });
  const started = React.useRef(false);
  const runRef = React.useRef(run);
  runRef.current = run;
  React.useEffect(() => {
    if (!active || started.current) return;
    started.current = true;
    let alive = true;
    setSt({ loading: true, data: null, done: false });
    Promise.resolve().then(() => runRef.current())
      .then(d => { if (alive) setSt({ loading: false, data: d, done: true }); })
      .catch(() => { if (alive) setSt({ loading: false, data: null, done: true }); });
    return () => { alive = false; };
  }, [active]);
  return st;
}

function TeamLoading() {
  return (
    <div style={{ display:'flex', justifyContent:'center', padding:'48px 0' }}>
      <div style={{ width:24, height:24, borderRadius:'50%', border:'2.5px solid var(--border)', borderTopColor:'var(--acc)', animation:'spin 0.8s linear infinite' }}/>
    </div>
  );
}
function TeamEmpty({ text }) {
  return <div style={{ textAlign:'center', padding:'40px 0', color:'var(--text5)', fontSize:14 }}>{text}</div>;
}

// 이름 표기가 소스마다 뒤집힌다('Son Heung-min' vs 'Heung-Min Son').
// 알파벳 토큰을 정렬해 붙인 키로 비교하면 순서·하이픈 차이를 흡수한다.
const teamNameKey = (s) => (s || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim().split(' ').filter(Boolean).sort().join('');
const KOREAN_BY_NAME_KEY = new Map(
  ALL_PLAYERS.filter(p => p.nameEn).map(p => [teamNameKey(p.nameEn), p])
);
const AF_FINAL_SHORT = new Set(['FT', 'AET', 'PEN']);
const SQUAD_POS = [
  ['Goalkeeper', '골키퍼'], ['Defender', '수비수'],
  ['Midfielder', '미드필더'], ['Attacker', '공격수'],
];

// ─── SCREEN: TEAM DETAIL ──────────────────────────────────────
// 경기 상세에서 팀을 누르면 열린다. 팀 id 는 API-Football 경기에만 실려 있어
// 야구(statsapi)·ESPN 경기에서는 진입 자체가 막혀 있다(의도된 동작).
function TeamScreen({ team, onBack, onMatch, liveApiMatches = [] }) {
  const teamId = team.id;
  // 시즌은 경기가 실어 온 league.season 을 그대로 쓴다. 없으면 날짜에서 유도.
  const season = team.season || afSeasonFor({});
  const hasLeague = !!(team.leagueId && season);
  const [tab, setTab] = React.useState('overview');

  // 개요는 진입 즉시, 나머지는 탭을 눌러야 부른다.
  const info = useLazyAf(true, () => afCachedResponse(
    `af-team-${teamId}`, TEAM_TTL.team, `path=teams&id=${teamId}`));

  const fixtures = useLazyAf(tab === 'fixtures', () => afCachedResponse(
    `af-teamfix-${teamId}-${season}`, TEAM_TTL.fixtures,
    `path=fixtures&team=${teamId}&season=${season}`,
    // 시즌 전체 응답은 꽤 크다 — 화면에 쓰는 필드만 남겨 캐시에 넣는다.
    (resp) => resp.map(fx => ({
      id: fx.fixture && fx.fixture.id,
      date: fx.fixture && fx.fixture.date,
      short: (fx.fixture && fx.fixture.status && fx.fixture.status.short) || 'NS',
      league: (fx.league && fx.league.name) || '',
      home: { id: fx.teams?.home?.id, name: fx.teams?.home?.name || '', logo: fx.teams?.home?.logo || null },
      away: { id: fx.teams?.away?.id, name: fx.teams?.away?.name || '', logo: fx.teams?.away?.logo || null },
      goals: { home: fx.goals?.home ?? null, away: fx.goals?.away ?? null },
    }))));

  const squad = useLazyAf(tab === 'squad', () => afCachedResponse(
    `af-squad-${teamId}`, TEAM_TTL.squad, `path=players/squads&team=${teamId}`,
    (resp) => (resp?.[0]?.players || []).map(p => ({
      id: p.id, name: p.name || '', number: p.number ?? null, position: p.position || '', age: p.age ?? null,
    }))));

  const standings = useLazyAf(tab === 'standings' && hasLeague, () => afCachedResponse(
    `af-standings-${team.leagueId}-${season}`, TEAM_TTL.standings,
    `path=standings&league=${team.leagueId}&season=${season}`,
    // 컵대회는 조별로 표가 여러 개다 — 이 팀이 속한 조를 고른다.
    (resp) => {
      const groups = resp?.[0]?.league?.standings || [];
      const rows = groups.find(g => (g || []).some(r => r.team?.id === teamId)) || groups[0] || [];
      return rows.map(r => ({
        rank: r.rank, id: r.team?.id, name: r.team?.name || '', logo: r.team?.logo || null,
        played: r.all?.played ?? 0, win: r.all?.win ?? 0, draw: r.all?.draw ?? 0, lose: r.all?.lose ?? 0,
        gd: r.goalsDiff ?? 0, pts: r.points ?? 0,
      }));
    }));

  const tabs = [
    { id: 'overview', label: '개요' },
    { id: 'fixtures', label: '경기' },
    { id: 'squad', label: '스쿼드' },
    // 순위표가 없는 하위 리그·컵(EFL 트로피, PL2 등)은 리그 id 자체가 없을 수 있다.
    ...(hasLeague ? [{ id: 'standings', label: '순위' }] : []),
  ];

  // 우리 앱 경기 목록(한국 선수가 뛰는 경기)에 있는 경기만 상세로 넘길 수 있다.
  const appMatchFor = (f) => liveApiMatches.find(m => String(m.id) === String(f.id)) || null;

  const card = { background:'var(--surface)', borderRadius:16, border:'0.5px solid var(--border)', overflow:'hidden' };

  const renderFixtureRow = (f, i, last) => {
    const isHome = f.home.id === teamId;
    const opp = isHome ? f.away : f.home;
    const d = f.date ? new Date(f.date) : null;
    const md = d ? `${d.getMonth() + 1}.${d.getDate()}` : '';
    const hm = d ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : '';
    const done = AF_FINAL_SHORT.has(f.short);
    const my = isHome ? f.goals.home : f.goals.away;
    const their = isHome ? f.goals.away : f.goals.home;
    const result = my == null || their == null ? '' : my > their ? '승' : my < their ? '패' : '무';
    const resultColor = result === '승' ? 'var(--acc)' : result === '패' ? 'var(--text4)' : 'var(--text3)';
    const mm = appMatchFor(f);
    return (
      <div key={f.id || i} onClick={mm ? () => onMatch && onMatch(mm) : undefined}
        style={{ display:'flex', alignItems:'center', gap:10, padding:'11px 14px',
                 borderBottom: last ? 'none' : '0.5px solid var(--border)',
                 cursor: mm ? 'pointer' : 'default' }}>
        <span style={{ ...NUM, fontSize:11, color:'var(--text4)', width:34, flexShrink:0 }}>{md}</span>
        <TeamBadge code={(opp.name || '').slice(0, 3).toUpperCase()} size={20} logo={opp.logo}/>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'var(--text)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
            <span style={{ color:'var(--text4)', fontWeight:500, marginRight:4 }}>{isHome ? '홈' : '원정'}</span>{opp.name}
          </div>
          {f.league && <div style={{ fontSize:10, color:'var(--text4)', marginTop:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{f.league}</div>}
        </div>
        {done ? (
          <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
            <span style={{ ...NUM, fontSize:13, fontWeight:700, color:'var(--text)' }}>{my}:{their}</span>
            {result && <span style={{ fontSize:10, fontWeight:700, color:resultColor }}>{result}</span>}
          </div>
        ) : (
          <span style={{ ...NUM, fontSize:12, color:'var(--text3)', flexShrink:0 }}>{hm}</span>
        )}
      </div>
    );
  };

  return (
    <div style={{ flex:1, overflow:'auto', background:'var(--bg)' }} className="scrollbar-hide screen-slide-in">
      {/* Header */}
      <div style={{ background:'var(--bg2)', padding:'12px 20px 20px' }}>
        <BackBtn onBack={onBack} nativeHandled/>
        <div style={{ display:'flex', alignItems:'center', gap:14, marginTop:14 }}>
          <TeamBadge code={team.code || (team.name || '').slice(0, 3).toUpperCase()} size={56} logo={team.logo}/>
          <div style={{ minWidth:0 }}>
            <div style={{ fontSize:22, fontWeight:800, color:'var(--text)', letterSpacing:-0.5 }}>{team.name}</div>
            {team.competition && <div style={{ fontSize:12, color:'var(--text3)', marginTop:3 }}>{team.competition}</div>}
          </div>
        </div>
      </div>

      <GlassSegmented sticky active={tab} onChange={setTab} tabs={tabs}/>

      {/* 개요 */}
      {tab === 'overview' && (
        <div style={{ padding:'4px 16px 28px' }}>
          {info.loading ? <TeamLoading/> : !info.data ? <TeamEmpty text="불러올 수 없어요"/> : (() => {
            const t = info.data[0]?.team;
            const v = info.data[0]?.venue;
            if (!t) return <TeamEmpty text="팀 정보가 없어요"/>;
            const rows = [
              ['국가', t.country],
              ['창단', t.founded ? `${t.founded}년` : ''],
              ['홈구장', v?.name],
              ['도시', v?.city],
              ['수용 인원', v?.capacity ? `${Number(v.capacity).toLocaleString()}명` : ''],
            ].filter(r => r[1]);
            if (!rows.length) return <TeamEmpty text="팀 정보가 없어요"/>;
            return (
              <div style={card}>
                {rows.map(([k, val], i) => (
                  <div key={k} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:12, padding:'13px 16px', borderBottom: i === rows.length - 1 ? 'none' : '0.5px solid var(--border)' }}>
                    <span style={{ fontSize:12, color:'var(--text4)', fontWeight:600 }}>{k}</span>
                    <span style={{ fontSize:13, color:'var(--text)', fontWeight:600, textAlign:'right' }}>{val}</span>
                  </div>
                ))}
              </div>
            );
          })()}
        </div>
      )}

      {/* 경기 */}
      {tab === 'fixtures' && (
        <div style={{ padding:'4px 16px 28px' }}>
          {fixtures.loading ? <TeamLoading/> : !fixtures.data ? <TeamEmpty text="불러올 수 없어요"/> : (() => {
            const all = fixtures.data;
            const ts = (f) => (f.date ? new Date(f.date).getTime() : 0);
            const recent = all.filter(f => AF_FINAL_SHORT.has(f.short)).sort((a, b) => ts(b) - ts(a)).slice(0, 5);
            const next = all.filter(f => !AF_FINAL_SHORT.has(f.short) && ts(f) >= Date.now() - 3 * 3600e3)
              .sort((a, b) => ts(a) - ts(b)).slice(0, 5);
            if (!recent.length && !next.length) return <TeamEmpty text="경기 정보가 없어요"/>;
            const section = (title, list) => list.length > 0 && (
              <div style={{ marginBottom:18 }}>
                <div style={{ fontSize:12, fontWeight:700, color:'var(--text3)', margin:'0 4px 8px' }}>{title}</div>
                <div style={card}>{list.map((f, i) => renderFixtureRow(f, i, i === list.length - 1))}</div>
              </div>
            );
            return <>{section('최근 경기', recent)}{section('다음 경기', next)}</>;
          })()}
        </div>
      )}

      {/* 스쿼드 */}
      {tab === 'squad' && (
        <div style={{ padding:'4px 16px 28px' }}>
          {squad.loading ? <TeamLoading/> : !squad.data ? <TeamEmpty text="불러올 수 없어요"/> : squad.data.length === 0 ? <TeamEmpty text="스쿼드 정보가 없어요"/> : (() => {
            const known = new Set(SQUAD_POS.map(p => p[0]));
            const groups = SQUAD_POS.map(([pos, ko]) => [ko, squad.data.filter(p => p.position === pos)]);
            const others = squad.data.filter(p => !known.has(p.position));
            if (others.length) groups.push(['기타', others]);
            return groups.filter(g => g[1].length).map(([ko, list]) => (
              <div key={ko} style={{ marginBottom:18 }}>
                <div style={{ fontSize:12, fontWeight:700, color:'var(--text3)', margin:'0 4px 8px' }}>{ko}</div>
                <div style={card}>
                  {list.map((p, i) => {
                    // 한국 선수는 브랜드 옐로로 강조한다 — 이 앱의 존재 이유.
                    const kp = KOREAN_BY_NAME_KEY.get(teamNameKey(p.name));
                    return (
                      <div key={p.id || i} style={{ display:'flex', alignItems:'center', gap:12, padding:'11px 14px',
                        borderBottom: i === list.length - 1 ? 'none' : '0.5px solid var(--border)',
                        background: kp ? 'rgba(245,196,0,0.08)' : 'transparent' }}>
                        <span style={{ ...NUM, fontSize:12, fontWeight:700, width:24, textAlign:'center', flexShrink:0, color: kp ? 'var(--acc)' : 'var(--text4)' }}>
                          {p.number ?? '-'}
                        </span>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13, fontWeight:600, color: kp ? 'var(--acc)' : 'var(--text)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                            {kp ? `🇰🇷 ${kp.name}` : p.name}
                          </div>
                          {kp && <div style={{ fontSize:10, color:'var(--text4)', marginTop:1 }}>{p.name}</div>}
                        </div>
                        {p.age != null && <span style={{ ...NUM, fontSize:11, color:'var(--text4)', flexShrink:0 }}>{p.age}세</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            ));
          })()}
        </div>
      )}

      {/* 순위 */}
      {tab === 'standings' && (
        <div style={{ padding:'4px 16px 28px' }}>
          {standings.loading ? <TeamLoading/> : !standings.data ? <TeamEmpty text="불러올 수 없어요"/> : standings.data.length === 0 ? <TeamEmpty text="순위 정보가 없어요"/> : (
            <div style={card}>
              <div style={{ display:'flex', alignItems:'center', gap:8, padding:'9px 12px', borderBottom:'0.5px solid var(--border)', fontSize:10, color:'var(--text4)', fontWeight:600 }}>
                <span style={{ width:18, textAlign:'center', flexShrink:0 }}>#</span>
                <span style={{ flex:1, minWidth:0 }}>팀</span>
                <span style={{ width:22, textAlign:'center', flexShrink:0 }}>경기</span>
                <span style={{ width:48, textAlign:'center', flexShrink:0 }}>승무패</span>
                <span style={{ width:28, textAlign:'right', flexShrink:0 }}>득실</span>
                <span style={{ width:26, textAlign:'right', flexShrink:0 }}>승점</span>
              </div>
              {standings.data.map((r, i) => {
                const me = r.id === teamId;
                return (
                  <div key={r.id || i} style={{ display:'flex', alignItems:'center', gap:8, padding:'9px 12px',
                    borderBottom: i === standings.data.length - 1 ? 'none' : '0.5px solid var(--border)',
                    background: me ? 'rgba(245,196,0,0.10)' : 'transparent' }}>
                    <span style={{ ...NUM, fontSize:11, fontWeight:700, width:18, textAlign:'center', flexShrink:0, color: me ? 'var(--acc)' : 'var(--text4)' }}>{r.rank}</span>
                    <div style={{ flex:1, minWidth:0, display:'flex', alignItems:'center', gap:7 }}>
                      <TeamBadge code={(r.name || '').slice(0, 3).toUpperCase()} size={16} logo={r.logo}/>
                      <span style={{ fontSize:12, fontWeight: me ? 700 : 600, color: me ? 'var(--acc)' : 'var(--text)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{r.name}</span>
                    </div>
                    <span style={{ ...NUM, fontSize:11, color:'var(--text3)', width:22, textAlign:'center', flexShrink:0 }}>{r.played}</span>
                    <span style={{ ...NUM, fontSize:11, color:'var(--text3)', width:48, textAlign:'center', flexShrink:0 }}>{r.win}-{r.draw}-{r.lose}</span>
                    <span style={{ ...NUM, fontSize:11, color:'var(--text3)', width:28, textAlign:'right', flexShrink:0 }}>{r.gd > 0 ? `+${r.gd}` : r.gd}</span>
                    <span style={{ ...NUM, fontSize:12, fontWeight:700, color: me ? 'var(--acc)' : 'var(--text)', width:26, textAlign:'right', flexShrink:0 }}>{r.pts}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── SCREEN: LIVE MATCH DETAIL ────────────────────────────────
function LiveDetailScreen({ match, onBack, liveApiMatches = [], onPlayer, onTeam }) {
  const goKoreanPlayer = React.useCallback((kp) => {
    if (!onPlayer || !kp) return;
    const full = ALL_PLAYERS.find(p => p.name === kp.name);
    if (full) onPlayer(full);
  }, [onPlayer]);
  // 팀 상세는 API-Football 경기에만 있는 팀 id 가 필요하다. 야구·ESPN 경기는
  // id 가 없어 지금처럼 정적으로 남는다.
  const canTeam = React.useCallback((side) => !!(onTeam && side && side.id), [onTeam]);
  const goTeam = React.useCallback((side) => {
    if (!canTeam(side)) return;
    onTeam({ id: side.id, name: side.name, code: side.code, logo: side.logo,
             leagueId: match.leagueId, season: match.leagueSeason, competition: match.competition });
  }, [canTeam, onTeam, match]);
  const [tab, setTab] = React.useState('events');
  const [countdown, setCountdown] = React.useState('');
  // (emoji 응원 리액션 replaced by <TeamCheerMeter/> — see component above)

  const player = ALL_PLAYERS.find(p => p.name === match.koreanPlayer?.name);
  const isLive = match.live;
  const isFinished = match.status === 'STATUS_FINAL' || match.status === 'STATUS_FULL_TIME' || match.status === 'final' || match.status === 'STATUS_END_PERIOD' || match.status === 'STATUS_FINAL_PEN';
  const [lineupsData, setLineupsData] = React.useState(null);
  const [lineupsLoading, setLineupsLoading] = React.useState(false);
  const [statsData, setStatsData] = React.useState(null);
  const [statsLoading, setStatsLoading] = React.useState(false);
  const [incidentsData, setIncidentsData] = React.useState(null);
  const [incidentsLoading, setIncidentsLoading] = React.useState(false);
  const [mlbSummary, setMlbSummary] = React.useState(null);
  const [mlbLoading, setMlbLoading] = React.useState(false);

  const isSoccerMatch = !((match.sport||'').includes('MLB') || (match.sport||'').includes('⚾'));
  const isMLBMatch = !isSoccerMatch;

  // MLB summary covers events + stats + lineups in one shot
  React.useEffect(() => {
    if (!isMLBMatch || mlbSummary || !(tab === 'events' || tab === 'stats' || tab === 'lineups')) return;
    if (!(isFinished || isLive)) return;
    setMlbLoading(true);
    fetch(`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event=${match.id}`)
      .then(r => r.ok ? r.json() : null)
      .then(data => { setMlbSummary(data); setMlbLoading(false); })
      .catch(() => { setMlbLoading(false); });
  }, [tab, match.id, isFinished, isLive, isMLBMatch]);

  // Transform API-Football detail responses → the shared match-event shape that
  // the existing renderers below already expect. This keeps the rendering JSX untouched.
  const transformAfEvents = (afResp) => {
    if (!Array.isArray(afResp)) return null;
    const incidents = afResp.map(e => {
      const isHome = e.team?.name === match.home.name;
      const base = { time: e.time?.elapsed, addedTime: e.time?.extra ?? undefined, isHome };
      if (e.type === 'Goal') {
        let cls = 'normal';
        if (e.detail === 'Own Goal') cls = 'ownGoal';
        else if (e.detail === 'Penalty') cls = 'penalty';
        else if (e.detail === 'Missed Penalty') cls = 'missedPenalty';
        return { ...base, incidentType: 'goal', incidentClass: cls,
          player: { name: e.player?.name }, assist1: e.assist?.name ? { name: e.assist.name } : null };
      }
      if (e.type === 'Card') {
        let cls = 'yellow';
        if (e.detail === 'Red Card') cls = 'red';
        else if (e.detail === 'Second Yellow card') cls = 'yellowRed';
        return { ...base, incidentType: 'card', incidentClass: cls,
          player: { name: e.player?.name }, reason: e.comments || '' };
      }
      if (e.type === 'subst') {
        // API-Football: player = coming OFF (OUT), assist = coming ON (IN)
        return { ...base, incidentType: 'substitution',
          playerIn: { name: e.assist?.name }, playerOut: { name: e.player?.name } };
      }
      if (e.type === 'Var') {
        return { ...base, incidentType: 'varDecision', text: e.detail || '' };
      }
      return null;
    }).filter(Boolean);
    return { incidents };
  };

  const transformAfLineups = (afLineupsResp, afPlayersResp) => {
    if (!Array.isArray(afLineupsResp) || afLineupsResp.length === 0) return null;
    const ratingMap = new Map();
    (afPlayersResp || []).forEach(team => {
      (team.players || []).forEach(entry => {
        const id = entry.player?.id;
        const r = (entry.statistics || [{}])[0]?.games?.rating;
        if (id != null && r != null) ratingMap.set(id, r);
      });
    });
    const mapTeam = (afTeam) => {
      if (!afTeam) return null;
      const mapPlayer = (e, sub) => ({
        player: { name: e.player?.name, jerseyNumber: e.player?.number, id: e.player?.id,
                  grid: e.player?.grid || null, pos: e.player?.pos || null },
        substitute: sub,
        statistics: ratingMap.has(e.player?.id) ? { rating: ratingMap.get(e.player.id) } : {},
      });
      return {
        formation: afTeam.formation,
        players: [
          ...(afTeam.startXI || []).map(e => mapPlayer(e, false)),
          ...(afTeam.substitutes || []).map(e => mapPlayer(e, true)),
        ],
      };
    };
    const home = afLineupsResp.find(t => t.team?.name === match.home.name) || afLineupsResp[0];
    const away = afLineupsResp.find(t => t.team?.name === match.away.name) || afLineupsResp[1];
    return { home: mapTeam(home), away: mapTeam(away) };
  };

  const transformAfStats = (afResp) => {
    if (!Array.isArray(afResp) || afResp.length === 0) return null;
    const home = afResp.find(t => t.team?.name === match.home.name) || afResp[0];
    const away = afResp.find(t => t.team?.name === match.away.name) || afResp[1];
    const homeMap = new Map();
    (home?.statistics || []).forEach(s => homeMap.set(s.type, s.value));
    const awayMap = new Map();
    (away?.statistics || []).forEach(s => awayMap.set(s.type, s.value));
    // Translate API-Football stat names to the normalized stat keys that the
    // renderer's STAT_LABELS already covers (점유율, 슈팅, 패스 등).
    const TYPE_MAP = {
      'Ball Possession':'Ball possession', 'Total Shots':'Total shots',
      'Shots on Goal':'Shots on target', 'Shots off Goal':'Shots off target',
      'Blocked Shots':'Blocked shots', 'Fouls':'Fouls', 'Corner Kicks':'Corner kicks',
      'Offsides':'Offsides', 'Yellow Cards':'Yellow cards', 'Red Cards':'Red cards',
      'Goalkeeper Saves':'Goalkeeper saves', 'Total passes':'Passes',
      'Passes accurate':'Accurate passes', 'expected_goals':'Expected goals',
    };
    const order = Object.keys(TYPE_MAP);
    const items = order.filter(k => homeMap.has(k) || awayMap.has(k)).map(k => ({
      name: TYPE_MAP[k],
      home: homeMap.get(k) ?? '',
      away: awayMap.get(k) ?? '',
    }));
    return { statistics: [{ period: 'ALL', groups: [{ groupName: 'Match overview', statisticsItems: items }] }] };
  };


  React.useEffect(() => {
    if (tab !== 'events' || incidentsData || !(isFinished || isLive)) return;
    if (!isSoccerMatch) return;
    setIncidentsLoading(true);
    fetch(`${API_BASE}/api/apifootball?path=fixtures/events&fixture=${match.id}`)
      .then(r => r.ok ? r.json() : null)
      .then(data => { setIncidentsData(transformAfEvents(data?.response)); setIncidentsLoading(false); })
      .catch(() => { setIncidentsLoading(false); });
  }, [tab, match.id, isFinished, isLive]);

  React.useEffect(() => {
    if (tab !== 'lineups' || lineupsData || !isSoccerMatch) return;
    // 예전엔 (isFinished || isLive) 일 때만 받아서, 라인업이 이미 나온 '시작 전'
    // 경기는 카드에 '선발 출전'이 떠도 이 탭은 늘 비어 있었다. 킥오프 6시간
    // 안쪽이면 시작 전에도 받는다(그보다 먼 경기는 어차피 명단이 없다).
    const started = isFinished || isLive;
    const til = match.fullDate ? new Date(match.fullDate).getTime() - Date.now() : Infinity;
    if (!started && !(til < 6 * 3600 * 1000)) return;
    setLineupsLoading(true);
    (async () => {
      const [lineupsJson, playersJson] = await Promise.all([
        afFetch(`path=fixtures/lineups&fixture=${match.id}`).catch(() => null),
        // 평점은 시작한 경기에만 있다 — 시작 전엔 부르지 않는다.
        started
          ? afFetch(`path=fixtures/players&fixture=${match.id}`).catch(() => null)
          : Promise.resolve(null),
      ]);
      let afLineups = lineupsJson?.response;
      // AF 가 아직 안 냈으면 ESPN 으로 — 카드 상태와 같은 소스를 쓴다.
      if (!(afLineups || []).some(t => (t.startXI || []).length)) {
        const espn = await espnLineupsForMatch(match);
        if (espn) afLineups = espn;
      }
      setLineupsData(transformAfLineups(afLineups, playersJson?.response));
      setLineupsLoading(false);
    })().catch(() => setLineupsLoading(false));
  }, [tab, match.id, isFinished, isLive]);

  React.useEffect(() => {
    if (tab !== 'stats' || statsData || !(isFinished || isLive)) return;
    if (!isSoccerMatch) return;
    setStatsLoading(true);
    fetch(`${API_BASE}/api/apifootball?path=fixtures/statistics&fixture=${match.id}`)
      .then(r => r.ok ? r.json() : null)
      .then(data => { setStatsData(transformAfStats(data?.response)); setStatsLoading(false); })
      .catch(() => { setStatsLoading(false); });
  }, [tab, match.id, isFinished, isLive]);

  const typeColor = { goal:'var(--acc)', yellow:'#f5c518', red:'#e03030', assist:'var(--text2)' };

  // Countdown for upcoming matches
  React.useEffect(() => {
    if (!isLive && !isFinished && match.fullDate) {
      const updateCountdown = () => {
        const now = new Date();
        const matchDate = new Date(match.fullDate);
        const diff = matchDate - now;

        if (diff > 0) {
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          setCountdown(`${hours}시간 ${minutes}분 ${seconds}초 뒤 시작`);
        } else {
          setCountdown('곧 시작');
        }
      };

      updateCountdown();
      const interval = setInterval(updateCountdown, 1000);
      return () => clearInterval(interval);
    }
  }, [isLive, isFinished, match.fullDate]);

  // Format time display
  let timeLabel = '';
  let timeValue = match.time || '예정';
  if (!isLive && !isFinished && match.fullDate) {
    const date = new Date(match.fullDate);
    const now = new Date();
    const hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const isToday = date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();

    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const isTomorrow = date.getDate() === tomorrow.getDate() && date.getMonth() === tomorrow.getMonth() && date.getFullYear() === tomorrow.getFullYear();
    if (isToday) {
      timeLabel = hours < 12 ? '오전' : '오후';
    } else if (isTomorrow) {
      timeLabel = '내일';
    } else {
      timeLabel = `${date.getMonth() + 1}월 ${date.getDate()}일`;
    }

    const displayHours = hours > 12 ? hours - 12 : (hours === 0 ? 12 : hours);
    timeValue = `${String(displayHours).padStart(2, '0')}:${minutes}`;
  }

  return (
    <div style={{ flex:1, overflow:'auto', background:'var(--bg)' }} className="scrollbar-hide screen-slide-in">
      {/* Hero */}
      <div style={{ position:'relative', overflow:'hidden', background:'var(--bg2)' }}>
        <div style={{ position:'relative', zIndex:2, padding:'12px 20px 20px' }}>
          <BackBtn onBack={onBack} nativeHandled/>
          <div style={{ display:'flex', alignItems:'center', gap:8, margin:'12px 0 16px', flexWrap:'wrap' }}>
            {isLive && <><LiveDot/><span style={{ fontSize:11, fontWeight:700, color:'var(--acc)', letterSpacing:1.5 }}>LIVE</span></>}
            <span style={{ fontSize:11, color:'var(--text3)' }}>{match.competition}</span>
            {/* 어디서 볼 수 있는지 — 대회의 국내 중계처(확인된 것만) */}
            <BroadcastBadge match={match}/>
            {match.isKoreanDerby && (
              <span style={{ fontSize:10, fontWeight:800, color:'#000', background:'linear-gradient(90deg, var(--acc), #ff8a3d)', borderRadius:6, padding:'3px 8px', letterSpacing:0.5, marginLeft:'auto' }}>
                🇰🇷 코리안 더비
              </span>
            )}
          </div>
          {/* Score block */}
          <div style={{ display:'flex', alignItems:'center', marginBottom:16 }}>
            <div onClick={() => goTeam(match.home)} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:6, cursor: canTeam(match.home) ? 'pointer' : 'default' }}>
              <TeamBadge code={match.home.code} size={44} logo={match.home.logo}/>
              <span style={{ fontSize:12, fontWeight:600, color:'var(--text-70)', textAlign:'center' }}>{match.home.name}</span>
            </div>
            <div style={{ width:100, flexShrink:0, textAlign:'center' }}>
              {isLive ? (
                <>
                  <div style={{ ...NUM, fontSize:52, fontWeight:800, color:'var(--text)', letterSpacing:-3, lineHeight:1 }}>{match.home.score}<span style={{ color:'var(--text4)', fontWeight:400 }}>:</span>{match.away.score}</div>
                  <div style={{ ...NUM, fontSize:14, color:'var(--text3)', marginTop:4, fontWeight:600 }}>{liveTimeLabel(match, match.minute)}</div>
                </>
              ) : isFinished ? (
                <>
                  <div style={{ ...NUM, fontSize:52, fontWeight:800, color:'var(--text)', letterSpacing:-3, lineHeight:1 }}>{match.home.score}<span style={{ color:'var(--text4)', fontWeight:400 }}>:</span>{match.away.score}</div>
                  <div style={{ fontSize:12, color:'var(--text4)', marginTop:4, fontWeight:600 }}>종료</div>
                </>
              ) : (
                <>
                  {countdown && (
                    <div style={{ display:'flex', justifyContent:'center', marginBottom:6 }}>
                      <div style={{ background:'rgba(255,217,61,0.15)', borderRadius:6, padding:'4px 8px', border:'0.5px solid rgba(255,217,61,0.3)', display:'inline-flex', alignItems:'center', justifyContent:'center', lineHeight:1 }}>
                        <span style={{ fontSize:10, fontWeight:600, color:'#FFD93D', whiteSpace:'nowrap', lineHeight:1 }}>{countdown}</span>
                      </div>
                    </div>
                  )}
                  <div style={{ fontSize:20, fontWeight:700, color:'var(--text)', letterSpacing:-0.3 }}>
                    {timeLabel} {timeValue}
                  </div>
                </>
              )}
            </div>
            <div onClick={() => goTeam(match.away)} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:6, cursor: canTeam(match.away) ? 'pointer' : 'default' }}>
              <TeamBadge code={match.away.code} size={44} logo={match.away.logo}/>
              <span style={{ fontSize:12, fontWeight:600, color:'var(--text2)', textAlign:'center' }}>{match.away.name}</span>
            </div>
          </div>
          {/* Korean player highlight */}
          {(() => {
            const koreans = match.koreanPlayers || [match.koreanPlayer];
            const renderKoreanCard = (kp, idx) => {
              const playerObj = ALL_PLAYERS.find(p => p.name === kp.name);
              const injury = playerObj?.injury;
              const eventsGoals = (match.events||[]).filter(e=>e.type==='goal'&&e.player===kp.name).length;
              const eventsAssists = (match.events||[]).filter(e=>e.type==='assist'&&e.player===kp.name).length;
              const goals = (kp.matchGoals != null && kp.matchGoals > 0) ? kp.matchGoals : eventsGoals;
              const assists = (kp.matchAssists != null && kp.matchAssists > 0) ? kp.matchAssists : eventsAssists;
              const pills = [];
              if (goals > 0) pills.push(`⚽ ${goals}골`);
              if (assists > 0) pills.push(`🅰️ ${assists}도움`);
              if (kp.sfRating) pills.push(`★ ${kp.sfRating}`);
              return (
                <div key={idx} onClick={() => goKoreanPlayer(kp)} style={{ background:'rgba(245,196,0,0.08)', borderRadius:10, padding:'10px 14px', border:'0.5px solid rgba(245,196,0,0.3)', display:'flex', alignItems:'center', gap:10, marginTop: idx > 0 ? 8 : 0, cursor: onPlayer ? 'pointer' : 'default' }}>
                  <span style={{ fontSize:18 }}>🇰🇷</span>
                  {(() => {
                    const formattedEvent = formatExpectedEvent(kp, liveApiMatches);
                    // Baseball stat-line detection (e.g. "4타수 2안타 1홈런 2타점")
                    const isStatLine = /\d+타수.+안타/.test(formattedEvent);
                    return (
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                          <div style={{ fontSize:13, fontWeight:700, color:'var(--text)' }}>{kp.name} <span style={{ ...NUM, color:'var(--text4)', fontWeight:400 }}>#{kp.number}</span></div>
                          {kp.event && !isStatLine && (
                            <div style={{ background: isMutedEvent(kp.event) ? 'transparent' : isLive ? 'rgba(230,48,48,0.1)' : 'var(--btn-bg)', borderRadius:6, padding:'3px 7px', flexShrink:0, display:'inline-flex', alignItems:'center', justifyContent:'center' }}>
                              <span style={{ fontSize:10, fontWeight: isMutedEvent(kp.event) ? 500 : 600, color: isMutedEvent(kp.event) ? 'var(--text4)' : isLive ? 'var(--acc)' : 'var(--text2)', whiteSpace:'nowrap', lineHeight:1 }}>{formattedEvent}</span>
                            </div>
                          )}
                          {injury && (() => { const s = injuryStyle(injury); return (
                            <span style={{ fontSize:10, fontWeight:700, padding:'3px 7px', borderRadius:6, background:s.bg, color:s.fg, border:`0.5px solid ${s.bd}`, whiteSpace:'nowrap', lineHeight:1, flexShrink:0 }}><span style={{ color:s.ic, fontWeight:900, marginRight:4 }}>{s.icon}</span>{injury.label}</span>
                          ); })()}
                          {pills.map((p, i) => (
                            <span key={i} style={{ fontSize:10, fontWeight:700, padding:'3px 7px', borderRadius:6, background:'rgba(245,196,0,0.15)', color:'var(--acc)', border:'0.5px solid rgba(245,196,0,0.3)', whiteSpace:'nowrap', lineHeight:1, flexShrink:0 }}>{p}</span>
                          ))}
                        </div>
                        {isStatLine ? (
                          <div style={{ fontSize:15, fontWeight:800, color:'var(--acc)', marginTop:5, letterSpacing:-0.2 }}>{formattedEvent}</div>
                        ) : (
                          <div style={{ fontSize:11, color:'var(--text3)', fontWeight:500, marginTop:1 }}>{kp.team}</div>
                        )}
                        {isStatLine && (
                          <div style={{ fontSize:10, color:'var(--text4)', fontWeight:500, marginTop:2 }}>{kp.team}</div>
                        )}
                      </div>
                    );
                  })()}
                  {playerObj && (
                    <div style={{ width:44, height:44, borderRadius:'50%', overflow:'hidden', flexShrink:0, border:'2px solid var(--acc)', background:'var(--surface)' }}>
                      <PlayerPhoto player={playerObj} style={{ width:'100%', height:'100%' }} tint="var(--surface)"/>
                    </div>
                  )}
                </div>
              );
            };
            return koreans.map(renderKoreanCard);
          })()}
        </div>
      </div>

      {/* Tabs (liquid glass segmented) */}
      <GlassSegmented sticky active={tab} onChange={setTab}
        tabs={[{id:'events',label:'이벤트'},{id:'stats',label:'통계'},{id:'lineups',label:'라인업'}]}/>

      {/* Events */}
      {tab === 'events' && isMLBMatch && (
        <div style={{ padding:'16px' }}>
          {(() => {
            if (mlbLoading) {
              return <div style={{ display:'flex', justifyContent:'center', padding:'48px 0' }}><div style={{ width:24, height:24, borderRadius:'50%', border:'2.5px solid var(--border)', borderTopColor:'var(--acc)', animation:'spin 0.8s linear infinite' }}/></div>;
            }
            const plays = (mlbSummary?.plays || []).filter(p => p.scoringPlay);
            if (plays.length === 0) {
              return <div style={{ textAlign:'center', padding:'40px 0', color:'var(--text5)', fontSize:14 }}>주요 이벤트가 없습니다</div>;
            }
            const translate = (text) => {
              if (!text) return '';
              let s = text;
              // Hit types & outcomes
              s = s.replace(/\bhomered\b/gi, '홈런');
              s = s.replace(/\bhit a (\d+)-run home run\b/gi, '$1점 홈런');
              s = s.replace(/\bhit a home run\b/gi, '홈런');
              s = s.replace(/\bgrand slam\b/gi, '만루 홈런');
              s = s.replace(/\bdoubled\b/gi, '2루타');
              s = s.replace(/\btripled\b/gi, '3루타');
              s = s.replace(/\bsingled\b/gi, '안타');
              s = s.replace(/\bwalked\b/gi, '볼넷으로 출루');
              s = s.replace(/\bintentionally walked\b/gi, '고의 볼넷');
              s = s.replace(/\bhit by pitch\b/gi, '몸에 맞는 공');
              s = s.replace(/\bsacrificed\b/gi, '희생타');
              s = s.replace(/\bhit a sacrifice fly\b/gi, '희생플라이');
              s = s.replace(/\bhit a sacrifice bunt\b/gi, '희생번트');
              s = s.replace(/\bstruck out swinging\b/gi, '헛스윙 삼진');

              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 }}>
                <span style={{ ...NUM, fontSize:13, fontWeight:700, color: koreanIsAway ? 'var(--text2)' : 'var(--acc)', minWidth:50 }}>{homeStr}</span>
                <span style={{ fontSize:11, color:'var(--text3)', fontWeight:600 }}>{label}</span>
                <span style={{ ...NUM, fontSize:13, fontWeight:700, color: koreanIsAway ? 'var(--acc)' : 'var(--text2)', minWidth:50, textAlign:'right' }}>{awayStr}</span>
              </div>
              <div style={{ display:'flex', height:5, gap:2, background:'transparent' }}>
                {koreanIsAway ? (
                  <>
                    <div style={{ flex:1, height:'100%', background:'var(--border)', borderRadius:3 }}/>
                    <div style={{ width:`${awayPct}%`, height:'100%', background:'var(--acc)', borderRadius:3, transition:'width 0.6s ease' }}/>
                  </>
                ) : (
                  <>
                    <div style={{ width:`${homePct}%`, height:'100%', background:'var(--acc)', borderRadius:3, transition:'width 0.6s ease' }}/>
                    <div style={{ flex:1, height:'100%', background:'var(--border)', borderRadius:3 }}/>
                  </>
                )}
              </div>
            </div>
          );
        };
        return (
          <div style={{ padding:'16px' }}>
            {groups.map((g, gi) => (
              <div key={gi} style={{ marginBottom:18 }}>
                <div style={{ fontSize:11, fontWeight:700, color:'var(--text4)', letterSpacing:1, textTransform:'uppercase', marginBottom:10 }}>{GROUP_LABELS[g.groupName] || g.groupName}</div>
                {(g.statisticsItems || []).map(renderRow)}
              </div>
            ))}
          </div>
        );
      })()}
      {tab === 'lineups' && isMLBMatch && (() => {
        if (mlbLoading) return <div style={{ display:'flex', justifyContent:'center', padding:'48px 0' }}><div style={{ width:24, height:24, borderRadius:'50%', border:'2.5px solid var(--border)', borderTopColor:'var(--acc)', animation:'spin 0.8s linear infinite' }}/></div>;
        const teams = mlbSummary?.boxscore?.players || [];
        if (teams.length < 2) return <div style={{ textAlign:'center', padding:'40px 0', color:'var(--text5)', fontSize:14 }}>라인업 정보가 없습니다</div>;
        const koreanName = match.koreanPlayer?.nameEn || '';
        const norm = s => (s||'').toLowerCase().replace(/[-\s.']/g,'');
        const targetVariants = [norm(koreanName)];
        const parts = koreanName.toLowerCase().split(/[\s-]+/).filter(Boolean);
        if (parts.length >= 2) {
          targetVariants.push(norm(parts.slice(1).join('') + parts[0]));
          targetVariants.push(norm([parts[parts.length-1], ...parts.slice(0,-1)].join('')));
        }
        const isKorean = (n) => { const x = norm(n); return targetVariants.some(t => x === t || x.includes(t) || t.includes(x)); };
        const renderColumn = (matchTeam, teamData) => {
          if (!teamData) return null;
          const battingCat = (teamData.statistics || []).find(s => s.type === 'batting');
          const athletes = battingCat?.athletes || [];
          // Starters by batting order
          const lineup = athletes.filter(a => a.starter).sort((a,b) => (a.batOrder||99) - (b.batOrder||99));
          const bench = athletes.filter(a => !a.starter);
          const renderEntry = (a, i) => {
            const name = a.athlete?.displayName || '';
            const pos = a.position?.abbreviation || '';
            const korean = isKorean(name);
            const keys = battingCat?.keys || [];
            const stats = a.stats || [];
            const get = (k) => {
              const idx = keys.indexOf(k);
              return idx >= 0 ? stats[idx] : '';
            };
            const rawHA = get('hits-atBats');
            const h = get('hits'), ab = get('atBats');
            const summary = (rawHA ? String(rawHA).replace('-', '/') : (h && ab ? `${h}/${ab}` : ''));
            return (
              <div key={i} onClick={korean ? () => goKoreanPlayer(match.koreanPlayer) : undefined} style={{ display:'flex', alignItems:'center', gap:8, padding:'7px 8px', borderRadius:8, background: korean ? 'rgba(245,196,0,0.12)' : 'transparent', border: korean ? '0.5px solid rgba(245,196,0,0.3)' : '0.5px solid transparent', marginBottom:4, cursor: korean && onPlayer ? 'pointer' : 'default' }}>
                <span style={{ ...NUM, fontSize:11, fontWeight:700, color:'var(--text4)', width:24, textAlign:'center', flexShrink:0 }}>{pos}</span>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:12, fontWeight: korean ? 700 : 600, color: korean ? 'var(--acc)' : 'var(--text)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {korean ? `🇰🇷 ${name}` : name}
                  </div>
                </div>
                {summary && summary !== '/' && (
                  <span style={{ ...NUM, fontSize:10, fontWeight:700, color:'var(--text3)', flexShrink:0 }}>{summary}</span>
                )}
              </div>
            );
          };
          return (
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:8 }}>
                <TeamBadge code={matchTeam.code} size={20} logo={matchTeam.logo}/>
                <span style={{ fontSize:12, fontWeight:700, color:'var(--text)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{matchTeam.name}</span>
              </div>
              {lineup.map(renderEntry)}
              {bench.length > 0 && (
                <>
                  <div style={{ fontSize:10, fontWeight:700, color:'var(--text4)', letterSpacing:1, marginTop:12, marginBottom:6, paddingLeft:8 }}>BENCH</div>
                  {bench.slice(0, 8).map(renderEntry)}
                </>
              )}
            </div>
          );
        };
        const homeTeamData = teams.find(t => t.team?.id) ? teams[teams.findIndex(t => t.displayOrder === 0)] || teams[0] : teams[0];
        const awayTeamData = teams.find(t => t.team?.id) ? teams[teams.findIndex(t => t.displayOrder === 1)] || teams[1] : teams[1];
        // ESPN MLB: home is typically displayOrder 0, away 1, but check `homeAway` if available via boxscore.teams instead
        const bsTeams = mlbSummary?.boxscore?.teams || [];
        const homeId = bsTeams.find(t => t.homeAway === 'home')?.team?.id;
        const homeData = teams.find(t => t.team?.id === homeId) || teams[0];
        const awayData = teams.find(t => t.team?.id !== homeId) || teams[1];
        return (
          <div style={{ padding:'14px 12px', display:'flex', gap:10, alignItems:'flex-start' }}>
            {renderColumn(match.home, homeData)}
            <div style={{ width:'0.5px', alignSelf:'stretch', background:'var(--border)', flexShrink:0 }}/>
            {renderColumn(match.away, awayData)}
          </div>
        );
      })()}
      {tab === 'lineups' && !isMLBMatch && (() => {
        if (lineupsLoading) {
          return <div style={{ display:'flex', justifyContent:'center', padding:'48px 0' }}><div style={{ width:24, height:24, borderRadius:'50%', border:'2.5px solid var(--border)', borderTopColor:'var(--acc)', animation:'spin 0.8s linear infinite' }}/></div>;
        }
        const homePlayers = lineupsData?.home?.players || [];
        const awayPlayers = lineupsData?.away?.players || [];
        if (homePlayers.length === 0 && awayPlayers.length === 0) {
          // 시작 전이면 '아직 안 나왔다'와 '끝내 없다'는 전혀 다른 뜻이다.
          // 그냥 '정보 없음'이라고만 쓰면 앱이 못 가져온 것처럼 읽힌다.
          const notStarted = !match.live && match.time !== 'LIVE' && !isFinalStatus(match.status);
          return (
            <div style={{ textAlign:'center', padding:'40px 20px', color:'var(--text5)', fontSize:14, lineHeight:1.6 }}>
              {notStarted ? (
                <>
                  <div style={{ fontWeight:700, color:'var(--text3)', marginBottom:6 }}>라인업 발표 전</div>
                  <div style={{ fontSize:12 }}>경기 시작 직전에 공개됩니다.<br/>나오면 알림으로 알려드릴게요.</div>
                </>
              ) : '라인업 정보가 없습니다'}
            </div>
          );
        }
        // 코리안 더비 대응: 팀별로 그 팀 소속 한국 선수 전원과 매칭한다.
        const allKp = (match.koreanPlayers || [match.koreanPlayer]).filter(Boolean);
        const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,'').trim();
        const findKp = (name, kps) => kps.find(kp => {
          const a = norm(name), b = norm(kp.nameEn || '');
          return !!(a && b && (a === b || a.includes(b) || b.includes(a) || a.split(/\s+/).some(t => b.split(/\s+/).includes(t) && t.length >= 3)));
        }) || null;
        const kpsFor = (team) => allKp.filter(kp => kp.team === team.code);

        const renderTeam = (team, teamData, players) => {
          const starters = players.filter(p => p.substitute === false);
          const subs = players.filter(p => p.substitute === true);
          const kps = kpsFor(team);
          const formation = teamData?.formation;
          const hasGrid = starters.length >= 10 && starters.every(e => e.player?.grid);

          const node = (entry, i, small, onPitch = true) => {
            const p = entry.player || {};
            const kp = findKp(p.name, kps);
            const rating = entry.statistics?.rating;
            const D = small ? 30 : 40;
            return (
              <div key={i} onClick={kp ? () => goKoreanPlayer(kp) : undefined}
                style={{ width: small ? 74 : 78, display:'flex', flexDirection:'column', alignItems:'center', gap:3, cursor: kp && onPlayer ? 'pointer' : 'default' }}>
                <div style={{ position:'relative', width:D, height:D, borderRadius:'50%', background: onPitch ? 'rgba(255,255,255,0.14)' : 'var(--btn-bg)',
                  border: kp ? '2px solid var(--acc)' : (onPitch ? '1.5px solid rgba(255,255,255,0.35)' : '1px solid var(--border2)'),
                  display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden', flexShrink:0 }}>
                  <span style={{ fontSize: small ? 10 : 12, fontWeight:800, color: onPitch ? '#fff' : 'var(--text3)' }}>{p.jerseyNumber || ''}</span>
                  {p.id && <img src={`https://media.api-sports.io/football/players/${p.id}.png`} alt=""
                    onError={e => { e.target.style.display = 'none'; }}
                    style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover' }}/>}
                </div>
                <div style={{ fontSize:9.5, fontWeight: kp ? 800 : 600, color: kp ? 'var(--acc)' : (onPitch ? '#fff' : 'var(--text)'),
                  maxWidth:'100%', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
                  textShadow: onPitch ? '0 1px 2px rgba(0,0,0,0.6)' : 'none' }}>
                  {kp ? `🇰🇷 ${kp.name}` : p.name}
                </div>
                {rating != null && (
                  <span style={{ ...NUM, fontSize:9, fontWeight:800, color:'#000', background:'var(--acc)', borderRadius:5, padding:'1.5px 5px', lineHeight:1 }}>
                    {parseFloat(rating).toFixed(1)}
                  </span>
                )}
              </div>
            );
          };

          let body;
          if (hasGrid) {
            // grid "행:열" — 행1이 GK. 공격 라인이 위, GK가 아래로 오도록 역순 배치.
            const rows = new Map();
            starters.forEach(e => {
              const r = parseInt(e.player.grid.split(':')[0], 10) || 1;
              if (!rows.has(r)) rows.set(r, []);
              rows.get(r).push(e);
            });
            const ordered = [...rows.entries()].sort((a, b) => b[0] - a[0]);
            ordered.forEach(([, list]) => list.sort((a, b) => (parseInt(a.player.grid.split(':')[1],10)||0) - (parseInt(b.player.grid.split(':')[1],10)||0)));
            body = (
              <div style={{ position:'relative', borderRadius:14, overflow:'hidden', padding:'14px 4px',
                background:'linear-gradient(180deg, #17683a 0%, #115530 100%)' }}>
                {/* 피치 라인 */}
                <div style={{ position:'absolute', inset:10, border:'1px solid rgba(255,255,255,0.18)', borderRadius:8, pointerEvents:'none' }}/>
                <div style={{ position:'absolute', left:10, right:10, top:'50%', height:1, background:'rgba(255,255,255,0.14)', pointerEvents:'none' }}/>
                <div style={{ position:'absolute', left:'50%', top:'46%', width:74, height:74, marginLeft:-37, border:'1px solid rgba(255,255,255,0.14)', borderRadius:'50%', pointerEvents:'none' }}/>
                <div style={{ position:'relative', display:'flex', flexDirection:'column', gap:16 }}>
                  {ordered.map(([r, list]) => (
                    <div key={r} style={{ display:'flex', justifyContent:'space-evenly', alignItems:'flex-start' }}>
                      {list.map((e, i) => node(e, `${r}-${i}`, list.length >= 5))}
                    </div>
                  ))}
                </div>
              </div>
            );
          } else {
            // grid가 없는 경기(AF가 좌표를 안 주는 리그)에는 포메이션 문자열이나
            // 포지션(G/D/M/F)으로 라인을 만든다. 둘 다 없으면 그때만 단순 그리드.
            let lines = null;
            const fm = (formation || '').match(/^\d+(-\d+)+$/) ? formation.split('-').map(Number) : null;
            if (fm && fm.reduce((a, b) => a + b, 0) === starters.length - 1) {
              // 포메이션 숫자대로 GK 다음부터 순서대로 끊는다(응답이 GK→수비→… 순).
              lines = [];
              let i = 1;
              fm.forEach(n => { lines.push(starters.slice(i, i + n)); i += n; });
              lines.push([starters[0]]);                       // GK
              lines.reverse();                                  // 공격이 위, GK 최하단
            } else {
              const byPos = { G: [], D: [], M: [], F: [] };
              let ok = true;
              starters.forEach(e => {
                const p = (e.player?.pos || '').toUpperCase();
                if (byPos[p]) byPos[p].push(e); else ok = false;
              });
              if (ok && byPos.G.length === 1 && byPos.D.length && byPos.M.length) {
                lines = [byPos.F, byPos.M, byPos.D, byPos.G].filter(l => l.length);
              }
            }
            body = lines ? (
              <div style={{ position:'relative', borderRadius:14, overflow:'hidden', padding:'14px 4px',
                background:'linear-gradient(180deg, #17683a 0%, #115530 100%)' }}>
                <div style={{ position:'absolute', inset:10, border:'1px solid rgba(255,255,255,0.18)', borderRadius:8, pointerEvents:'none' }}/>
                <div style={{ position:'absolute', left:10, right:10, top:'50%', height:1, background:'rgba(255,255,255,0.14)', pointerEvents:'none' }}/>
                <div style={{ position:'absolute', left:'50%', top:'46%', width:74, height:74, marginLeft:-37, border:'1px solid rgba(255,255,255,0.14)', borderRadius:'50%', pointerEvents:'none' }}/>
                <div style={{ position:'relative', display:'flex', flexDirection:'column', gap:16 }}>
                  {lines.map((list, li) => (
                    <div key={li} style={{ display:'flex', justifyContent:'space-evenly', alignItems:'flex-start' }}>
                      {list.map((e, i) => node(e, `${li}-${i}`, list.length >= 5))}
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              // 포메이션 정보가 아예 없는 경기 — 피치에 임의 배치하면 실제와 다른
              // 대형(4-4-3 등)으로 오해되므로, 3열 격자 '선발 명단'으로 정직하게 보인다.
              <div style={{ background:'var(--surface)', borderRadius:14, padding:'12px 8px 14px', border:'0.5px solid var(--border)' }}>
                <div style={{ fontSize:10, fontWeight:700, color:'var(--text4)', letterSpacing:1, marginBottom:10, textAlign:'center' }}>선발 명단</div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', rowGap:14, columnGap:4, justifyItems:'center' }}>
                  {starters.map((e, i) => node(e, i, true, false))}
                </div>
              </div>
            );
          }
          return (
            <div style={{ marginBottom:18 }}>
              <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:8, paddingLeft:2 }}>
                <TeamBadge code={team.code} size={20} logo={team.logo}/>
                <span style={{ fontSize:13, fontWeight:700, color:'var(--text)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{team.name}</span>
                {formation && <span style={{ ...NUM, fontSize:11, color:'var(--text4)', flexShrink:0 }}>{formation}</span>}
              </div>
              {body}
              {subs.length > 0 && (
                <>
                  <div style={{ fontSize:10, fontWeight:700, color:'var(--text4)', letterSpacing:1, marginTop:10, marginBottom:6, paddingLeft:2 }}>SUBS</div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                    {subs.map((e, i) => {
                      const p = e.player || {};
                      const kp = findKp(p.name, kps);
                      return (
                        <span key={i} onClick={kp ? () => goKoreanPlayer(kp) : undefined}
                          style={{ fontSize:11, fontWeight: kp ? 800 : 500, color: kp ? 'var(--acc)' : 'var(--text2)',
                            background: kp ? 'rgba(245,196,0,0.12)' : 'var(--btn-bg)',
                            border: kp ? '0.5px solid rgba(245,196,0,0.35)' : '0.5px solid transparent',
                            borderRadius:8, padding:'5px 9px', cursor: kp && onPlayer ? 'pointer' : 'default' }}>
                          <span style={{ ...NUM, color: kp ? 'var(--acc)' : 'var(--text4)', fontWeight:700, marginRight:4 }}>{p.jerseyNumber}</span>
                          {kp ? `🇰🇷 ${kp.name}` : p.name}
                        </span>
                      );
                    })}
                  </div>
                </>
              )}
            </div>
          );
        };
        return (
          <div style={{ padding:'14px 12px' }}>
            {renderTeam(match.home, lineupsData?.home, homePlayers)}
            {renderTeam(match.away, lineupsData?.away, awayPlayers)}
          </div>
        );
      })()}

      <div style={{ height:'calc(96px + env(safe-area-inset-bottom))' }}/>
    </div>
  );
}

// ─── SCREEN: PLAYER PROFILE ───────────────────────────────────
function PlayerScreen({ player, onBack, onMatch, liveApiMatches = [], statsCache = {}, followedSet, onToggleFollow, muted = false, onToggleMute }) {
  const [tab, setTab] = React.useState('overview');
  const followed = followedSet ? followedSet.has(player.id) : true;
  const handleFollowClick = () => {
    if (followed) {
      // Confirm before unfollowing
      if (window.confirm(`${player.name} 선수를 팔로우 해제하시겠어요?`)) {
        onToggleFollow?.(player.id);
        onBack?.();
      }
    } else {
      onToggleFollow?.(player.id);
    }
  };
  const [liveStats, setLiveStats] = React.useState(() => statsCache[player.id] || null);
  const [statsLoading, setStatsLoading] = React.useState(!statsCache[player.id]);
  const extra = PLAYER_EXTRA[player.id] || DEFAULT_EXTRA;

  // Fetch real stats on mount
  React.useEffect(() => {
    let cancelled = false;
    setStatsLoading(true);

    const fetchStats = async () => {
      try {
        if (player.sport === '야구' && player.mlbId) {
          const res = await fetch(`${API_BASE}/api/mlb-stats?id=${player.mlbId}`);
          const data = await res.json();
          const stat = data?.stats?.[0]?.splits?.[0]?.stat;
          if (stat && !cancelled) {
            setLiveStats({
              matches: stat.gamesPlayed || 0,
              hits: stat.hits || 0,
              homeRuns: stat.homeRuns || 0,
              rbi: stat.rbi || 0,
              avg: stat.avg || '.000',
              obp: stat.obp || '.000',
              ops: stat.ops || '.000',
            });
          }
        } else if (player.sport === '축구' && player.espnLeague && player.espnId) {
          const res = await fetch(`${API_BASE}/api/espn-player-stats?league=${player.espnLeague}&id=${player.espnId}&season=${afSeasonFor(player)}`);
          const data = await res.json();
          const cats = data?.splits?.categories || [];
          if (cats.length > 0 && !cancelled) {
            const allStats = cats.flatMap(c => c.stats || []);
            const get = (...names) => {
              for (const n of names) {
                const s = allStats.find(s => s.name === n);
                if (s) return parseFloat(s.value) || 0;
              }
              return 0;
            };
            setLiveStats({
              matches:       get('appearances'),
              starts:        get('starts'),
              goals:         get('totalGoals'),
              assists:       get('goalAssists'),
              yellowCards:   get('yellowCards'),
              redCards:      get('redCards'),
              minutes:       get('minutes'),
              shotsTotal:    get('totalShots'),
              shotsOn:       get('shotsOnTarget'),
              keyPasses:     get('shotAssists'),
              tackles:       get('totalTackles'),
              interceptions: get('interceptions'),
            });
          }
        }
      } catch(e) {}
      if (!cancelled) setStatsLoading(false);
    };

    fetchStats();
    return () => { cancelled = true; };
  }, [player.id]);

  // Helper: does this match include the current player among its Korean players?
  const matchHasPlayer = (m) => (m.koreanPlayers || [m.koreanPlayer]).some(kp => kp?.name === player.name);
  const playerKpInMatch = (m) => (m.koreanPlayers || [m.koreanPlayer]).find(kp => kp?.name === player.name) || m.koreanPlayer;

  // Recent matches from live API data
  const recentLiveMatches = React.useMemo(() => {
    return liveApiMatches
      .filter(m => matchHasPlayer(m) && (
        m.status === 'STATUS_FINAL' || m.status === 'STATUS_FULL_TIME' ||
        m.status === 'final' || m.status === 'STATUS_END_PERIOD' || m.status === 'STATUS_FINAL_PEN'
      ))
      .sort((a, b) => new Date(b.fullDate || 0) - new Date(a.fullDate || 0))
      .slice(0, 5)
      .map(m => {
        const kp = playerKpInMatch(m);
        const isHome = kp.team === m.home.code;
        const myScore = isHome ? m.home.score : m.away.score;
        const theirScore = isHome ? m.away.score : m.home.score;
        const opp = isHome ? m.away.name : m.home.name;
        const result = myScore > theirScore ? 'W' : myScore < theirScore ? 'L' : 'D';
        const goals = (m.events||[]).filter(e => e.type?.startsWith('goal') && e.player === player.name).length;
        const assists = (m.events||[]).filter(e => e.type === 'assist' && e.player === player.name).length;
        const contrib = player.sport === '야구'
          ? (() => {
              const ab = kp.atBats || 0, h = kp.hits || 0, hr = kp.homeRuns || 0, rbi = kp.rbi || 0, sb = kp.stolenBases || 0;
              const parts = [];
              if (ab > 0 || h > 0) parts.push(`${ab}타수 ${h}안타`);
              if (hr > 0) parts.push(`${hr}HR`);
              if (rbi > 0) parts.push(`${rbi}타점`);
              if (sb > 0) parts.push(`${sb}도루`);
              return parts.join(' ') || '-';
            })()
          : [goals > 0 && `${goals}골`, assists > 0 && `${assists}도움`].filter(Boolean).join(' ') || '-';
        const d = new Date(m.fullDate);
        const date = `${d.getMonth()+1}.${d.getDate()}`;
        return { opp, result, score:`${myScore}-${theirScore}`, contrib, date };
      });
  }, [liveApiMatches, player.name]);

  const resultColor = { W:'#2cc96d', D:'rgba(255,193,7,0.9)', L:'var(--acc)' };
  const resultLabel = { W:'승', D:'무', L:'패' };

  // Next upcoming match for this player
  const upcomingMatch = React.useMemo(() => {
    const now = Date.now();
    return liveApiMatches
      .filter(m => matchHasPlayer(m) && !m.live && m.fullDate && new Date(m.fullDate).getTime() > now)
      .sort((a, b) => new Date(a.fullDate) - new Date(b.fullDate))[0];
  }, [liveApiMatches, player.name]);

  const goals   = player.sport === '야구' ? (liveStats?.goals   ?? player.goals  ) : player.goals;
  const assists = player.sport === '야구' ? (liveStats?.assists ?? player.assists) : player.assists;
  const matches = player.sport === '야구' ? (liveStats?.matches ?? player.matches) : player.matches;
  const rating  = liveStats?.rating  ?? player.rating.toFixed(1);

  const statRows = player.sport === '축구' ? [
    ['골', goals], ['어시스트', assists], ['출전', matches], ['평점', rating],
  ] : player.sport === '야구' && liveStats ? [
    ['출전', liveStats.matches], ['안타', liveStats.hits], ['홈런', liveStats.homeRuns], ['타율', liveStats.avg],
  ] : player.sport === '야구' ? [
    ['출전', player.matches], ['나이', player.age],
  ] : player.sport === '배드민턴' ? [
    ['경기', player.matches], ['승', player.wins ?? 0], ['승률', `${player.winRate ?? 0}%`],
  ] : [
    ['출전', player.matches], ['나이', player.age],

  return (
    <div style={{ flex:1, overflow:'auto', background:'var(--bg)' }} className="scrollbar-hide screen-slide-in">
      {/* Hero */}
      <div style={{ position:'relative', height:320, overflow:'hidden' }}>
        {(() => {
          const LANDSCAPE = { '손흥민': 'heungmin.jpg', '이강인': 'kangin.jpg', '김민재': 'minjae.jpg', '황희찬': 'heechan.jpg', '황인범': 'inbeom.jpg', '조규성': 'guesung.jpg', '이한범': 'hanbeom.jpg', '오현규': 'hyungyu.jpg', '양현준': 'hyunjun.jpg', '백승호': 'seungho.jpg', '배준호': 'junho.jpg', '엄지성': 'jisung.jpg', '설영우': 'youngwoo.jpg', '김하성': 'haseong.jpg', '이정후': 'junghoo.jpg', '김혜성': 'hyeseong.jpg', '이재성': 'jaesung.jpg', '홍현석': 'hyunseok.jpg', '정우영': 'wooyeong.jpg', '카스트로프': 'castrop.jpg', '박승수': 'seungsoo.jpg', '김지수': 'jisoo.jpg', '양민혁': 'minhyeok.jpg', '이태석': 'taeseok.jpg', '김민수': 'minsu.jpg', '김예건': 'yegeon.jpg', '송성문': 'songsm.jpg' };
          const file = LANDSCAPE[player.name];
          return file
            ? <img src={`image/landscape/${file}`} alt={player.name} style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', objectPosition:'50% 25%' }}/>
            : <PlayerPhoto player={player} style={{ position:'absolute', inset:0 }}/>;
        })()}
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.05) 18%, rgba(0,0,0,0) 46%, rgba(0,0,0,0.45) 76%, var(--bg) 100%)' }}/>
        <div style={{ position:'absolute', top:12, left:20, right:20, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <BackBtn onBack={onBack} nativeHandled/>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          {/* 선수별 알림 on/off — 팔로우한 선수만 의미가 있어 팔로우 중일 때만 노출 */}
          {followed && onToggleMute && !(typeof window !== 'undefined' && window.__nativeChrome) && (
            <button onClick={onToggleMute} aria-label={muted ? '알림 켜기' : '알림 끄기'}
              style={{ width:CTRL_H, height:CTRL_H, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
                background:'rgba(0,0,0,0.35)',
                backdropFilter:'blur(10px)', WebkitBackdropFilter:'blur(10px)',
                border:'0.5px solid rgba(255,255,255,0.28)',
                color: muted ? 'rgba(255,255,255,0.6)' : '#fff', cursor:'pointer', padding:0, transition:'all 0.2s' }}>
              <svg width="17" height="17" viewBox="0 0 22 22" fill="none">
                <path d="M11 2a7 7 0 00-7 7v4l-1.5 2.5h17L18 13V9a7 7 0 00-7-7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" fill="none"/>
                <path d="M9 18.5a2 2 0 004 0" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                {muted && <path d="M3 3l16 16" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>}
              </svg>
            </button>
          )}
          {!(typeof window !== 'undefined' && window.__nativeChrome) && (
          <button onClick={handleFollowClick} style={{ display:'flex', alignItems:'center', gap:6, background:'rgba(0,0,0,0.35)', backdropFilter:'blur(10px)', border:'0.5px solid rgba(255,255,255,0.28)', height:CTRL_H, boxSizing:'border-box', borderRadius:CTRL_H/2, padding:'0 14px', color:'#fff', fontSize:13, fontWeight:700, cursor:'pointer', transition:'all 0.2s' }}>
            {followed
              ? <><svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>팔로우 중</>
              : <>+ 팔로우</>}
          </button>
          )}
          </div>
        </div>
        <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'0 20px 20px' }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
            <span style={{ fontSize:11, color:'var(--acc)', fontWeight:700, letterSpacing:1.2, textTransform:'uppercase', background:'rgba(230,48,48,0.15)', borderRadius:6, padding:'3px 8px' }}>{player.sport}</span>
            <span style={{ fontSize:11, color:'rgba(255,255,255,0.5)', fontWeight:600 }}>{player.position}</span>
          </div>
          <div style={{ fontSize:36, fontWeight:900, color:'#fff', letterSpacing:-1.5, lineHeight:1, marginBottom:6, textShadow:'0 2px 12px rgba(0,0,0,0.5)' }}>
            <span style={{ ...NUM, color:'rgba(255,255,255,0.3)', fontSize:20, marginRight:6 }}>#{player.number}</span>
            {player.name}
          </div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,0.55)' }}>{player.nameEn} · {player.team} · {player.league}</div>
          {player.injury && (() => { const s = injuryStyle(player.injury); return (
            <div style={{ marginTop:10, display:'inline-flex', alignItems:'center', gap:6, background:s.bg, border:`0.5px solid ${s.bd}`, borderRadius:10, padding:'6px 10px' }}>
              <span style={{ fontSize:16, fontWeight:900, color:s.ic }}>{s.icon}</span>
              <span style={{ fontSize:12, fontWeight:700, color:s.fg }}>{player.injury.label}</span>
            </div>

      </div>

      {/* Key stats strip */}
      <div style={{ display:'flex', margin:'0 16px 14px', background:'var(--surface)', borderRadius:16, border:'0.5px solid var(--border)' }}>
        {statRows.map(([label, val], i, arr) => (
