name: bongeunsa-deploy
# 봉은사 메타버스(bongeunsa/)를 Cloudflare Workers에 올린다. 화면(web/dist)과 실시간 서버가 한 Worker에 같이 간다.
# 필요한 저장소 비밀값(Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  ("Edit Cloudflare Workers" 템플릿으로 만든 토큰)
#   CLOUDFLARE_ACCOUNT_ID
# main(또는 작업 브랜치 claude/bongeunsa)에 bongeunsa/ 변경이 들어오면 자동으로 돈다. main에 들어간 뒤에는 Actions 탭에서 손으로도 돌릴 수 있다.
on:
  push:
    branches: [main, claude/bongeunsa]
    paths: ['bongeunsa/**', '.github/workflows/bongeunsa-deploy.yml']
  workflow_dispatch: {}
concurrency:
  group: bongeunsa-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 저장소 비밀값을 먼저 넣어 주세요"
            exit 1
          fi
      - name: Install
        run: |
          npm ci --prefix bongeunsa/web
          npm ci --prefix bongeunsa/server
      - name: Test
        run: |
          npm --prefix bongeunsa/web run typecheck
          npm --prefix bongeunsa/web test
          npm --prefix bongeunsa/server run typecheck
      - name: Build and deploy
        working-directory: bongeunsa/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
