<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <title>해외 축구 응원 주막</title>
    <!-- 링크 미리보기(쓰레드·카카오톡 등). 그림은 public/og.jpg → 빌드하면 /cheer/og.jpg -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="주모" />
    <meta property="og:title" content="코리안리거 응원 주막" />
    <meta property="og:description" content="해외파 한국 선수 경기를 같이 보며 응원하는 3D 주막이에요." />
    <meta property="og:url" content="https://jumak.dev/cheer/" />
    <meta property="og:image" content="https://jumak.dev/cheer/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="한복 입은 손님들이 평상에 앉아 TV를 보는 응원 주막" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      /* 번들(자바스크립트)을 불러오지 못했을 때: 앱(부모 창)에 'error'를 알리고 한 줄 안내를 띄운다.
         정상이면 main.ts가 화면이 뜬 뒤 __jumoCheerReady를 켜서 이 안내는 나오지 않는다.
         단, 처음 한 번은 스스로 고친다. 배포가 바뀌는 몇 초 사이에 옛 배포가 새 파일 이름에 웹페이지(HTML)를
         돌려주고, 브라우저가 그걸 1년짜리 캐시(immutable)로 붙잡아 다시 열어도 계속 실패했다(제보, 2026-10-31).
         그래서 /cheer/assets/ 파일을 캐시를 건너뛰고 다시 받아(캐시를 갈아 끼움) 새로 고친다. 1분 안에 또
         실패하면 그때 안내를 띄운다. */
      (function () {
        var HEAL_KEY = 'jumo-cheer-heal';
        var HEAL_GAP_MS = 60000;
        function healedRecently() {
          try {
            return Date.now() - Number(sessionStorage.getItem(HEAL_KEY) || 0) < HEAL_GAP_MS;
          } catch (_) {}
          var m = /[?&]heal=(\d+)/.exec(location.search);
          return !!m && Date.now() - Number(m[1]) < HEAL_GAP_MS;
        }
        // 저장소를 못 쓰는 창(사생활 보호 등)에서는 주소에 표시해 두고 다시 연다
        function reloadMarked() {
          try {
            sessionStorage.setItem(HEAL_KEY, String(Date.now()));
            location.reload();
            return;
          } catch (_) {}
          var q = location.search.replace(/([?&])heal=\d+&?/, '$1').replace(/[?&]$/, '');
          location.replace(location.pathname + q + (q ? '&' : '?') + 'heal=' + Date.now() + location.hash);
        }
        function heal() {
          var seen = {};
          var urls = [];
          function add(u) {
            if (!u || u.indexOf('/cheer/assets/') < 0 || seen[u]) return;
            seen[u] = 1;
            urls.push(u);
          }
          try {
            performance.getEntriesByType('resource').forEach(function (r) { add(r.name); });
          } catch (_) {}
          var els = document.querySelectorAll('script[src], link[href]');
          for (var i = 0; i < els.length; i++) add(els[i].src || els[i].href);
          var done = false;
          function go() {
            if (done) return;
            done = true;
            reloadMarked();
          }
          setTimeout(go, 5000);
          // cache: 'reload' 는 네트워크에서 새로 받아 브라우저 캐시를 그 응답으로 바꿔 둔다
          Promise.all(urls.map(function (u) {
            return fetch(u, { cache: 'reload', credentials: 'same-origin' }).catch(function () {});
          })).then(go, go);
        }
        function fail() {
          try { window.parent.postMessage({ type: 'jumo-cheer', action: 'error' }, '*'); } catch (_) {}
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0b0d;color:#fff;font:17px/1.5 -apple-system,sans-serif;text-align:center';
          d.textContent = '화면을 열 수 없어요. 잠시 후 다시 시도해 주세요';
          document.body.appendChild(d);
        }
        function broken() {
          if (window.__jumoCheerReady || window.__jumoCheerFailed) return;
          window.__jumoCheerFailed = true;
          if (healedRecently()) fail();
          else heal();
        }
        window.addEventListener(
          'error',
          function (e) {
            // 우리 화면 코드(/cheer/assets/)만 본다 — 광고 차단기가 방문 집계(Cloudflare) 스크립트를
            // 막거나 그 스크립트가 오류를 내도 주막은 그대로 열려야 한다
            var t = e && e.target;
            var isScript = t && t.tagName === 'SCRIPT';
            if (isScript && String(t.src || '').indexOf(location.origin + '/cheer/assets/') !== 0) return;
            var f = (e && e.filename) || '';
            if (!isScript && (f && f.indexOf(location.origin) !== 0)) return;
            if (!isScript && !(e && e.message && /module|import|fetch/i.test(e.message))) return;
            broken();
          },
          true
        );
        // 공간 조각(jumak-*.js)을 못 불러온 경우 — Vite 가 알려 준다
        window.addEventListener('vite:preloadError', broken);
      })();
    </script>
    <!-- 3D 캔버스는 엔진이 #stage 안에 만든다 -->
    <div id="stage"></div>
    <!-- 버튼 막대, 설정 창, 로딩 화면 같은 UI가 3D 위에 겹쳐지는 자리 -->
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 방문 집계(Cloudflare Web Analytics, 쿠키 없음). jumak.dev 는 Cloudflare 프록시를 거치지 않아
         자동 집계가 안 되므로 스니펫으로 센다. 앱 안 iframe 으로 열려도 jumak.dev 방문으로 잡힌다 -->
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "98bae858f2d646fca5ef717a23a6ac13"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
