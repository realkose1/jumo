<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <title>해외 축구 응원 주막</title>
    <!-- 링크 미리보기(쓰레드·카카오톡 등). 그림은 public/og.jpg → 빌드하면 /cheer/og.jpg -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="주모" />
    <meta property="og:title" content="코리안리거 응원 주막" />
    <meta property="og:description" content="해외파 한국 선수 경기를 같이 보며 응원하는 3D 주막이에요." />
    <meta property="og:url" content="https://jumak.dev/cheer/" />
    <meta property="og:image" content="https://jumak.dev/cheer/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="한복 입은 손님들이 평상에 앉아 TV를 보는 응원 주막" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      /* 번들(자바스크립트)을 불러오지 못했을 때: 앱(부모 창)에 'error'를 알리고 한 줄 안내를 띄운다.
         정상이면 main.ts가 화면이 뜬 뒤 __jumoCheerReady를 켜서 이 안내는 나오지 않는다. */
      window.addEventListener(
        'error',
        function (e) {
          if (window.__jumoCheerReady || window.__jumoCheerFailed) return;
          var t = e && e.target;
          var isScript = t && t.tagName === 'SCRIPT';
          if (!isScript && !(e && e.message && /module|import|fetch/i.test(e.message))) return;
          window.__jumoCheerFailed = true;
          try { window.parent.postMessage({ type: 'jumo-cheer', action: 'error' }, '*'); } catch (_) {}
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0b0d;color:#fff;font:17px/1.5 -apple-system,sans-serif;text-align:center';
          d.textContent = '화면을 열 수 없어요. 잠시 후 다시 시도해 주세요';
          document.body.appendChild(d);
        },
        true
      );
    </script>
    <!-- 3D 캔버스는 엔진이 #stage 안에 만든다 -->
    <div id="stage"></div>
    <!-- 버튼 막대, 설정 창, 로딩 화면 같은 UI가 3D 위에 겹쳐지는 자리 -->
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
